name: Gate 2A AAB Resource Provenance Diagnostic

on:
  push:
    branches:
      - gate2a-aab-resource-provenance-diag

permissions:
  contents: read

jobs:
  isolate-png-encoding:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact-final ancestor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git merge-base --is-ancestor fb89f9780d43127156ec86a1d666292e11ffb7cd HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact-final head is not an ancestor of this isolated diagnostic branch.' }
          $changed = & git diff --name-only fb89f9780d43127156ec86a1d666292e11ffb7cd..HEAD
          $bad = @($changed | Where-Object { $_ -ne '.github/workflows/gate2a-aab-resource-provenance-diagnostic.yml' })
          if ($bad.Count -gt 0) { throw "Diagnostic branch mutated non-diagnostic paths: $($bad -join ', ')" }

      - name: Locate Android AAPT2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=$env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk=$env:ANDROID_HOME }
          $aapt2=Get-ChildItem -Path (Join-Path $sdk 'build-tools') -Recurse -Filter aapt2.exe -File | Sort-Object FullName | Select-Object -Last 1
          if (-not $aapt2) { throw 'aapt2.exe not found' }
          "AAPT2=$($aapt2.FullName)"
          "AAPT2_PATH=$($aapt2.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $aapt2.FullName version

      - name: Directly compile exact 192 PNG with AAPT2
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $src='icons/android/icons/icon_192.png'
          $sha=(Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant()
          "SOURCE_SHA256=$sha"
          New-Item -ItemType Directory -Force -Path 'diag-original/mipmap-xxxhdpi' | Out-Null
          Copy-Item $src 'diag-original/mipmap-xxxhdpi/icon.png'
          & $env:AAPT2_PATH compile --dir diag-original -o diag-original.zip 2>&1 | ForEach-Object { "AAPT2_ORIGINAL $_" }
          "AAPT2_ORIGINAL_EXIT=$LASTEXITCODE"

      - name: Re-encode pixels losslessly and compile sanitized PNG
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $src=(Resolve-Path 'icons/android/icons/icon_192.png').Path
          New-Item -ItemType Directory -Force -Path 'diag-sanitized/mipmap-xxxhdpi' | Out-Null
          $dst=(Join-Path $PWD 'diag-sanitized/mipmap-xxxhdpi/icon.png')
          $img=[System.Drawing.Image]::FromFile($src)
          try {
            "DECODED_WIDTH=$($img.Width)"
            "DECODED_HEIGHT=$($img.Height)"
            "DECODED_PIXELFORMAT=$($img.PixelFormat)"
            $img.Save($dst,[System.Drawing.Imaging.ImageFormat]::Png)
          } finally { $img.Dispose() }
          $origSha=(Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant()
          $newSha=(Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          "ORIGINAL_SHA256=$origSha"
          "SANITIZED_SHA256=$newSha"
          "SANITIZED_BYTES=$((Get-Item $dst).Length)"
          $ErrorActionPreference='Continue'
          & $env:AAPT2_PATH compile --dir diag-sanitized -o diag-sanitized.zip 2>&1 | ForEach-Object { "AAPT2_SANITIZED $_" }
          "AAPT2_SANITIZED_EXIT=$LASTEXITCODE"

      - name: Inspect PNG chunks and CRCs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import struct, zlib
          for path in [r"icons/android/icons/icon_192.png", r"diag-sanitized/mipmap-xxxhdpi/icon.png"]:
              data=open(path,'rb').read()
              print('PNG_FILE',path,'bytes',len(data))
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              p=8
              i=0
              while p+12 <= len(data):
                  n=struct.unpack('>I',data[p:p+4])[0]
                  typ=data[p+4:p+8]
                  payload=data[p+8:p+8+n]
                  stored=struct.unpack('>I',data[p+8+n:p+12+n])[0]
                  calc=zlib.crc32(typ+payload)&0xffffffff
                  print('CHUNK',i,typ.decode('latin1'),'len',n,'crc',f'{stored:08x}','calc',f'{calc:08x}','ok',stored==calc)
                  p += 12+n
                  i += 1
                  if typ == b'IEND': break
              print('TRAILING_BYTES',len(data)-p)
          '@ | python -

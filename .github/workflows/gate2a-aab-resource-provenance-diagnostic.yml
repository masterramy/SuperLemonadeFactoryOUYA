name: Gate 2A AAB Resource Provenance Diagnostic

on:
  push:
    branches:
      - gate2a-aab-resource-provenance-diag

permissions:
  contents: read

jobs:
  isolate-png-encoding:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact-final ancestor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git merge-base --is-ancestor fb89f9780d43127156ec86a1d666292e11ffb7cd HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact-final head is not an ancestor of this isolated diagnostic branch.' }
          $changed = & git diff --name-only fb89f9780d43127156ec86a1d666292e11ffb7cd..HEAD
          $bad = @($changed | Where-Object { $_ -ne '.github/workflows/gate2a-aab-resource-provenance-diagnostic.yml' })
          if ($bad.Count -gt 0) { throw "Diagnostic branch mutated non-diagnostic paths: $($bad -join ', ')" }

      - name: Inspect original PNG chunks and CRCs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import struct, zlib
          path=r"icons/android/icons/icon_192.png"
          data=open(path,'rb').read()
          print('PNG_FILE',path,'bytes',len(data))
          print('SHA256_IMPORT_VIA_PYTHON')
          import hashlib; print(hashlib.sha256(data).hexdigest())
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          p=8; i=0; all_ok=True
          while p+12 <= len(data):
              n=struct.unpack('>I',data[p:p+4])[0]
              typ=data[p+4:p+8]
              payload=data[p+8:p+8+n]
              stored=struct.unpack('>I',data[p+8+n:p+12+n])[0]
              calc=zlib.crc32(typ+payload)&0xffffffff
              ok=stored==calc; all_ok &= ok
              print('CHUNK',i,typ.decode('latin1'),'len',n,'crc',f'{stored:08x}','calc',f'{calc:08x}','ok',ok)
              p += 12+n; i += 1
              if typ == b'IEND': break
          print('TRAILING_BYTES',len(data)-p)
          print('ALL_CRC_OK',all_ok)
          '@ | python -

      - name: Locate Android AAPT2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=$env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk=$env:ANDROID_HOME }
          $aapt2=Get-ChildItem -Path (Join-Path $sdk 'build-tools') -Recurse -Filter aapt2.exe -File | Sort-Object FullName | Select-Object -Last 1
          if (-not $aapt2) { throw 'aapt2.exe not found' }
          "AAPT2=$($aapt2.FullName)"
          "AAPT2_PATH=$($aapt2.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $aapt2.FullName version

      - name: Reproduce exact PNG AAPT2 crash without failing diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'diag-original/mipmap-xxxhdpi' | Out-Null
          Copy-Item 'icons/android/icons/icon_192.png' 'diag-original/mipmap-xxxhdpi/icon.png'
          $p=Start-Process -FilePath $env:AAPT2_PATH -ArgumentList @('compile','--dir','diag-original','-o','diag-original.zip') -PassThru -Wait -NoNewWindow
          "AAPT2_ORIGINAL_EXIT=$($p.ExitCode)"

      - name: Cleanly re-encode decoded pixels and test AAPT2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $src=(Resolve-Path 'icons/android/icons/icon_192.png').Path
          New-Item -ItemType Directory -Force -Path 'diag-sanitized/mipmap-xxxhdpi' | Out-Null
          $dst=(Join-Path (Get-Location).Path 'diag-sanitized/mipmap-xxxhdpi/icon.png')
          $img=[System.Drawing.Image]::FromFile($src)
          try {
            "DECODED_WIDTH=$($img.Width)"
            "DECODED_HEIGHT=$($img.Height)"
            "DECODED_PIXELFORMAT=$($img.PixelFormat)"
            $bmp=New-Object System.Drawing.Bitmap $img
          } finally { $img.Dispose() }
          try { $bmp.Save($dst,[System.Drawing.Imaging.ImageFormat]::Png) } finally { $bmp.Dispose() }
          $origSha=(Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant()
          $newSha=(Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          "ORIGINAL_SHA256=$origSha"
          "SANITIZED_SHA256=$newSha"
          "SANITIZED_BYTES=$((Get-Item $dst).Length)"
          $p=Start-Process -FilePath $env:AAPT2_PATH -ArgumentList @('compile','--dir','diag-sanitized','-o','diag-sanitized.zip') -PassThru -Wait -NoNewWindow
          "AAPT2_SANITIZED_EXIT=$($p.ExitCode)"

      - name: Inspect sanitized PNG chunks and CRCs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import struct, zlib, hashlib
          path=r"diag-sanitized/mipmap-xxxhdpi/icon.png"
          data=open(path,'rb').read()
          print('PNG_FILE',path,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
          p=8; i=0; all_ok=True
          while p+12 <= len(data):
              n=struct.unpack('>I',data[p:p+4])[0]; typ=data[p+4:p+8]; payload=data[p+8:p+8+n]
              stored=struct.unpack('>I',data[p+8+n:p+12+n])[0]; calc=zlib.crc32(typ+payload)&0xffffffff
              ok=stored==calc; all_ok &= ok
              print('CHUNK',i,typ.decode('latin1'),'len',n,'crc',f'{stored:08x}','calc',f'{calc:08x}','ok',ok)
              p += 12+n; i += 1
              if typ == b'IEND': break
          print('TRAILING_BYTES',len(data)-p); print('ALL_CRC_OK',all_ok)
          '@ | python -

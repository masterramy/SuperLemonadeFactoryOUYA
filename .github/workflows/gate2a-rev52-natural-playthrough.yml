name: Gate 2A Rev52 Natural Map-Aware Playthrough

on:
  push:
    branches:
      - qa/rev52-map-aware-natural-playthrough
    paths:
      - .github/workflows/gate2a-rev52-natural-playthrough.yml
      - qa/map_aware_natural_playthrough.py
      - src/PCPlayState.as
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  map-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Validate natural-player implementation and exact authored maps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/map_aware_natural_playthrough.py
          python3 qa/map_aware_natural_playthrough.py --map-only
          python3 - <<'PY'
          import json,pathlib
          maps=json.loads(pathlib.Path("natural-playthrough/source-map-manifest.json").read_text())
          assert len(maps)==36
          assert all(m["exit"]["x"]>=0 and m["characters"] for m in maps)
          assert maps[1]["exit"]["x"]==1320
          text=pathlib.Path("src/PCPlayState.as").read_text()
          assert 'qa-natural-route.txt' in text
          assert 'FileMode.WRITE' in text
          assert 'player1.x' in text and 'player2.x' in text
          assert 'Registry.levelNumber' in text
          assert 'player1.x =' not in text[text.index("private function qaObserve"):text.index("override public function create")]
          assert 'levelOver()' not in text[text.index("private function qaObserve"):text.index("override public function create")]
          print("read-only telemetry and source map checks: PASS")
          PY
          git diff --name-only 23bbad79a1121df3a34d92a951b80792b84c0b06 HEAD -- \
            src data application.xml BUILD_ANDROID_VALIDATION.bat BUILD_ANDROID_PRODUCTION.bat tools \
            > natural-playthrough/runtime-delta.txt
          grep -Fxq src/PCPlayState.as natural-playthrough/runtime-delta.txt
          test "$(wc -l < natural-playthrough/runtime-delta.txt)" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-natural-route-map-and-provenance
          path: natural-playthrough
          if-no-files-found: error

  build-exploratory-runtime:
    runs-on: windows-2025
    timeout-minutes: 45
    needs: map-and-isolation
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Install Android platform prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)){ $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME }
          $sdk=Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if($null -eq $sdk){ $sdkPath=Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat' } else { $sdkPath=$sdk.Source }
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if($LASTEXITCODE -ne 0){ throw 'Android SDK 36 install failed.' }
          Remove-Item -LiteralPath 'AIRSDK_Windows.zip' -Force -ErrorAction SilentlyContinue
      - name: Compile QA-only read-only telemetry APK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File tools/build-emulator-apk.ps1
          if($LASTEXITCODE -ne 0){ throw "QA emulator APK build failed: $LASTEXITCODE" }
          Get-FileHash -Algorithm SHA256 'dist/emulator-qa/SLF-emulator-x64.apk' | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-natural-player-debug-apk
          path: dist/emulator-qa
          if-no-files-found: error

  natural-playthrough:
    needs: build-exploratory-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev52-natural-player-debug-apk
          path: exploratory
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run map-aware natural playthrough with checkpoint evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python3 qa/map_aware_natural_playthrough.py --apk exploratory/SLF-emulator-x64.apk --steps 70
      - name: Upload actual decisions and rendered checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-natural-playthrough-evidence
          path: natural-playthrough
          if-no-files-found: error

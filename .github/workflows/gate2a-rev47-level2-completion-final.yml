name: Gate 2A Rev47 Final Level 2 Completion Proof

on:
  push:
    branches:
      - qa/rev47-level2-completion-final
    paths:
      - .github/workflows/gate2a-rev47-level2-completion-final.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RELEASE_HEAD: 079a68ba800af3d15e97f140cc5ab1df7ce38332
  SLF_NO_PAUSE: '1'

jobs:
  build-emulator-runtime:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 4
      - name: Prove QA-only child of exact release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((git rev-parse HEAD^) | Out-String).Trim()
          if($parent -ne $env:RELEASE_HEAD){ throw "QA parent mismatch: $parent" }
          $changed=@(git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/gate2a-rev47-level2-completion-final.yml'){ throw "Unexpected QA branch delta: $($changed -join ', ')" }
          $runtime=@(git diff --name-only HEAD^ HEAD -- src data icons application.xml obj lib tools)
          if($runtime.Count -ne 0){ throw "QA workflow changed runtime/build inputs: $($runtime -join ', ')" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Ensure Android SDK 36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)){ $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME }
          $sdk=Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if($null -eq $sdk){ $sdkPath=Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat' } else { $sdkPath=$sdk.Source }
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if($LASTEXITCODE -ne 0){ throw 'Android SDK setup failed.' }
          Remove-Item -LiteralPath 'AIRSDK_Windows.zip' -Force -ErrorAction SilentlyContinue
      - name: Build x64 rendered-QA package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File tools/build-emulator-apk.ps1
          if($LASTEXITCODE -ne 0){ throw "Emulator package build failed: $LASTEXITCODE" }
          $id=Get-Content -Raw 'dist/emulator-qa/proof/emulator-identity.txt'
          if($id -notmatch "commit=$env:RELEASE_HEAD"){ throw 'Emulator identity is not tied to release parent.' }
          if($id -notmatch 'effective_permissions=none'){ throw 'Unexpected emulator permissions.' }
          Get-FileHash -Algorithm SHA256 'dist/emulator-qa/SLF-emulator-x64.apk' | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev47-level2-runtime
          path: dist/emulator-qa
          if-no-files-found: error

  level2:
    needs: build-emulator-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev47-level2-runtime
          path: runtime
      - name: Install visual adjudication dependency
        run: python3 -m pip install --disable-pip-version-check --quiet opencv-python-headless==4.12.0.88 pillow==11.3.0
      - name: Write ordinary-input proof harness
        shell: bash
        run: |
          cat > level2-proof.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=runtime/SLF-emulator-x64.apk
          PACKAGE=com.ramybaheeg.slfport
          OUT=proof
          DEV=/dev/input/event1
          mkdir -p "$OUT"

          capture(){
            tag="$1"
            adb exec-out screencap -p > "$OUT/$tag.png"
            adb shell dumpsys window > "$OUT/$tag.window.txt" 2>&1
            adb logcat -d > "$OUT/$tag.logcat.txt" 2>&1
            pid="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            focus="$(grep -m1 'mCurrentFocus=' "$OUT/$tag.window.txt" || true)"
            printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/$tag.state.txt"
            test -n "$pid"
            echo "$focus" | grep -q "$PACKAGE"
            ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/$tag.logcat.txt" > "$OUT/$tag.fatal.txt"
          }
          dismiss_system_ui(){
            for i in 1 2 3 4; do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$OUT/window-$i.xml" >/dev/null 2>&1 || true
              coords="$(python3 - "$OUT/window-$i.xml" <<'PY' || true
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse(sys.argv[1]).getroot()
          except Exception:raise SystemExit
          for wanted in ('Got it','Wait','OK','Continue'):
              for n in r.iter('node'):
                  if n.attrib.get('text')==wanted:
                      m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                      if m:
                          a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2); raise SystemExit
          PY
          )"
              test -z "$coords" || adb shell input tap $coords >/dev/null 2>&1 || true
              sleep 1
            done
          }
          launch(){
            tag="$1"
            adb logcat -c
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch-$tag.txt" 2>&1
            sleep 5
            dismiss_system_ui
            sleep 5
          }
          down(){ adb shell "sendevent $DEV 1 $1 1; sendevent $DEV 0 0 0"; }
          up(){ adb shell "sendevent $DEV 1 $1 0; sendevent $DEV 0 0 0"; }
          jr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; wait "$p" || true; sleep .20; }
          dr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; sleep .16; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; wait "$p" || true; sleep .20; }
          wl(){ adb shell input keyevent --longpress KEYCODE_DPAD_LEFT >/dev/null 2>&1 || true; sleep .25; }
          rawdr(){ down 106; sleep .04; down 46; sleep .30; up 46; sleep .06; down 46; sleep .08; up 46; sleep .22; up 106; }
          rawleft_push(){ down 105; sleep 1.20; up 105; }
          rawleft_park(){ down 105; sleep .80; up 105; }
          liselot_spike(){ down 106; sleep .04; down 46; sleep .30; up 46; sleep .16; down 46; sleep .10; up 46; sleep .42; up 106; sleep .28; }
          andre_jump_dash(){ down 106; sleep .04; down 46; sleep .25; up 46; sleep .05; down 45; sleep .42; up 45; sleep .18; up 106; sleep .28; }
          right_hold(){ down 106; sleep "$1"; up 106; sleep .35; }

          completion_score(){
            img="$1"; out="$2"
            python3 - "$img" "$out" <<'PY'
          import cv2,sys
          hay=cv2.imread(sys.argv[1],cv2.IMREAD_COLOR)
          tpl=cv2.imread('data/buttons/levelCompleteGraphic.png',cv2.IMREAD_COLOR)
          if hay is None or tpl is None:
              open(sys.argv[2],'w').write('score=-1\n'); raise SystemExit
          best=-1.0
          for scale in [1.0+i*.125 for i in range(25)]:
              t=cv2.resize(tpl,None,fx=scale,fy=scale,interpolation=cv2.INTER_NEAREST)
              if t.shape[0] < hay.shape[0] and t.shape[1] < hay.shape[1]:
                  best=max(best,float(cv2.matchTemplate(hay,t,cv2.TM_CCOEFF_NORMED).max()))
          open(sys.argv[2],'w').write(f'score={best:.6f}\n')
          PY
          }
          is_complete(){
            completion_score "$1" "$OUT/completion-scores.txt.tmp"
            cat "$OUT/completion-scores.txt.tmp" >> "$OUT/completion-scores.txt"
            awk -F= '$1=="score" && $2+0 >= 0.50 {ok=1} END{exit ok?0:1}' "$OUT/completion-scores.txt.tmp"
          }

          adb root > "$OUT/adb-root.txt" 2>&1
          sleep 2
          adb wait-for-device
          adb shell id > "$OUT/root-identity.txt"
          adb shell "test -w $DEV"
          adb shell "getevent -lp $DEV" > "$OUT/keyboard-device.txt" 2>&1
          for key in KEY_C KEY_RIGHT KEY_LEFT KEY_X KEY_V; do grep -q "$key" "$OUT/keyboard-device.txt"; done

          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell wm size 1920x1080
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true

          # Fresh local state, ordinary menu navigation only.
          adb shell pm clear "$PACKAGE" > "$OUT/pm-clear.txt" 2>&1
          launch fresh
          capture 00-title
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 7
          capture 00-main-menu
          adb shell input keyevent KEYCODE_X; sleep 5
          capture 00-level-select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12
          adb shell input keyevent KEYCODE_X; sleep 10
          capture 01-level2-start

          # Replay the strongest previously rendered crate-left sequence using
          # only normal shipping controls. No save edit, teleport, debug key,
          # state injection, or forced completion.
          for i in $(seq 1 7); do jr; done
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 11); do dr; done
          for i in $(seq 1 6); do wl; done
          adb shell input keyevent KEYCODE_V; sleep 2
          capture 06-andre-before-crate-sequence
          adb shell input keyevent KEYCODE_V; sleep 2
          dr; sleep 1
          dr; sleep 1
          rawdr; sleep 1
          rawdr; sleep 1
          capture 13-liselot-right-of-crate
          rawleft_push; sleep 1.5
          capture 15-crate-left-settled

          # Use the crate route, then independently move both characters over
          # the spike and through the exit corridor.
          adb shell input keyevent KEYCODE_V; sleep 1
          rawleft_park; sleep 1
          capture 17-andre-parked
          adb shell input keyevent KEYCODE_V; sleep 1
          for i in $(seq 1 4); do liselot_spike; done
          right_hold 1.1
          capture 22-liselot-right-route
          adb shell input keyevent KEYCODE_V; sleep 1
          for i in $(seq 1 14); do andre_jump_dash; done
          right_hold .9
          capture 30-andre-right-route
          adb shell input keyevent KEYCODE_V; sleep 1
          for i in $(seq 1 4); do liselot_spike; done
          right_hold .9
          sleep 5
          capture 40-completion-candidate-a

          complete=0
          if is_complete "$OUT/40-completion-candidate-a.png"; then complete=1; fi

          # If the first timing lands short, use bounded ordinary-input nudges
          # for each character rather than changing game state.
          if test "$complete" = 0; then
            adb shell input keyevent KEYCODE_V; sleep 1
            for i in $(seq 1 5); do andre_jump_dash; done
            right_hold .8
            adb shell input keyevent KEYCODE_V; sleep 1
            for i in $(seq 1 5); do liselot_spike; done
            right_hold .8
            sleep 5
            capture 41-completion-candidate-b
            if is_complete "$OUT/41-completion-candidate-b.png"; then complete=1; fi
          fi

          printf 'completion_proven=%s\nordinary_shipping_inputs_only=true\nsave_or_game_state_edit=false\nteleport=false\nforced_completion=false\n' "$complete" > "$OUT/result.txt"

          if test "$complete" = 1; then
            # Wait for the completion UI to settle, then use its ordinary Next
            # Level action and capture the naturally loaded Level 3.
            sleep 6
            adb shell input keyevent KEYCODE_X; sleep 12
            capture 50-natural-next-level

            # Cold persistence: force-stop only, then navigate normally back to
            # level select and attempt Level 3.
            launch cold
            capture 60-cold-title
            adb shell input keyevent KEYCODE_X; sleep 3
            adb shell input keyevent KEYCODE_X; sleep 7
            capture 61-cold-main-menu
            adb shell input keyevent KEYCODE_X; sleep 6
            capture 62-cold-level-select
            adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep .6
            adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep .6
            adb shell input keyevent KEYCODE_X; sleep 12
            adb shell input keyevent KEYCODE_X; sleep 8
            capture 63-cold-level3-attempt
            printf 'cold_level3_attempt_captured=true\n' >> "$OUT/result.txt"
          else
            printf 'cold_level3_attempt_captured=false\n' >> "$OUT/result.txt"
          fi
          EOF
          chmod +x level2-proof.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute maximal ordinary-input Level 2 route
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash level2-proof.sh

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev47-level2-completion-proof
          path: proof
          if-no-files-found: error

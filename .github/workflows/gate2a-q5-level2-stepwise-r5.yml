name: Gate 2A Q5 AFC2 Level 2 Stepwise R5

on:
  push:
    branches: [qa/q5-afc2-level2-r5]
    paths: [.github/workflows/gate2a-q5-level2-stepwise-r5.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  level2-stepwise-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 16

      - name: Verify QA-only branch and runtime equivalence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          FROZEN=afc2e65a65dc95e35ef3391b92be8adc7827e16f
          CUSTOMER=9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c
          test "$(git rev-parse HEAD^)" = "$FROZEN"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gate2a-q5-level2-stepwise-r5.yml"
          git diff --name-only "$CUSTOMER..$FROZEN" | sort > proof/freeze-vs-customer.txt
          printf '%s\n' '.github/workflows/gate2a-windows-aab-builders-validation.yml' 'BUILD_AAB_PRODUCTION.bat' 'BUILD_AAB_VALIDATION.bat' 'tools/build-aab.ps1' | sort > proof/allowed.txt
          diff -u proof/allowed.txt proof/freeze-vs-customer.txt
          printf '%s\n' \
            'ordinary_inputs_only=true' \
            'save_or_game_state_edit=false' \
            'teleport=false' \
            'forced_completion=false' \
            'terminal_confirmation_after_probe=false' \
            'source_grounded_strategy=R4_SWITCH_then_one_Liselot_rightward_double_jump' \
            'source_basis=player2_has_airborne_second_jump_after_timeOffGround_gt_0.1_and_next_raised_platform_is_rightward' \
            > proof/method.txt

      - name: Download runtime-equivalent emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34777986347

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk
          test "$(wc -c < "$APK" | tr -d ' ')" = 35875619
          test "$(sha256sum "$APK" | awk '{print $1}')" = 53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2
          sha256sum "$APK" > proof/runtime-apk-sha256.txt

      - name: Write bounded source-grounded R5 probe
        shell: bash
        run: |
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk
          PACKAGE=com.ramybaheeg.slfport
          OUT=proof

          capture(){
            tag="$1"
            adb shell dumpsys window > "$OUT/window-$tag.txt" 2>&1
            adb exec-out screencap -p > "$OUT/$tag.png"
            adb logcat -d > "$OUT/logcat-$tag.txt" 2>&1
            pid=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-$tag.txt" || true)
            printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-$tag.txt"
            test -n "$pid"
            echo "$focus" | grep -q "$PACKAGE"
            ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-$tag.txt" > "$OUT/fatal-$tag.txt"
          }

          dismiss_text(){
            wanted="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0
            adb pull /sdcard/window.xml "$OUT/window-ui.xml" >/dev/null 2>&1 || return 0
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try: r=ET.parse('proof/window-ui.xml').getroot()
          except: raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:
                a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2); break
          PY
            )
            [ -z "$coords" ] || { adb shell input tap $coords >/dev/null 2>&1 || true; sleep 1; }
          }

          jump_right(){
            adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!
            sleep .05
            adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true
            wait "$p" || true
            sleep .20
          }

          liselot_double_right(){
            adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!
            sleep .05
            adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true
            sleep .16
            adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true
            wait "$p" || true
            sleep .20
          }

          walk_left(){
            adb shell input keyevent --longpress KEYCODE_DPAD_LEFT >/dev/null 2>&1 || true
            sleep .25
          }

          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          adb logcat -c
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1
          sleep 4
          for _ in 1 2 3 4; do dismiss_text 'Got it'; dismiss_text 'Wait'; sleep 1; done
          sleep 8

          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 8
          adb shell input keyevent KEYCODE_X; sleep 4
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12
          adb shell input keyevent KEYCODE_X; sleep 12
          capture 01-start

          for i in $(seq 1 7); do jump_right; done
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 11); do liselot_double_right; done
          for i in $(seq 1 6); do walk_left; done
          adb shell input keyevent KEYCODE_V; sleep 2
          capture 06-known-safe-prefix

          adb shell input keyevent KEYCODE_V; sleep 2
          capture 07-switch-once-to-liselot

          liselot_double_right
          capture 08-one-liselot-double-right
          printf 'Stopped immediately after one source-grounded Liselot rightward double-jump from the R4-proven switch state; no further input sent.\n' > "$OUT/result.txt"
          EOF
          chmod +x probe.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and run bounded probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-afc2-level2-stepwise-r5
          path: proof
          if-no-files-found: error

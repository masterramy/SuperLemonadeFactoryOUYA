name: Q6 Repaired Customer UI Regression

on:
  push:
    branches:
      - qa/q6-ui-regression-r1

permissions:
  actions: read
  contents: read

jobs:
  rendered-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify repair parent and QA-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4b9027134c1786a262df76df09b95ef34338ca87"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/q6-ui-regression.yml"
          grep -Fq 'new FlxSprite(20, 30)' src/PCCreditsState.as
          grep -Fq '0xffeeeccd' src/PCCreditsState.as

      - name: Download exact repaired APK from proven build run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: q6-credits-emulator-apk
          path: runtime-apk
          github-token: ${{ github.token }}
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 34750582742

      - name: Verify repaired APK provenance
        shell: bash
        run: |
          set -euo pipefail
          cat runtime-apk/q6-build-provenance.txt
          grep -Fq 'repair_commit=4b9027134c1786a262df76df09b95ef34338ca87' runtime-apk/q6-build-provenance.txt
          expected=$(sed -n 's/^apk_sha256=//p' runtime-apk/q6-build-provenance.txt | tr -d '\r')
          actual=$(sha256sum runtime-apk/SLF-q6-credits-x64.apk | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"
          printf 'apk_sha256=%s\nrepair_commit=4b9027134c1786a262df76df09b95ef34338ca87\nsource_run=34750582742\n' "$actual" > apk-provenance.txt

      - name: Write ordinary-input UI regression harness
        shell: bash
        run: |
          cat > q6-regression.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          APK=runtime-apk/SLF-q6-credits-x64.apk
          PACKAGE=com.ramybaheeg.slfport
          cp apk-provenance.txt evidence/
          adb install -r "$APK" > evidence/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true

          dismiss_text() {
            local wanted="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0
            adb pull /sdcard/window.xml evidence/window-ui.xml >/dev/null 2>&1 || return 0
            local coords
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          wanted=sys.argv[1]
          try: root=ET.parse('evidence/window-ui.xml').getroot()
          except Exception: raise SystemExit
          for node in root.iter('node'):
              if node.attrib.get('text') != wanted: continue
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
              if m:
                  x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); break
          PY
            )
            if [ -n "$coords" ]; then adb shell input tap $coords >/dev/null 2>&1 || true; sleep 1; fi
          }

          fresh_menu() {
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" >/dev/null 2>&1
            sleep 4
            for _ in 1 2 3 4; do dismiss_text "Got it"; dismiss_text "Wait"; sleep 1; done
            sleep 6
            adb shell input keyevent KEYCODE_X; sleep 2
            adb shell input keyevent KEYCODE_X; sleep 8
          }

          fresh_menu
          adb exec-out screencap -p > evidence/01-main-menu.png

          fresh_menu
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 3
          adb exec-out screencap -p > evidence/02-options.png

          fresh_menu
          for _ in 1 2; do adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1; done
          adb shell input keyevent KEYCODE_X; sleep 3
          adb exec-out screencap -p > evidence/03-help.png
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 3
          adb exec-out screencap -p > evidence/04-privacy.png

          fresh_menu
          for _ in 1 2 3; do adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1; done
          adb shell input keyevent KEYCODE_X; sleep 8
          adb exec-out screencap -p > evidence/05-credits.png

          adb shell dumpsys window > evidence/window.txt 2>&1
          adb logcat -d > evidence/logcat.txt 2>&1
          pid=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          focus=$(grep -m1 'mCurrentFocus=' evidence/window.txt || true)
          printf 'pid=%s\nfocus=%s\nordinary_shipping_inputs_only=true\nsave_or_game_state_mutation=none\n' "$pid" "$focus" > evidence/health.txt
          test -n "$pid"
          echo "$focus" | grep -q "$PACKAGE"
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|ANR in" evidence/logcat.txt > evidence/fatal-scan.txt; then exit 90; fi
          printf 'Q6_UI_REGRESSION=PASS_REQUIRES_RENDERED_ADJUDICATION\n' > evidence/result.txt
          EOF
          chmod +x q6-regression.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and render adjacent customer UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash q6-regression.sh

      - name: Upload rendered regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q6-repaired-ui-regression-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 7

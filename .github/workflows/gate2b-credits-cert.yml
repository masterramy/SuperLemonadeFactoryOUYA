name: Gate 2B Credits Render Cert

on:
  push:
    branches:
      - gate2b-credits-qa

permissions:
  contents: read
  actions: read

jobs:
  credits-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download exact-candidate build artifact from green run
        uses: actions/download-artifact@v4
        with:
          name: gate2b-candidate-build
          path: candidate-build
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 33904865814
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source receipt and write credits render script
        shell: bash
        run: |
          mkdir -p evidence
          cat candidate-build/source.txt | tee evidence/source.txt
          grep -q 'source_commit=24edfb3e2595223539036a996804f0137f3aed8f' candidate-build/source.txt
          sha256sum candidate-build/SLF-Port-emulator-x64.apk | tee evidence/apk-sha256.txt
          cat > credits.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PACKAGE="air.com.ramybaheeg.slfport"
          adb install -r candidate-build/SLF-Port-emulator-x64.apk > evidence/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb logcat -c
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > evidence/launch.txt 2>&1
          sleep 12
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 6
          # Main menu: Play=0, Options=1, Help=2, Credits=3.
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 4
          adb exec-out screencap -p > evidence/credits-port-info.png
          adb shell dumpsys window > evidence/window.txt
          adb logcat -d > evidence/logcat.txt
          test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"
          grep -m1 'mCurrentFocus=' evidence/window.txt | grep -q "$PACKAGE"
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" evidence/logcat.txt > evidence/fatal-scan.txt; then exit 31; fi
          echo 'PASS-CANDIDATE credits_surface_reached=yes source=24edfb3e2595223539036a996804f0137f3aed8f' > evidence/result.txt
          EOF
          chmod +x credits.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and capture credits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash credits.sh
      - name: Upload credits evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2b-credits-render
          path: evidence
          if-no-files-found: warn

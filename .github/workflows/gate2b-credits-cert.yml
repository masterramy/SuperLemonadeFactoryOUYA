name: Gate 2B Credits Render Cert

on:
  push:
    branches:
      - gate2b-credits-qa

permissions:
  contents: read

jobs:
  credits-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 24edfb3e2595223539036a996804f0137f3aed8f
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile and package x64 candidate
        shell: bash
        run: |
          mkdir -p bin dist evidence
          rm -f bin/SLFforOuya.swf dist/SLF-Port-emulator-x64.apk gate2b-qa.p12
          amxmlc -load-config+=obj/SLF_for_OuyaConfig.xml -output=bin/SLFforOuya.swf
          adt -certificate -validityPeriod 1 -cn "Gate 2B Credits QA" 2048-RSA gate2b-qa.p12 gate2b
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2b-qa.p12 -storepass gate2b dist/SLF-Port-emulator-x64.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk "$SDK"
          sha256sum dist/SLF-Port-emulator-x64.apk > evidence/apk-sha256.txt
          echo source_commit=24edfb3e2595223539036a996804f0137f3aed8f > evidence/source.txt
      - name: Write credits render script
        shell: bash
        run: |
          cat > credits.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PACKAGE="air.com.ramybaheeg.slfport"
          adb install -r dist/SLF-Port-emulator-x64.apk > evidence/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb logcat -c
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > evidence/launch.txt 2>&1
          sleep 12
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 6
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 4
          adb exec-out screencap -p > evidence/credits-port-info.png
          adb shell dumpsys window > evidence/window.txt
          adb logcat -d > evidence/logcat.txt
          test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"
          grep -m1 'mCurrentFocus=' evidence/window.txt | grep -q "$PACKAGE"
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" evidence/logcat.txt > evidence/fatal-scan.txt; then exit 31; fi
          echo 'PASS-CANDIDATE credits_surface_reached=yes source=24edfb3e2595223539036a996804f0137f3aed8f' > evidence/result.txt
          EOF
          chmod +x credits.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and capture credits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash credits.sh
      - name: Upload credits evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2b-credits-render
          path: evidence
          if-no-files-found: warn

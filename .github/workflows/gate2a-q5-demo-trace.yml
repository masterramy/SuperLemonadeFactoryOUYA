name: Gate 2A Q5 Demo Gate Trace

on:
  push:
    branches:
      - gate2a-q5-demo-trace

permissions:
  contents: read

jobs:
  trace-demo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source identity and trace all demo/purchase references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "--- Registry.DEMO references ---"
            grep -RIn --include='*.as' 'Registry\.DEMO' src || true
            echo "--- DEMO assignments/declarations ---"
            grep -RIn --include='*.as' -E 'DEMO[[:space:]]*[:=]|DEMO[[:space:]]*=' src || true
            echo "--- purchase/buy/unlock references ---"
            grep -RIn --include='*.as' -Ei 'purchase|save\.data\.buy|unlock all|full game unlocked' src || true
          } | tee demo-gate-trace.txt

      - name: Upload trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-q5-demo-gate-trace
          path: demo-gate-trace.txt
          if-no-files-found: error
          retention-days: 30

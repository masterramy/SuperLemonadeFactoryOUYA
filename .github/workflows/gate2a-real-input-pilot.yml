name: Gate 2A Real Input Completion Pilot

on:
  push:
    branches:
      - gate2a-customer-facing-qa-r13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-customer-facing-qa-r13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Assert QA branch changes do not modify shipping game source
        shell: pwsh
        run: |
          $base = 'd7783af3dbaa0a27071c51d5965f2e9dec5864e2'
          git diff --name-only $base HEAD | Set-Content qa-branch-diff.txt
          $bad = @(git diff --name-only $base HEAD | Where-Object { $_ -notlike '.github/workflows/*' -and $_ -notlike 'qa/*' })
          if ($bad.Count -gt 0) {
            Write-Host 'QA branch unexpectedly changed shipping files:'
            $bad | ForEach-Object { Write-Host $_ }
            exit 2
          }
          git diff --exit-code $base HEAD -- src application.xml obj gate2a-flex-config.xml data icons res
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile exact d778-derived game source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 QA APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Real Input QA" 2048-RSA gate2a-real-input-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -Force -ErrorAction SilentlyContinue dist/SLF-real-input-qa.apk
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-real-input-qa.p12 -storepass gate2a dist/SLF-real-input-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 dist/SLF-real-input-qa.apk).Hash.ToLowerInvariant()
          @(
            "qa_head=$env:GITHUB_SHA"
            "candidate_source=d7783af3dbaa0a27071c51d5965f2e9dec5864e2"
            "game_source_modified=false"
            "apk_sha256=$sha"
          ) | Set-Content dist/build-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-real-input-pilot-apk
          path: |
            dist/SLF-real-input-qa.apk
            dist/build-metadata.txt
            qa-branch-diff.txt
          if-no-files-found: error

  runtime-real-input-pilot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-customer-facing-qa-r13
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-real-input-pilot-apk
          path: runtime-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and run genuine-control Level 2 pilot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash qa/real_input_level2_pilot.sh
      - name: Upload real-input rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-real-input-level2-pilot-evidence
          path: qa-out
          if-no-files-found: error

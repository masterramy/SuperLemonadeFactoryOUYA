name: Gate2A icon192 repair helper

on:
  push:
    branches:
      - gate2a-icon192-repair-r1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact validated 192px repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, struct, zlib
          src=Path('icons/android/icons/icon_144.png')
          dst=Path('icons/android/icons/icon_192.png')
          im=Image.open(src).convert('RGBA')
          im.resize((192,192), Image.Resampling.LANCZOS).save(dst)
          b=dst.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          print('bytes',len(b),'sha256',sha)
          assert len(b)==52035, (len(b),sha)
          assert sha=='57d9bfd68e08211f0acc05f4780dc857c9e130f2b127dbddde319035a7488f28', sha
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          off=8; seen_iend=False; idat=[]
          while off < len(b):
              n=struct.unpack('>I',b[off:off+4])[0]; typ=b[off+4:off+8]; data=b[off+8:off+8+n]; crc=struct.unpack('>I',b[off+8+n:off+12+n])[0]
              assert (zlib.crc32(typ+data)&0xffffffff)==crc, typ
              if typ==b'IDAT': idat.append(data)
              if typ==b'IEND': seen_iend=True
              off += 12+n
          assert seen_iend and off==len(b)
          zlib.decompress(b''.join(idat))
          PY
      - name: Commit only repaired binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add icons/android/icons/icon_192.png
          test "$(git diff --cached --name-only)" = 'icons/android/icons/icon_192.png'
          git commit -m 'Repair truncated 192px Android launcher icon'
          git push origin HEAD:gate2a-icon192-repair-r1

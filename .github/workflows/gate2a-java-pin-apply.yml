name: Gate2A Java pin guarded apply

on:
  push:
    branches:
      - gate2a-java-pin-apply-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gate2a-rev41-exact-final
          fetch-depth: 0
          persist-credentials: true
      - name: Guard and apply validated Java pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '0e6bc4738827a88e88b85601c556a34afb94c294'
          $actualHead = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualHead -ne $expectedHead) { throw "Exact-final moved: expected $expectedHead, got $actualHead" }
          $paths = @('.github/workflows/gate2a-android-release.yml','.github/workflows/gate2a-air-baseline.yml')
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path)
            $old = 'java-version: "17.0.20.1+1"'
            $new = 'java-version: "17.0.20+101"'
            $count = ([regex]::Matches($text,[regex]::Escape($old))).Count
            if ($count -ne 1) { throw "$path expected exactly one old Java pin, found $count" }
            [IO.File]::WriteAllText($path,$text.Replace($old,$new),[Text.UTF8Encoding]::new($false))
          }
          $changed = @(& git diff --name-only)
          $expectedPaths = @('.github/workflows/gate2a-air-baseline.yml','.github/workflows/gate2a-android-release.yml')
          if (($changed.Count -ne 2) -or ((Compare-Object ($changed | Sort-Object) $expectedPaths).Count -ne 0)) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          $diff = (& git diff --unified=0)
          $removed = @($diff | Select-String '^\-.*java-version: "17\.0\.20\.1\+1"').Count
          $added = @($diff | Select-String '^\+.*java-version: "17\.0\.20\+101"').Count
          if ($removed -ne 2 -or $added -ne 2) { throw "Unexpected Java-pin diff counts removed=$removed added=$added" }
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $paths
          git commit -m 'Gate 2A rev41: correct exact Temurin Java pin'
          git push origin HEAD:gate2a-rev41-exact-final

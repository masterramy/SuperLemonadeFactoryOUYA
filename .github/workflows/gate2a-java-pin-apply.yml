name: Gate2A provenance-fix blob builder

on:
  push:
    branches:
      - gate2a-java-pin-apply-helper

permissions:
  contents: write

jobs:
  build-blobs:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gate2a-rev41-exact-final
          fetch-depth: 0
          persist-credentials: true
      - name: Build verified corrected workflow blobs outside workflow paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = 'f8b64cec087051d600b5fea39cadf4a326077866'
          $actualHead = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualHead -ne $expectedHead) { throw "Exact-final moved: expected $expectedHead, got $actualHead" }
          $paths = @('.github/workflows/gate2a-android-release.yml','.github/workflows/gate2a-air-baseline.yml')
          $old = "(if (Test-Path (Join-Path `$androidSdk 'platform-tools')) { 'platform-tools' })"
          $new = "`$(if (Test-Path (Join-Path `$androidSdk 'platform-tools')) { 'platform-tools' })"
          New-Item -ItemType Directory -Force -Path ARTIFACTS/provenance-fix-blobs | Out-Null
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path)
            $count = ([regex]::Matches($text,[regex]::Escape($old))).Count
            if ($count -ne 1) { throw "$path expected exactly one bad provenance expression, found $count" }
            $fixed = $text.Replace($old,$new)
            $leaf = Split-Path $path -Leaf
            [IO.File]::WriteAllText((Join-Path 'ARTIFACTS/provenance-fix-blobs' $leaf),$fixed,[Text.UTF8Encoding]::new($false))
          }
          foreach ($path in $paths) {
            if ((git status --porcelain -- $path)) { throw "Canonical workflow unexpectedly modified in worktree: $path" }
          }
          $releaseBlob = (& git hash-object ARTIFACTS/provenance-fix-blobs/gate2a-android-release.yml).Trim()
          $baselineBlob = (& git hash-object ARTIFACTS/provenance-fix-blobs/gate2a-air-baseline.yml).Trim()
          @(
            "parent=$expectedHead"
            "release_blob=$releaseBlob"
            "baseline_blob=$baselineBlob"
            "semantic_change=replace invalid PowerShell parenthesized if expression with subexpression form"
          ) | Set-Content ARTIFACTS/provenance-fix-blobs/RECEIPT.txt -Encoding utf8
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add ARTIFACTS/provenance-fix-blobs
          git commit -m 'Gate 2A diagnostic: materialize provenance-fix workflow blobs'
          git push origin HEAD:gate2a-provenance-fix-blobs

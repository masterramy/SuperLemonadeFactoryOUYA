name: Gate2A rev41 source-closure applicator

on:
  push:
    branches:
      - gate2a-java-pin-apply-helper

permissions:
  contents: write

jobs:
  apply-source-closure:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gate2a-rev41-exact-final
          fetch-depth: 0
          persist-credentials: true
      - name: Remove stale retired-custom-level Registry write
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = 'a79e49bba19ab02e283268a64145bea1ea45aeeb'
          $actualHead = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualHead -ne $expectedHead) { throw "Exact-final moved: expected $expectedHead, got $actualHead" }
          $path = 'src/PCLevelSelectState.as'
          $text = [IO.File]::ReadAllText($path)
          $old = "`t`t`t//not playing a custom level, so when ESCAPE go to this menu. `r`n`t`t`tRegistry.isPlayingCustomLevel = false;`r`n`t`t`t`r`n"
          if (-not $text.Contains($old)) {
            $old = "`t`t`t//not playing a custom level, so when ESCAPE go to this menu. `n`t`t`tRegistry.isPlayingCustomLevel = false;`n`t`t`t`n"
          }
          $count = ([regex]::Matches($text,[regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one stale custom-level flag block, found $count" }
          [IO.File]::WriteAllText($path,$text.Replace($old,''),[Text.UTF8Encoding]::new($false))
          $remaining = Select-String -Path src/*.as -Pattern 'isPlayingCustomLevel' -SimpleMatch -ErrorAction SilentlyContinue
          if ($remaining) { throw "isPlayingCustomLevel remains in live src after bounded closure: $($remaining.Path -join ', ')" }
          $changed = @(& git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) { throw "Unexpected changed files: $($changed -join ', ')" }
          $diff = (& git diff --unified=3 -- $path | Out-String)
          if ($diff -notmatch 'Registry\.isPlayingCustomLevel = false;') { throw 'Expected retired flag assignment not present in diff.' }
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $path
          git commit -m 'Gate 2A rev41: close retired custom-level flag reference'
          git push origin HEAD:gate2a-rev41-exact-final

name: Gate 2A Q5 Level 2 Piggyback Completion Probe

on:
  push:
    branches: [gate2a-android-modernization]
    paths: [.github/workflows/gate2a-q5-level2-piggyback-probe.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  level2-piggyback-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA staging
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 8

      - name: Verify exact product ancestor and QA-only delta
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c"
          git merge-base --is-ancestor "$PRODUCT" HEAD
          git diff --name-only "$PRODUCT" HEAD | tee qa-delta.txt
          if git diff --name-only "$PRODUCT" HEAD | grep -Ev '^\.github/workflows/gate2a-q5-.*\.yml$' | grep -q .; then
            echo 'Non-QA customer delta detected above exact product head' >&2
            exit 1
          fi

      - name: Download exact repaired emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34777986347

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='runtime-apk/SLF-emulator-x64.apk'
          test -f "$APK"
          test "$(wc -c < "$APK" | tr -d ' ')" = '35875619'
          test "$(sha256sum "$APK" | awk '{print $1}')" = '53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2'

      - name: Write ordinary-input probe
        shell: bash
        run: |
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK='runtime-apk/SLF-emulator-x64.apk'; PACKAGE='com.ramybaheeg.slfport'; OUT='level2-probe'
          mkdir -p "$OUT"
          capture(){
            tag="$1"
            adb shell dumpsys window > "$OUT/window-${tag}.txt" 2>&1
            adb exec-out screencap -p > "$OUT/${tag}.png"
            adb logcat -d > "$OUT/logcat-${tag}.txt" 2>&1
            pid=$(adb shell pidof "$PACKAGE"|tr -d '\r')
            focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-${tag}.txt"||true)
            printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-${tag}.txt"
            test -n "$pid"; echo "$focus"|grep -q "$PACKAGE"
            ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-${tag}.txt" > "$OUT/fatal-${tag}.txt"
          }
          dismiss_text(){
            wanted="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1||return 0
            adb pull /sdcard/window.xml "$OUT/window-ui.xml" >/dev/null 2>&1||return 0
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse('level2-probe/window-ui.xml').getroot()
          except:raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:
                a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
          PY
            ); [ -z "$coords" ]||{ adb shell input tap $coords >/dev/null 2>&1||true; sleep 1; }
          }
          jump_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .20; }
          liselot_double_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; sleep .16; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .20; }
          walk_left(){ adb shell input keyevent --longpress KEYCODE_DPAD_LEFT >/dev/null 2>&1||true; sleep .25; }
          walk_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1||true; sleep .25; }
          launch(){ adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1||true; adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch-command.txt" 2>&1; sleep 4; for _ in 1 2 3 4; do dismiss_text 'Got it'; dismiss_text 'Wait'; sleep 1; done; sleep 8; }
          to_level_select(){ adb shell input keyevent KEYCODE_X; sleep 2; adb shell input keyevent KEYCODE_X; sleep 8; adb shell input keyevent KEYCODE_X; sleep 4; }

          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1||true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1||true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1||true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1||true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1||true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1||true
          adb shell wm dismiss-keyguard >/dev/null 2>&1||true

          launch; to_level_select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1; adb shell input keyevent KEYCODE_X; sleep 12; adb shell input keyevent KEYCODE_X; sleep 12
          capture 01-level2-start

          for i in $(seq 1 7); do jump_right; done
          capture 02-before-switch
          adb shell input keyevent KEYCODE_V; sleep 2
          capture 03-liselot-controlled
          for i in $(seq 1 11); do liselot_double_right; done
          capture 04-liselot-high-platform
          for i in $(seq 1 6); do walk_left; done
          capture 05-crate-left-push

          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 12); do jump_right; done
          capture 06-andre-high-platform
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 9); do liselot_double_right; done
          capture 07-liselot-right-side
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 9); do jump_right; done
          capture 08-andre-right-side
          for i in $(seq 1 4); do walk_right; done
          capture 09-rendezvous-probe

          # Shipping piggyback input. It only engages if the two characters genuinely overlap.
          adb shell input keyevent KEYCODE_B; sleep 2
          capture 10-after-piggyback-input
          for i in $(seq 1 8); do jump_right; done
          capture 11-exit-approach
          sleep 4
          capture 12-terminal-observation

          printf '%s\n' \
            'ordinary_inputs_only=true' \
            'save_or_game_state_edit=false' \
            'teleport=false' \
            'forced_completion=false' \
            'switch_input=KEYCODE_V' \
            'piggyback_input=KEYCODE_B_once_when_rendezvous_attempted' \
            'completion_confirmation_input=false' \
            'unknown_terminal_states_are_not_blindly_confirmed=true' > "$OUT/method.txt"
          EOF
          chmod +x probe.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and run bounded Level 2 probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh

      - name: Upload full rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-level2-piggyback-probe
          path: level2-probe
          if-no-files-found: error

      - name: Retain adjudication frames on QA-only branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d level2-probe || exit 0
          rm -rf qa-proof/level2-piggyback-current
          mkdir -p qa-proof/level2-piggyback-current
          cp level2-probe/*.png qa-proof/level2-piggyback-current/ 2>/dev/null || true
          cp level2-probe/method.txt qa-proof/level2-piggyback-current/ 2>/dev/null || true
          cp level2-probe/state-*.txt qa-proof/level2-piggyback-current/ 2>/dev/null || true
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-proof/level2-piggyback-current
          git diff --cached --quiet && exit 0
          git commit -m 'qa-proof: retain Level 2 piggyback probe frames'
          git push origin HEAD:gate2a-android-modernization

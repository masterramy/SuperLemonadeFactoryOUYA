name: Gate2A rev41 current applicator dry-run
on:
  push:
    branches:
      - gate2a-rev41-dryrun-helper-14
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout gate2a-rev41-exact-final
          test "$(git rev-parse HEAD)" = "d147d5621a3b7cb7607a8c092565586ca7009699"
          test "$(git rev-parse HEAD^{tree})" = "4efe662c11d9d305ace9f6fdabaec21f4b3e34a4"
      - name: Fetch and verify current authenticated Drive applicator
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-15fc-81fd-91b2-ef1d8ad88624/raw?se=2026-09-12T21%3A03%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=0d531549-b9b9-59be-8ee1-398b787879de&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T03%3A22%3A52Z&ske=2026-09-13T03%3A22%3A52Z&sks=b&skv=2026-02-06&sig=WrZkXigHwpD7pKj0LZ6sO29eBYXTskykYwevUrt1Zq8%3D' -o /tmp/app.py
          echo '6b8cb685db2e19823c81b3d5dee5071e467d5788eab342402a2846300fe4340d  /tmp/app.py' | sha256sum --check --strict
          python -m py_compile /tmp/app.py
      - name: Full fail-closed dry-run
        run: |
          set -euo pipefail
          python /tmp/app.py --root repo

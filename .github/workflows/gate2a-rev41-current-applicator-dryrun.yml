name: Gate2A rev41 current applicator dry-run
on:
  push:
    branches:
      - gate2a-rev41-dryrun-helper-16
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout gate2a-rev41-exact-final
          test "$(git rev-parse HEAD)" = "d147d5621a3b7cb7607a8c092565586ca7009699"
          test "$(git rev-parse HEAD^{tree})" = "4efe662c11d9d305ace9f6fdabaec21f4b3e34a4"
      - name: Fetch and verify current authenticated Drive applicator
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-bcf8-81fd-99af-120c68e81b87/raw?se=2026-09-12T21%3A07%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=4dd7c8a4-b861-5742-a6b0-f77067976820&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A18%3A59Z&ske=2026-09-13T01%3A18%3A59Z&sks=b&skv=2026-02-06&sig=SsJdo%2BLK9x1TQGOgUqoQTrUNg2c4qqETuiJwp4NelSI%3D' -o /tmp/app.py
          echo '172e7a531a10fdceca54b3066bb081a413ed917f6c04902dc3eb8a3730f23996  /tmp/app.py' | sha256sum --check --strict
          python -m py_compile /tmp/app.py
      - name: Full fail-closed dry-run
        run: |
          set -euo pipefail
          python /tmp/app.py --root repo

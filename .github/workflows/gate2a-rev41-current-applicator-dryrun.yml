name: Gate2A rev41 current applicator dry-run
on:
  push:
    branches:
      - gate2a-rev41-dryrun-helper-19
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout gate2a-rev41-exact-final
          test "$(git rev-parse HEAD)" = "d147d5621a3b7cb7607a8c092565586ca7009699"
          test "$(git rev-parse HEAD^{tree})" = "4efe662c11d9d305ace9f6fdabaec21f4b3e34a4"
      - name: Fetch and verify current authenticated Drive applicator
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprwestus.oaiusercontent.com/files/00000000-0a14-8230-87cb-0bbec58e9691/raw?se=2026-09-12T21%3A31%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=ba42c663-a8e2-5db4-a98d-369986ab8fcf&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A16%3A33Z&ske=2026-09-13T01%3A16%3A33Z&sks=b&skv=2026-02-06&sig=7d9NjRQkp2Qj9IcSnmZw4FRERY%2BuZMwe3cpCFdM8/yg%3D' -o /tmp/app.py
          echo '5e9f9539588a50c0447b2d07d9cb2e2fee6f5bd38f29442b769477f7f1f7ca7d  /tmp/app.py' | sha256sum --check --strict
          python -m py_compile /tmp/app.py
      - name: Full fail-closed dry-run
        run: |
          set -euo pipefail
          python /tmp/app.py --root repo

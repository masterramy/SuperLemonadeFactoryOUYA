name: Gate2A rev41 current applicator dry-run
on:
  push:
    branches:
      - gate2a-rev41-dryrun-helper-12
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout gate2a-rev41-exact-final
          test "$(git rev-parse HEAD)" = "d147d5621a3b7cb7607a8c092565586ca7009699"
          test "$(git rev-parse HEAD^{tree})" = "4efe662c11d9d305ace9f6fdabaec21f4b3e34a4"
      - name: Fetch and verify current authenticated Drive applicator
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-c040-81fd-a167-120ad9679dc4/raw?se=2026-09-12T20%3A52%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=2c656a02-a4c5-5790-bb6c-26ba0ae79d96&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T23%3A34%3A46Z&ske=2026-09-12T23%3A34%3A46Z&sks=b&skv=2026-02-06&sig=PGeKdDebKVjjDJF0F3d/1wQc2sFI4LjDGkjVe9NIO2g%3D' -o /tmp/app.py
          echo '545cb32046254459f6f0d92fb6b4efc3158406e06ca4e03c458e274d09cd1f21  /tmp/app.py' | sha256sum --check --strict
          python -m py_compile /tmp/app.py
      - name: Full fail-closed dry-run
        run: |
          set -euo pipefail
          python /tmp/app.py --root repo

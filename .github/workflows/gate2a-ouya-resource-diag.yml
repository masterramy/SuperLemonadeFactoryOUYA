name: Gate2A OUYA resource provenance diagnostic

on:
  push:
    branches:
      - gate2a-ouya-resource-diag-r1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          check-latest: false
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Compile customer source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package and inventory OUYA-named resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) { throw 'No Android SDK.' }
          $keyPath = Join-Path $PWD 'diag.p12'
          & adt -certificate -validityPeriod 1 -cn 'Gate2A OUYA Resource Diagnostic' 2048-RSA $keyPath gate2a
          if ($LASTEXITCODE -ne 0) { throw 'certificate failed' }
          & adt -package -target aab -storetype pkcs12 -keystore $keyPath -storepass gate2a diagnostic/SLF.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path diagnostic/SLF.aab)) { throw 'AAB packaging failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path diagnostic/SLF.aab))
          try {
            $rows=@()
            foreach($e in $zip.Entries | Sort-Object FullName) {
              if($e.FullName -match '(?i)ouya') {
                $tmp=Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
                $s=$e.Open(); $f=[IO.File]::Create($tmp); try{$s.CopyTo($f)} finally {$f.Dispose();$s.Dispose()}
                $sha=(Get-FileHash -Algorithm SHA256 $tmp).Hash.ToLowerInvariant()
                $rows += "$($e.FullName)`t$($e.Length)`t$sha"
                Remove-Item $tmp -Force
              }
            }
            if($rows.Count -eq 0){ $out=@('NO_OUYA_NAMED_AAB_ENTRIES') } else { $out=$rows }
            $out | Set-Content diagnostic/ouya-aab-entries.txt -Encoding utf8
            $zip.Entries | Sort-Object FullName | ForEach-Object FullName | Set-Content diagnostic/aab-entry-list.txt -Encoding utf8
          } finally {$zip.Dispose()}
          $airOuya=Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          @(
            "head=$((& git rev-parse HEAD).Trim())"
            "tree=$((& git rev-parse 'HEAD^{tree}').Trim())"
            "repo_icon_192_sha256=$((Get-FileHash -Algorithm SHA256 icons/android/icons/icon_192.png).Hash.ToLowerInvariant())"
            "repo_icon_192_bytes=$((Get-Item icons/android/icons/icon_192.png).Length)"
            "air_ouya_sha256=$((Get-FileHash -Algorithm SHA256 $airOuya).Hash.ToLowerInvariant())"
            "air_ouya_bytes=$((Get-Item $airOuya).Length)"
            "aab_sha256=$((Get-FileHash -Algorithm SHA256 diagnostic/SLF.aab).Hash.ToLowerInvariant())"
            "aab_bytes=$((Get-Item diagnostic/SLF.aab).Length)"
          ) | Set-Content diagnostic/provenance.txt -Encoding utf8
          $bundletoolVersion='1.18.3'
          $bundletool='bundletool.jar'
          Invoke-WebRequest "https://github.com/google/bundletool/releases/download/$bundletoolVersion/bundletool-all-$bundletoolVersion.jar" -OutFile $bundletool
          $sha=(Get-FileHash -Algorithm SHA256 $bundletool).Hash.ToLowerInvariant()
          if($sha -ne 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'){throw "bundletool hash mismatch $sha"}
          & java -jar $bundletool dump manifest --bundle=diagnostic/SLF.aab | Set-Content diagnostic/manifest.txt -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'manifest dump failed'}
          & java -jar $bundletool dump resources --bundle=diagnostic/SLF.aab | Set-Content diagnostic/resources.txt -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'resources dump failed'}
          Select-String -Path diagnostic/manifest.txt,diagnostic/resources.txt -Pattern '(?i)ouya' | ForEach-Object { $_.ToString() } | Set-Content diagnostic/ouya-references.txt -Encoding utf8
          Remove-Item $keyPath,$bundletool -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-ouya-resource-provenance
          path: diagnostic
          if-no-files-found: error

name: Gate2A OUYA SDK-template removal diagnostic

on:
  push:
    branches:
      - gate2a-ouya-resource-diag-r1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          check-latest: false
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Inventory and remove OUYA SDK templates for diagnostic only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force diagnostic | Out-Null
          $airRoot=(Resolve-Path $env:AIR_HOME).Path
          $rows=@()
          Get-ChildItem -Path $airRoot -Recurse -File | ForEach-Object {
            $rel=[IO.Path]::GetRelativePath($airRoot,$_.FullName).Replace('\','/')
            $pathMatch=$rel -match '(?i)ouya'
            $byteMatch=$false
            try {
              $bytes=[IO.File]::ReadAllBytes($_.FullName)
              $needle=[Text.Encoding]::ASCII.GetBytes('ouya_icon')
              for($i=0; $i -le $bytes.Length-$needle.Length; $i++) {
                $ok=$true
                for($j=0; $j -lt $needle.Length; $j++) { if([byte]::ToLower($bytes[$i+$j]) -ne [byte]::ToLower($needle[$j])) { $ok=$false; break } }
                if($ok){$byteMatch=$true;break}
              }
            } catch {}
            if($pathMatch -or $byteMatch) {
              $sha=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              $rows += "$rel`t$($_.Length)`t$sha`tpath_match=$pathMatch`tbyte_match=$byteMatch"
            }
          }
          $rows | Set-Content diagnostic/air-ouya-inventory.txt -Encoding utf8
          $remove=Get-ChildItem -Path $airRoot -Recurse -File | Where-Object { $_.Name -ieq 'ouya_icon.png' }
          if(@($remove).Count -eq 0){throw 'No ouya_icon.png SDK template found'}
          $remove | ForEach-Object {
            $rel=[IO.Path]::GetRelativePath($airRoot,$_.FullName).Replace('\','/')
            "$rel`t$($_.Length)`t$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())" | Add-Content diagnostic/removed-sdk-files.txt
            Remove-Item -LiteralPath $_.FullName -Force
          }
      - name: Compile customer source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package and inventory resulting AAB
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $androidSdk=$env:ANDROID_SDK_ROOT
          if([string]::IsNullOrWhiteSpace($androidSdk)){$androidSdk=$env:ANDROID_HOME}
          $keyPath=Join-Path $PWD 'diag.p12'
          & adt -certificate -validityPeriod 1 -cn 'Gate2A OUYA Template Removal Diagnostic' 2048-RSA $keyPath gate2a
          if($LASTEXITCODE -ne 0){throw 'certificate failed'}
          & adt -package -target aab -storetype pkcs12 -keystore $keyPath -storepass gate2a diagnostic/SLF.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $androidSdk
          if($LASTEXITCODE -ne 0 -or -not(Test-Path diagnostic/SLF.aab)){throw 'AAB packaging failed after SDK-template removal'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path diagnostic/SLF.aab))
          try {
            $rows=@()
            foreach($e in $zip.Entries|Sort-Object FullName){if($e.FullName -match '(?i)ouya'){$rows += "$($e.FullName)`t$($e.Length)"}}
            if($rows.Count -eq 0){$rows=@('NO_OUYA_NAMED_AAB_ENTRIES')}
            $rows|Set-Content diagnostic/ouya-aab-entries-after-removal.txt -Encoding utf8
          } finally {$zip.Dispose()}
          $bundletool='bundletool.jar'
          Invoke-WebRequest 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -OutFile $bundletool
          $sha=(Get-FileHash -Algorithm SHA256 $bundletool).Hash.ToLowerInvariant()
          if($sha -ne 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'){throw "bundletool hash mismatch $sha"}
          & java -jar $bundletool dump manifest --bundle=diagnostic/SLF.aab | Set-Content diagnostic/manifest-after-removal.txt -Encoding utf8
          & java -jar $bundletool dump resources --bundle=diagnostic/SLF.aab | Set-Content diagnostic/resources-after-removal.txt -Encoding utf8
          Select-String -Path diagnostic/manifest-after-removal.txt,diagnostic/resources-after-removal.txt -Pattern '(?i)ouya' | ForEach-Object {$_.ToString()} | Set-Content diagnostic/ouya-references-after-removal.txt -Encoding utf8
          @(
            "base_commit=973c31bbb788f96ed3a5bafc2d99eea434d58197"
            "diagnostic_head=$((& git rev-parse HEAD).Trim())"
            "repo_icon_192_sha256=$((Get-FileHash -Algorithm SHA256 icons/android/icons/icon_192.png).Hash.ToLowerInvariant())"
            "aab_sha256=$((Get-FileHash -Algorithm SHA256 diagnostic/SLF.aab).Hash.ToLowerInvariant())"
            "aab_bytes=$((Get-Item diagnostic/SLF.aab).Length)"
          )|Set-Content diagnostic/provenance.txt -Encoding utf8
          Remove-Item $keyPath,$bundletool -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-ouya-template-removal-diagnostic
          path: diagnostic
          if-no-files-found: error

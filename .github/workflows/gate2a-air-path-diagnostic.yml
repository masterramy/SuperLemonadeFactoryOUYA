name: Gate 2A AIR Path and OUYA Template Diagnostic

on:
  push:
    branches:
      - gate2a-air-path-diagnostic-r20

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Resolve actual ADT and sanitize every exact provider OUYA template copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $expected = '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253'
          $adt = Get-Command adt -ErrorAction Stop
          @(
            "AIR_HOME=$env:AIR_HOME"
            "adt_source=$($adt.Source)"
            "adt_definition=$($adt.Definition)"
          ) | Set-Content dist/air-paths.txt -Encoding utf8

          $roots = @()
          if (-not [string]::IsNullOrWhiteSpace($env:AIR_HOME) -and (Test-Path $env:AIR_HOME)) { $roots += (Resolve-Path $env:AIR_HOME).Path }
          if (Test-Path 'C:\AIR_SDK') { $roots += (Resolve-Path 'C:\AIR_SDK').Path }
          $adtBin = Split-Path -Parent $adt.Source
          $adtRoot = Split-Path -Parent $adtBin
          if (Test-Path $adtRoot) { $roots += (Resolve-Path $adtRoot).Path }
          $roots = @($roots | Sort-Object -Unique)
          $found = @()
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Filter 'ouya_icon.png' -ErrorAction SilentlyContinue | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              $found += [PSCustomObject]@{ Path=$_.FullName; Bytes=$_.Length; Sha256=$hash }
            }
          }
          $found = @($found | Sort-Object Path -Unique)
          $found | ForEach-Object { "$($_.Sha256)  $($_.Bytes)  $($_.Path)" } | Set-Content dist/ouya-copies-before.txt -Encoding utf8
          if ($found.Count -lt 1) { throw 'No AIR OUYA template resource copies found.' }
          foreach ($item in $found) {
            if ($item.Sha256 -ne $expected -or $item.Bytes -ne 1525) { throw "Unexpected OUYA template identity at $($item.Path)" }
            Remove-Item -LiteralPath $item.Path -Force
          }
          foreach ($item in $found) { if (Test-Path -LiteralPath $item.Path) { throw "Failed to remove $($item.Path)" } }
          "removed_count=$($found.Count)" | Add-Content dist/air-paths.txt

      - name: Compile package and prove package surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A AIR Path Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-sanitized.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "AAB package failed: $LASTEXITCODE" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/SLF-sanitized.aab).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            $actualOuyaResources = @($entries | Where-Object { $_ -match '(?i)(^|/)(ouya_icon|ouya_[^/]*\.(png|psd))$' })
            $actualOuyaResources | Set-Content dist/ouya-resource-scan.txt -Encoding utf8
            if ($actualOuyaResources.Count -ne 0) { throw "OUYA publication resources remain: $($actualOuyaResources -join ', ')" }
            $required = @('base/assets/LICENSE','base/assets/THIRD_PARTY_NOTICES.md','base/assets/third_party/licenses/flixel-2.55-MIT.txt','base/assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt','base/assets/third_party/licenses/as3-controller-input-MIT.txt')
            foreach ($entry in $required) { if ($entries -notcontains $entry) { throw "Required notice missing: $entry" } }
          } finally { $zip.Dispose() }
          $aab = Get-Item dist/SLF-sanitized.aab
          @(
            "aab_bytes=$($aab.Length)"
            "aab_sha256=$((Get-FileHash -Algorithm SHA256 $aab.FullName).Hash.ToLowerInvariant())"
            'nested_notices_verified=true'
            'ouya_publication_resources=0'
          ) | Set-Content dist/result.txt -Encoding utf8

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-air-path-diagnostic
          path: |
            dist/air-paths.txt
            dist/ouya-copies-before.txt
            dist/ouya-resource-scan.txt
            dist/result.txt
          if-no-files-found: warn

name: Gate 2A Icon 192 Lanczos Diagnostic

on:
  push:
    branches:
      - gate2a-icon192-lanczos-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reproduce canonical Lanczos candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, io
          src_path = Path('icons/android/icons/icon_144.png')
          expected = '57d9bfd68e08211f0acc05f4780dc857c9e130f2b127dbddde319035a7488f28'
          expected_bytes = 52035
          src = Image.open(src_path)
          print('pillow=', Image.__version__ if hasattr(Image,'__version__') else 'unknown')
          print('source_mode=', src.mode, 'source_size=', src.size, 'source_info_keys=', sorted(src.info.keys()))
          if src.size != (144,144):
              raise SystemExit('unexpected source dimensions')
          variants = []
          def add(name, im, **save_kwargs):
              b = io.BytesIO(); im.save(b, format='PNG', **save_kwargs); data=b.getvalue()
              h=hashlib.sha256(data).hexdigest(); print(name, len(data), h)
              variants.append((name,data,h))
          resized = src.resize((192,192), Image.Resampling.LANCZOS)
          add('default', resized)
          add('rgba-default', resized.convert('RGBA'))
          add('rgb-default', resized.convert('RGB'))
          for level in range(10):
              add(f'rgba-c{level}', resized.convert('RGBA'), compress_level=level)
          for optimize in (True,):
              add('rgba-opt', resized.convert('RGBA'), optimize=optimize)
          match = [(n,d) for n,d,h in variants if h == expected and len(d)==expected_bytes]
          if not match:
              raise SystemExit('no exact canonical candidate reproduction')
          print('CANONICAL_MATCH=', match[0][0])
          PY

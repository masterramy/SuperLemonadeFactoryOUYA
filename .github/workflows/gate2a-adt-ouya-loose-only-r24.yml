name: Gate 2A ADT OUYA Loose-Only Isolation R24

on:
  push:
    branches:
      - gate2a-aab-manifest-ouya-adjudication-r23

permissions:
  contents: read

jobs:
  isolate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Hash-guard and remove only loose AIR OUYA provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $airRoot = (Resolve-Path $env:AIR_HOME).Path
          $loose = Join-Path $airRoot 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          if (-not (Test-Path -LiteralPath $loose -PathType Leaf)) { throw "Expected loose AIR OUYA provider missing: $loose" }
          $expected = '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253'
          $actual = (Get-FileHash -Algorithm SHA256 $loose).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Loose AIR OUYA provider identity changed: $actual" }
          if ((Get-Item -LiteralPath $loose).Length -ne 1525) { throw "Loose AIR OUYA provider size changed." }
          Remove-Item -LiteralPath $loose -Force
          if (Test-Path -LiteralPath $loose) { throw "Loose AIR OUYA provider removal failed." }
          Write-Host "LOOSE_ONLY_SANITATION_PASS sha256=$actual"

      - name: Compile and package loose-only sanitized AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A R24 Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-r24.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "AAB package failed: $LASTEXITCODE" }

      - name: Inspect residual OUYA package entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/SLF-r24.aab').Path)
          try {
            $matches = @($zip.Entries | Where-Object { $_.FullName -match '(?i)(^|/)ouya_icon\.png$' })
            Write-Host "RESIDUAL_COUNT=$($matches.Count)"
            foreach ($entry in $matches) {
              $stream = $entry.Open()
              try {
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $bytes = $sha.ComputeHash($stream) } finally { $sha.Dispose() }
                $hash = ([BitConverter]::ToString($bytes)).Replace('-','').ToLowerInvariant()
                Write-Host "RESIDUAL path=$($entry.FullName) bytes=$($entry.Length) sha256=$hash"
              } finally { $stream.Dispose() }
            }
          } finally { $zip.Dispose() }

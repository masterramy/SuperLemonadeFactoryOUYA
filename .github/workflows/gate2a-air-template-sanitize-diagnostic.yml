name: Gate 2A AIR Template Sanitation Diagnostic

on:
  push:
    branches:
      - gate2a-air-template-sanitize-diagnostic-r20

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Verify and sanitize obsolete AIR OUYA template resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relative = 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          $path = Join-Path $env:AIR_HOME $relative
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Expected AIR template resource missing: $relative" }
          $expected = '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253'
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "AIR template OUYA resource identity changed. Expected $expected, got $actual" }
          $bytes = (Get-Item -LiteralPath $path).Length
          if ($bytes -ne 1525) { throw "Unexpected AIR OUYA template byte count: $bytes" }
          Remove-Item -LiteralPath $path -Force
          if (Test-Path -LiteralPath $path) { throw 'Failed to remove obsolete AIR OUYA template resource.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @(
            "air_version=51.3.4.3"
            "removed_path=$relative"
            "removed_sha256=$actual"
            "removed_bytes=$bytes"
          ) | Set-Content dist/air-template-sanitation.txt -Encoding utf8

      - name: Compile and package sanitized AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue bin/SLFforOuya.swf,dist/SLF-sanitized.aab,diagnostic-signing.p12
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A Sanitation Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-sanitized.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "Sanitized AAB package failed: $LASTEXITCODE" }
          if (-not (Test-Path dist/SLF-sanitized.aab)) { throw 'Sanitized AAB missing.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/SLF-sanitized.aab).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            $required = @(
              'base/assets/LICENSE',
              'base/assets/THIRD_PARTY_NOTICES.md',
              'base/assets/third_party/licenses/flixel-2.55-MIT.txt',
              'base/assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt',
              'base/assets/third_party/licenses/as3-controller-input-MIT.txt'
            )
            foreach ($entry in $required) { if ($entries -notcontains $entry) { throw "Required notice missing: $entry" } }
            $ouya = @($entries | Where-Object { $_ -match '(?i)ouya' })
            $ouya | Set-Content dist/ouya-entry-scan.txt -Encoding utf8
            if ($ouya.Count -ne 0) { throw "OUYA-named entries remain after AIR template sanitation: $($ouya -join ', ')" }
            $entries | Sort-Object | Set-Content dist/aab-entry-list.txt -Encoding utf8
          } finally { $zip.Dispose() }
          $aab = Get-Item dist/SLF-sanitized.aab
          $hash = (Get-FileHash -Algorithm SHA256 $aab.FullName).Hash.ToLowerInvariant()
          @(
            "source_sha=$env:GITHUB_SHA"
            "aab_bytes=$($aab.Length)"
            "aab_sha256=$hash"
            'nested_notices_verified=true'
            'ouya_named_entries=0'
          ) | Set-Content dist/diagnostic-result.txt -Encoding utf8

      - name: Upload sanitation diagnostic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-air-template-sanitation-diagnostic
          path: |
            dist/air-template-sanitation.txt
            dist/diagnostic-result.txt
            dist/ouya-entry-scan.txt
            dist/aab-entry-list.txt
          if-no-files-found: warn

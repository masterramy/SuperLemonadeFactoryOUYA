name: Gate 2A Reachable State Matrix QA

on:
  push:
    branches:
      - gate2a-state-matrix-qa
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-state-matrix-qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile state QA SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 state QA APK with transient repository retry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A State QA" 2048-RSA gate2a-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path dist/SLF-state-qa.apk) { Remove-Item -Force dist/SLF-state-qa.apk }
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-qa.p12 -storepass gate2a dist/SLF-state-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-state-qa-apk
          path: dist/SLF-state-qa.apk
          if-no-files-found: error

  runtime-states:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-state-qa-apk
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write state-matrix harness
        shell: bash
        run: |
          cat > state-matrix.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          mkdir -p states
          APK="runtime-apk/SLF-state-qa.apk"
          PACKAGE="air.com.initialsgames.SLF"
          FAIL=0
          adb install -r "$APK" > states/install.txt 2>&1 || exit 10
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          echo "target,key,pid,focused,width,height,std,entropy,fatal" > states/metrics.csv

          targets=(menu options help credits levelselect cinematic1 cinematic2 cinematic3 prize)
          keys=(Q O H C L A S D P)
          for I in $(seq 0 8); do
            T=${targets[$I]}; K=${keys[$I]}
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            adb logcat -c
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "states/${T}-launch.txt" 2>&1
            sleep 5
            adb shell input keyevent "KEYCODE_${K}" >/dev/null 2>&1
            sleep 5
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            adb shell dumpsys window > "states/${T}-window.txt" 2>&1
            FOCUS=$(grep -m1 'mCurrentFocus=' "states/${T}-window.txt" || true)
            FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
            adb exec-out screencap -p > "states/${T}.png"
            adb logcat -d > "states/${T}-logcat.txt" 2>&1
            FATAL=0
            if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "states/${T}-logcat.txt" > "states/${T}-fatal.txt"; then FATAL=1; FAIL=1; else : > "states/${T}-fatal.txt"; fi
            [ -z "$PID" ] && FAIL=1
            [ "$FOCUSED" -ne 1 ] && FAIL=1
            MET=$(python3 - "states/${T}.png" <<'PY'
          import sys,math
          from PIL import Image,ImageStat
          im=Image.open(sys.argv[1]).convert('L'); w,h=im.size
          g=im.crop((0,int(h*.05),w,int(h*.95)))
          std=ImageStat.Stat(g).stddev[0]; hist=g.histogram(); total=sum(hist); ent=0.0
          for n in hist:
              if n:
                  p=n/total; ent-=p*math.log(p,2)
          print(f"{w},{h},{std:.3f},{ent:.3f}")
          PY
            )
            IFS=',' read W H STD ENT <<< "$MET"
            python3 - "$W" "$H" "$STD" "$ENT" <<'PY'
          import sys
          w,h=int(sys.argv[1]),int(sys.argv[2]); std=float(sys.argv[3]); ent=float(sys.argv[4])
          raise SystemExit(0 if w>h and std>=4 and ent>=0.8 else 1)
          PY
            if [ $? -ne 0 ]; then echo "VISUAL_RISK $T ${W}x${H} std=$STD ent=$ENT" >> states/failures.txt; FAIL=1; fi
            echo "$T,$K,$PID,$FOCUSED,$W,$H,$STD,$ENT,$FATAL" >> states/metrics.csv
            if [[ "$T" == cinematic* ]]; then
              adb shell input keyevent KEYCODE_X >/dev/null 2>&1
              sleep 2
              adb exec-out screencap -p > "states/${T}-after-input.png"
              adb logcat -d > "states/${T}-after-input-logcat.txt" 2>&1
              if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "states/${T}-after-input-logcat.txt" > "states/${T}-after-input-fatal.txt"; then FAIL=1; fi
            fi
          done
          [ -f states/failures.txt ] && cat states/failures.txt > states/summary.txt || : > states/summary.txt
          echo "states=9" >> states/summary.txt
          echo "fail=$FAIL" >> states/summary.txt
          if [ "$FAIL" -ne 0 ]; then exit 20; fi
          echo "PASS-CANDIDATE: 9/9 requested target states produced healthy nonblank Android frames without fatal runtime signatures; visual target identity requires screenshot review." >> states/summary.txt
          EOF
          chmod +x state-matrix.sh
      - name: Run reachable state matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash state-matrix.sh
      - name: Upload state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-state-matrix-evidence
          path: states
          if-no-files-found: error

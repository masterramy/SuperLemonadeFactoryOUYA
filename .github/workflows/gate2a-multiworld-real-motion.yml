name: QA - Genuine Factory and Management Original Gameplay Motion
on:
  push:
    branches:
      - qa/gate2a-postlaunch-multiworld-real-capture
    paths:
      - .github/workflows/gate2a-multiworld-real-motion.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture-world:
    strategy:
      fail-fast: false
      matrix:
        include:
          - world: factory
            source_run: 38494058880
            artifact: gate2a-factory13-original-scene-apk
            apk_sha: 8cbd0a2db3143665bc4a062c771ec9c86af5f404a23ca21a2a8bc8c5f3af70d5
            direction: RIGHT
          - world: management
            source_run: 38494063811
            artifact: gate2a-management25-original-scene-apk
            apk_sha: ca50f08f92c4c6562924c84a24d16d71f29f13ad1d0df9979cdfcd133aeaf735
            direction: LEFT
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: qa-apk
      - name: Verify exact QA APK and unpack capture script
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.apk_sha }}
          WORLD: ${{ matrix.world }}
          DIRECTION: ${{ matrix.direction }}
        run: |
          set -euo pipefail
          echo "Source identity: $(cat qa-apk/qa-isolated-identity.txt)"
          test "$(sha256sum qa-apk/dist/emulator-qa/SLF-emulator-x64.apk | cut -d' ' -f1)" = "$EXPECTED_SHA"
          test "$(sha256sum qa/trailer-world-capture.zip | cut -d' ' -f1)" = "180706857186a23c575b7ffc4ef5b44ace36a222beaaa3179eb3080f7dbe7c21"
          unzip -oq qa/trailer-world-capture.zip
          mkdir -p "real-world-video/$WORLD"
          cp qa-apk/qa-isolated-identity.txt "real-world-video/$WORLD/"
          cp qa-apk/qa-isolated-delta.txt "real-world-video/$WORLD/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          WORLD: ${{ matrix.world }}
          DIRECTION: ${{ matrix.direction }}
          EXPECTED_SHA: ${{ matrix.apk_sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python qa/trailer/record_world.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: limeade-real-${{ matrix.world }}-motion-qa
          path: real-world-video/${{ matrix.world }}/
          if-no-files-found: warn

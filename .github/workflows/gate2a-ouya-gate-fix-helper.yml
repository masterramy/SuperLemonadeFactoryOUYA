name: Gate2A OUYA gate fix helper

on:
  push:
    branches: [gate2a-ouya-gate-fix-r1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply exact bounded release-workflow fix
        shell: bash
        env:
          OLD1: ICAgICAgICAgICAgaWYgKCRhYWJFbnRyaWVzIHwgV2hlcmUtT2JqZWN0IHsgJF8gLW1hdGNoICcoP2kpb3V5YV9pY29ufG91eWFfLipcLihwbmd8cHNkKSQnIH0pIHsKICAgICAgICAgICAgICB0aHJvdyAiUmV0aXJlZCBPVVlBIHB1YmxpY2F0aW9uIHJlc291cmNlIGZvdW5kIGluIEFBQi4iCiAgICAgICAgICAgIH0K
          NEW1: 
          OLD2: ICAgICAgICAgIGlmICgkZnVsbE1hbmlmZXN0RXhpdCAtbmUgMCkgeyB0aHJvdyAiQ29tcGlsZWQgQUFCIGZ1bGwtbWFuaWZlc3QgZHVtcCBmYWlsZWQgKGV4aXQgJGZ1bGxNYW5pZmVzdEV4aXQpLiIgfQogICAgICAgICAgaWYgKCRmdWxsTWFuaWZlc3RUZXh0IC1tYXRjaCAnPHVzZXMtcGVybWlzc2lvbig/OlxzfD4pJykgewo=
          NEW2: 
          OLD3: ICAgICAgICAgICBkaXN0L25vdGljZS1wYWNrYWdlLWV2aWRlbmNlLnR4dAo=
          NEW3: ICAgICAgICAgICBkaXN0L25vdGljZS1wYWNrYWdlLWV2aWRlbmNlLnR4dAogICAgICAgICAgICBkaXN0L291eWEtbGVnYWN5LXJlc291cmNlLWV2aWRlbmNlLnR4dAo=
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('.github/workflows/gate2a-android-release.yml')
          text=p.read_text()
          for label in ('1','2','3'):
              old=base64.b64decode(os.environ['OLD'+label]).decode()
              new=base64.b64decode(os.environ['NEW'+label]).decode()
              n=text.count(old)
              if n != 1: raise SystemExit(f'replacement {label}: expected 1 match, got {n}')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/gate2a-android-release.yml'
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gate2a-android-release.yml
          git commit -m 'Gate 2A rev41: prove legacy AIR OUYA resource identities'
          git push origin HEAD:gate2a-ouya-gate-fix-r1

name: Gate 2A Apply Offline Cleanup

on:
  push:
    branches:
      - gate2a-network-cleanup-staging

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup staging
        uses: actions/checkout@v4
        with:
          ref: gate2a-network-cleanup-staging
          fetch-depth: 0

      - name: Remove obsolete runtime network dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          play_path = Path('src/PlayState.as')
          play = play_path.read_text(encoding='utf-8')
          for line in ('\timport flash.net.URLLoader;\n', '\timport flash.net.URLRequest;\n'):
              count = play.count(line)
              if count != 1:
                  raise SystemExit(f'Expected one import {line!r}, found {count}')
              play = play.replace(line, '', 1)

          start_needle = '\t\t\tif (Sprite2 is SoftDrink) {'
          end_needle = '\n\t\t\tif (Sprite2 is SugarBag) {'
          start = play.find(start_needle)
          end = play.find(end_needle, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate SoftDrink pickup block')
          segment = play[start:end]
          endpoint = 'http://initialscommand.com/php/add.php'
          if endpoint not in segment:
              raise SystemExit('SoftDrink block did not contain expected legacy telemetry endpoint')
          replacement = '\t\t\tif (Sprite2 is SoftDrink) {\n\t\t\t\thasCollectedCap = true;\n\t\t\t}\n\t\t\t'
          play = play[:start] + replacement + play[end:]
          if endpoint in play:
              raise SystemExit('Legacy SoftDrink telemetry endpoint still present after edit')
          play_path.write_text(play, encoding='utf-8', newline='\n')

          prize_b64 = ''
          Path('src/PrizeState.as').write_bytes(base64.b64decode(prize_b64))

          app_path = Path('application.xml')
          app = app_path.read_text(encoding='utf-8')
          permission = '\t<uses-permission android:name="android.permission.INTERNET" />\n'
          if app.count(permission) != 1:
              raise SystemExit(f'Expected exactly one INTERNET permission, found {app.count(permission)}')
          app = app.replace(permission, '', 1)
          app_path.write_text(app, encoding='utf-8', newline='\n')

          for forbidden in (
              'http://initialscommand.com/php/add.php',
              'http://initialscommand.com/php/oldschool_add.php',
              'http://initialscommand.com/php/oldschool_count.txt',
              'http://superlemonadefactory.initialsgames.com/log.xml',
              'mailto:initials@initialsgames.com',
          ):
              if forbidden in Path('src/PlayState.as').read_text(encoding='utf-8') or forbidden in Path('src/PrizeState.as').read_text(encoding='utf-8'):
                  raise SystemExit(f'Forbidden runtime endpoint survived cleanup: {forbidden}')
          if 'android.permission.INTERNET' in Path('application.xml').read_text(encoding='utf-8'):
              raise SystemExit('INTERNET permission survived cleanup')
          PY

          git diff --check
          git diff -- src/PlayState.as src/PrizeState.as application.xml

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/gate2a-apply-network-cleanup.yml
          git config user.name "Gate2A Alfred QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/PlayState.as src/PrizeState.as application.xml .github/workflows/gate2a-apply-network-cleanup.yml
          git diff --cached --check
          git commit -m "fix: make restored Android game network-free"
          git push origin HEAD:gate2a-network-cleanup-staging

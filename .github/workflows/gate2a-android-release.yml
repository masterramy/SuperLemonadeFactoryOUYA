name: Gate 2A Android Release Bundle

on:
  push:
    branches:
      - gate2a-android-modernization
      - gate2a-release-hardening-staging
  workflow_dispatch:
    inputs:
      production_signing:
        description: "Use private production signing secrets instead of a disposable validation certificate"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PRODUCTION_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.production_signing }}
      SLF_ANDROID_KEYSTORE_BASE64: ${{ secrets.SLF_ANDROID_KEYSTORE_BASE64 }}
      SLF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SLF_ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true

      - name: Compile release SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Package Android App Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SLF-release.aab
          Remove-Item -Force -ErrorAction SilentlyContinue release-signing.p12

          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) {
            throw "No usable Android SDK path was found on the GitHub runner."
          }

          $keyPath = Join-Path $PWD 'release-signing.p12'
          if ($env:PRODUCTION_SIGNING -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:SLF_ANDROID_KEYSTORE_BASE64)) {
              throw "Production signing requested, but SLF_ANDROID_KEYSTORE_BASE64 is not configured."
            }
            if ([string]::IsNullOrWhiteSpace($env:SLF_ANDROID_KEYSTORE_PASSWORD)) {
              throw "Production signing requested, but SLF_ANDROID_KEYSTORE_PASSWORD is not configured."
            }
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SLF_ANDROID_KEYSTORE_BASE64))
            $storePass = $env:SLF_ANDROID_KEYSTORE_PASSWORD
            $signingMode = 'production-secret'
          } else {
            $storePass = 'gate2a-validation'
            & adt -certificate -validityPeriod 1 -cn "Gate 2A Validation" 2048-RSA $keyPath $storePass
            if ($LASTEXITCODE -ne 0) { throw "Failed to create disposable validation certificate." }
            $signingMode = 'disposable-validation'
          }

          & adt -package -target aab -storetype pkcs12 -keystore $keyPath -storepass $storePass dist/SLF-release.aab application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { throw "ADT AAB packaging failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path dist/SLF-release.aab)) { throw "ADT reported success but no AAB was produced." }

          $aab = Get-Item dist/SLF-release.aab
          if ($aab.Length -le 0) { throw "Produced AAB is empty." }
          $hash = (Get-FileHash -Algorithm SHA256 $aab.FullName).Hash.ToLowerInvariant()

          @(
            "commit=$env:GITHUB_SHA"
            "air_sdk=51.3.4.1"
            "android_target_sdk=36"
            "android_min_sdk=21"
            "signing_mode=$signingMode"
            "aab_bytes=$($aab.Length)"
            "aab_sha256=$hash"
          ) | Set-Content -Path dist/release-metadata.txt -Encoding utf8

          # Independently inspect the compiled App Bundle manifest with Google's
          # bundletool. Pin both the release and SHA-256 so this verification step
          # cannot silently drift to different bytes.
          $bundletoolVersion = '1.18.3'
          $bundletoolExpectedSha256 = 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
          $bundletoolPath = Join-Path $PWD "bundletool-all-$bundletoolVersion.jar"
          $bundletoolUrl = "https://github.com/google/bundletool/releases/download/$bundletoolVersion/bundletool-all-$bundletoolVersion.jar"
          Invoke-WebRequest -Uri $bundletoolUrl -OutFile $bundletoolPath
          $bundletoolHash = (Get-FileHash -Algorithm SHA256 $bundletoolPath).Hash.ToLowerInvariant()
          if ($bundletoolHash -ne $bundletoolExpectedSha256) {
            throw "bundletool SHA-256 mismatch. Expected $bundletoolExpectedSha256, got $bundletoolHash."
          }

          $PSNativeCommandUseErrorActionPreference = $false
          $targetOutput = & java -jar $bundletoolPath dump manifest "--bundle=$($aab.FullName)" '--xpath=/manifest/uses-sdk/@android:targetSdkVersion' 2>&1
          $targetExit = $LASTEXITCODE
          $targetValue = (($targetOutput | Out-String).Trim())
          $targetOutput | Set-Content -Path dist/manifest-target-sdk.txt -Encoding utf8
          if ($targetExit -ne 0 -or $targetValue -ne '36') {
            throw "Compiled AAB target SDK verification failed. Expected 36, got '$targetValue' (exit $targetExit)."
          }

          $minOutput = & java -jar $bundletoolPath dump manifest "--bundle=$($aab.FullName)" '--xpath=/manifest/uses-sdk/@android:minSdkVersion' 2>&1
          $minExit = $LASTEXITCODE
          $minValue = (($minOutput | Out-String).Trim())
          $minOutput | Set-Content -Path dist/manifest-min-sdk.txt -Encoding utf8
          if ($minExit -ne 0 -or $minValue -ne '21') {
            throw "Compiled AAB min SDK verification failed. Expected 21, got '$minValue' (exit $minExit)."
          }

          Add-Content -Path dist/release-metadata.txt -Value 'manifest_target_sdk_verified=36'
          Add-Content -Path dist/release-metadata.txt -Value 'manifest_min_sdk_verified=21'
          Add-Content -Path dist/release-metadata.txt -Value "bundletool_version=$bundletoolVersion"
          Add-Content -Path dist/release-metadata.txt -Value "bundletool_sha256=$bundletoolHash"
          $global:LASTEXITCODE = 0

          Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          Remove-Item -Force -ErrorAction SilentlyContinue $bundletoolPath

      - name: Upload release bundle proof
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-android-release-aab
          path: |
            dist/SLF-release.aab
            dist/release-metadata.txt
            dist/manifest-target-sdk.txt
            dist/manifest-min-sdk.txt
          if-no-files-found: error

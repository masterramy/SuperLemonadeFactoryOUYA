name: Gate 2A Exhaustive 72 Completion Save QA

on:
  push:
    branches:
      - gate2a-exhaustive-completion-qa
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-exhaustive-completion-qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile completion QA SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 completion QA APK with transient repository retry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Completion QA" 2048-RSA gate2a-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path dist/SLF-completion-qa.apk) { Remove-Item -Force dist/SLF-completion-qa.apk }
            Write-Host "ADT package attempt $attempt/3"
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-qa.p12 -storepass gate2a dist/SLF-completion-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-completion-qa-apk
          path: dist/SLF-completion-qa.apk
          if-no-files-found: error

  runtime-completion-72:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-exhaustive-completion-qa
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-completion-qa-apk
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run 72 completion/save paths on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash qa/complete72.sh
      - name: Upload completion matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-exhaustive-completion-evidence
          path: qa-out
          if-no-files-found: error

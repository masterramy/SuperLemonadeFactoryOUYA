name: Gate 2A Q5 R21 Semantic-Guarded Bounded Replay

on:
  push:
    branches: [qa/q5-r21-runtime-guard]
    paths: [.github/workflows/gate2a-q5-level2-r21-runtime-guard.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r21:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {fetch-depth: 32}
      - name: Verify QA-only frozen ancestry and authored Level-2 objective
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          FROZEN=afc2e65a65dc95e35ef3391b92be8adc7827e16f
          test "$(git merge-base HEAD "$FROZEN")" = "$FROZEN"
          test "$(git diff --name-only "$FROZEN"..HEAD)" = ".github/workflows/gate2a-q5-level2-r21-runtime-guard.yml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='data/SLF_levelEditor/PC/level2.oel'
          r=ET.parse(p).getroot()
          solids=[x.attrib for x in r.find('solids')]
          extras=[x.attrib for x in r.find('extraPlatforms')]
          objs=[(x.tag,x.attrib) for x in r.find('objects')]
          assert any(x.get('x')=='740' and x.get('y')=='400' and x.get('w')=='280' for x in solids)
          assert any(x.get('x')=='1020' and x.get('y')=='510' and x.get('width')=='70' for x in extras)
          assert any(t=='exit' and a.get('x')=='1320' for t,a in objs)
          open('proof/source-grounding.txt','w').write('upper_platform_x=740..1020\nspikes_x=1020..1090\nexit_x=1320\nobjective=after live R18 semantic-state PASS, test exactly one bounded rightward double-jump across the spike barrier; this is not completion proof\n')
          PY
          printf '%s\n' ordinary_shipping_inputs_only=true save_or_game_state_edit=false teleport=false forced_completion=false shipping_mutation=false required_live_semantic_guard=R20_validated_R18_specific new_action=one_bounded_RIGHT_plus_double_jump post_action_gameplay_input=false > proof/method.txt
      - name: Download runtime-equivalent emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34777986347
      - name: Verify exact runtime APK
        shell: bash
        run: |
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk
          test "$(wc -c < "$APK" | tr -d ' ')" = 35875619
          test "$(sha256sum "$APK" | awk '{print $1}')" = 53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2
      - name: Install image guard dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0 numpy==2.3.3
      - name: Write bounded probe
        shell: bash
        run: |
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk; PACKAGE=com.ramybaheeg.slfport; OUT=proof; DEV=/dev/input/event1
          capture(){ tag="$1"; adb shell dumpsys window > "$OUT/window-$tag.txt" 2>&1; adb exec-out screencap -p > "$OUT/$tag.png"; adb logcat -d > "$OUT/logcat-$tag.txt" 2>&1; pid=$(adb shell pidof "$PACKAGE"|tr -d '\r'); focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-$tag.txt"||true); printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-$tag.txt"; test -n "$pid"; echo "$focus"|grep -q "$PACKAGE"; ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-$tag.txt" > "$OUT/fatal-$tag.txt"; }
          health(){ tag="$1"; python3 - "$OUT/$tag.png" <<'PY'
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]).convert('RGB'); px=list(im.getdata()); n=len(px); lum=[sum(c)/3 for c in px]
          mean=sum(lum)/n; dark=sum(v<100 for v in lum)/n
          if not(mean>140 and dark<0.30): raise SystemExit(20)
          PY
          }
          semantic_r18_guard(){ tag="$1"; python3 - "$OUT/$tag.png" "$OUT/r18-semantic-guard.txt" <<'PY'
          from PIL import Image
          import numpy as np,sys
          im=np.asarray(Image.open(sys.argv[1]).convert('RGB'))
          h,w,_=im.shape
          x0,x1=int(w*.48),int(w*.70); y0,y1=int(h*.45),int(h*.78)
          q=im[y0:y1,x0:x1].astype(np.int16)
          R,G,B=q[:,:,0],q[:,:,1],q[:,:,2]
          green=((G>110)&((G-R)>25)&((G-B)>25)).mean()
          sat=((q.max(axis=2)-q.min(axis=2))>60).mean()
          accept=(green>=0.004 and sat>=0.050)
          open(sys.argv[2],'w').write(f'roi={(x0,y0,x1,y1)}\ngreen_fraction={green:.6f}\nsaturated_fraction={sat:.6f}\naccept={accept}\n')
          print(f'R18 semantic guard green={green:.6f} sat={sat:.6f} accept={accept}')
          if not accept: raise SystemExit(31)
          PY
          }
          dismiss(){ wanted="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1||return 0; adb pull /sdcard/window.xml "$OUT/window-ui.xml" >/dev/null 2>&1||return 0; coords=$(python3 - "$OUT/window-ui.xml" "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse(sys.argv[1]).getroot()
          except:raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[2]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
          PY
          ); [ -z "$coords" ]||{ adb shell input tap $coords >/dev/null 2>&1||true; sleep 1; }; }
          checkpoint(){ capture "$1"; health "$1"; }
          jr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1&p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .20; }
          dr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1&p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; sleep .16; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .20; }
          wl(){ adb shell input keyevent --longpress KEYCODE_DPAD_LEFT >/dev/null 2>&1||true; sleep .25; }
          down(){ adb shell "sendevent $DEV 1 $1 1; sendevent $DEV 0 0 0"; }; up(){ adb shell "sendevent $DEV 1 $1 0; sendevent $DEV 0 0 0"; }
          rawleft_park(){ down 105; sleep .80; up 105; }
          adb root >/dev/null 2>&1; sleep 2; adb wait-for-device; adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1||true; adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1||true; adb shell settings put system user_rotation 1 >/dev/null 2>&1||true; adb shell wm user-rotation lock 1 >/dev/null 2>&1||true; adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1||true; adb shell wm dismiss-keyguard >/dev/null 2>&1||true
          adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1||true; adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 4
          for _ in 1 2 3 4; do dismiss 'Got it'; dismiss 'Wait'; sleep 1; done; sleep 8
          adb shell input keyevent KEYCODE_X; sleep 2; adb shell input keyevent KEYCODE_X; sleep 8; adb shell input keyevent KEYCODE_X; sleep 4; adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1; adb shell input keyevent KEYCODE_X; sleep 12; adb shell input keyevent KEYCODE_X; sleep 12
          for i in 1 2 3; do checkpoint "cutscene-$i"; python3 - "$OUT/cutscene-$i.png" <<'PY' || break
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]).convert('RGB'); w,h=im.size; pts=[im.getpixel((x,y)) for y in list(range(0,int(h*.15),4))+list(range(int(h*.85),h,4)) for x in range(int(w*.1),int(w*.9),4)]; raise SystemExit(0 if sum(max(p)<35 for p in pts)/len(pts)>.70 else 1)
          PY
            adb shell input keyevent KEYCODE_Y; sleep 4
          done
          checkpoint 01-start
          for i in $(seq 1 7); do jr; done
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 11); do dr; done
          for i in $(seq 1 6); do wl; done
          adb shell input keyevent KEYCODE_V; sleep 2
          checkpoint 06-pre-park-andre
          rawleft_park; sleep 1.25; checkpoint 08-park-andre-settled
          adb shell input keyevent KEYCODE_V; sleep 1.25
          checkpoint 10-r18-candidate
          semantic_r18_guard 10-r18-candidate
          dr
          capture 11-bounded-action-immediate
          sleep 1.25
          checkpoint 12-bounded-action-settled
          printf 'Live R18 semantic guard PASS required before exactly one bounded RIGHT+double-jump; immediate and settled states captured; zero later gameplay input.\n' > "$OUT/result.txt"
          EOF
          chmod +x probe.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and run R21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-afc2-level2-r21-runtime-guard
          path: proof
          if-no-files-found: error

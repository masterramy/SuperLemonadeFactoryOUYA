name: Gate 2B Publication Candidate Cert

on:
  push:
    branches:
      - gate2b-cert-qa

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: d7783af3dbaa0a27071c51d5965f2e9dec5864e2
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile exact candidate
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Create ephemeral QA certificate
        shell: cmd
        run: adt -certificate -validityPeriod 1 -cn "Gate 2B Candidate QA" 2048-RSA gate2b-qa.p12 gate2b
      - name: Package device and x64 emulator APKs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $sdk=$env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) {$sdk=$env:ANDROID_HOME}
          & adt -package -target apk -storetype pkcs12 -keystore gate2b-qa.p12 -storepass gate2b dist/SLF-Port-candidate.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "device APK packaging failed" }
          & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2b-qa.p12 -storepass gate2b dist/SLF-Port-emulator-x64.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "emulator APK packaging failed" }
          Get-FileHash -Algorithm SHA256 dist/SLF-Port-candidate.apk | Format-List | Out-File dist/hashes.txt
          Get-FileHash -Algorithm SHA256 dist/SLF-Port-emulator-x64.apk | Format-List | Out-File dist/hashes.txt -Append
          "source_commit=d7783af3dbaa0a27071c51d5965f2e9dec5864e2" | Out-File dist/source.txt
          "package_id=com.ramybaheeg.slfport" | Out-File dist/source.txt -Append
          "air_runtime_package=air.com.ramybaheeg.slfport" | Out-File dist/source.txt -Append
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2b-candidate-build
          path: |
            dist/SLF-Port-candidate.apk
            dist/SLF-Port-emulator-x64.apk
            dist/hashes.txt
            dist/source.txt

  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2b-candidate-build
          path: runtime-apk
      - name: Write full rendered-surface certification
        shell: bash
        run: |
          cat > certify.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          APK="runtime-apk/SLF-Port-emulator-x64.apk"
          PACKAGE="air.com.ramybaheeg.slfport"

          alive_focus() {
            local tag="$1"
            test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            adb shell dumpsys window > "evidence/${tag}-window.txt"
            grep -m1 'mCurrentFocus=' "evidence/${tag}-window.txt" | grep -q "$PACKAGE"
          }

          fatal_scan() {
            local tag="$1"
            adb logcat -d > "evidence/${tag}-logcat.txt"
            if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "evidence/${tag}-logcat.txt" > "evidence/${tag}-fatal-scan.txt"; then
              exit 70
            fi
          }

          start_clean() {
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" >/dev/null 2>&1
            sleep 12
          }

          to_menu() {
            adb shell input keyevent KEYCODE_X
            sleep 2
            adb shell input keyevent KEYCODE_X
            sleep 10
          }

          adb install -r "$APK" > evidence/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb logcat -c

          start_clean
          adb exec-out screencap -p > evidence/01-intro.png
          alive_focus 01-intro
          to_menu
          adb exec-out screencap -p > evidence/02-menu-stable.png
          alive_focus 02-menu-stable

          # Options and menu re-entry.
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 5
          adb exec-out screencap -p > evidence/03-options.png
          alive_focus 03-options
          adb shell input keyevent KEYCODE_1; sleep 8
          adb exec-out screencap -p > evidence/04-menu-after-options.png
          alive_focus 04-menu-after-options

          # Help -> Privacy/About -> Help -> menu.
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 5
          adb exec-out screencap -p > evidence/05-help.png
          alive_focus 05-help
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 5
          adb exec-out screencap -p > evidence/06-privacy-about.png
          alive_focus 06-privacy-about
          fatal_scan 06-privacy-about
          adb shell input keyevent KEYCODE_X; sleep 4
          adb shell input keyevent KEYCODE_X; sleep 8

          # Credits / Port Info and second menu re-entry.
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 5
          adb exec-out screencap -p > evidence/07-credits-port-info.png
          alive_focus 07-credits-port-info
          fatal_scan 07-credits-port-info
          adb shell input keyevent KEYCODE_X; sleep 8
          adb exec-out screencap -p > evidence/08-menu-final.png
          alive_focus 08-menu-final

          # Reset solely to remove any state/race ambiguity from the gameplay lane.
          start_clean
          to_menu
          adb shell input keyevent KEYCODE_X; sleep 8
          adb exec-out screencap -p > evidence/09-level-select.png
          alive_focus 09-level-select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 18
          adb exec-out screencap -p > evidence/10-gameplay.png
          alive_focus 10-gameplay
          fatal_scan 10-gameplay

          printf 'PASS-CANDIDATE source=d7783af3dbaa0a27071c51d5965f2e9dec5864e2 package=%s rendered_surfaces=intro,menu,options,menu-reentry,help,privacy,credits,menu-reentry,level-select,gameplay\n' "$PACKAGE" > evidence/result.txt
          EOF
          chmod +x certify.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and certify rendered surfaces
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash certify.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2b-candidate-runtime
          path: evidence
          if-no-files-found: warn

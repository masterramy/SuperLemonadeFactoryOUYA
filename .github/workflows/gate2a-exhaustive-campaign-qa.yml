name: Gate 2A Exhaustive 72 Campaign Runtime QA

on:
  push:
    branches:
      - gate2a-exhaustive-qa
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-exhaustive-qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile QA SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 emulator APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Exhaustive QA" 2048-RSA gate2a-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-qa.p12 -storepass gate2a dist/SLF-exhaustive-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-exhaustive-qa-apk
          path: dist/SLF-exhaustive-qa.apk
          if-no-files-found: error

  runtime-72:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-exhaustive-qa-apk
          path: runtime-apk
      - name: Install image analysis dependency
        run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write exhaustive runtime harness
        shell: bash
        run: |
          cat > exhaustive.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          mkdir -p qa/screens qa/logs
          APK="runtime-apk/SLF-exhaustive-qa.apk"
          PACKAGE="air.com.initialsgames.SLF"
          FAIL=0

          adb install -r "$APK" > qa/install.txt 2>&1 || exit 10
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true

          adb logcat -c
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > qa/launch.txt 2>&1
          sleep 14

          adb exec-out screencap -p > qa/initial.png
          read W H < <(python3 - <<'PY'
          from PIL import Image
          im=Image.open('qa/initial.png')
          print(im.width, im.height)
          PY
          )
          echo "screen=${W}x${H}" > qa/summary.txt
          if [ "$W" -le "$H" ]; then echo "FAIL non-landscape" >> qa/summary.txt; exit 11; fi

          LEFT_X=$((W / 12))
          RIGHT_X=$((W / 4))
          ACTION_X=$((W * 3 / 4))
          JUMP_X=$((W * 11 / 12))
          CTRL_Y=$((H * 7 / 8))

          echo "index,mode,world,level,pid,focused,width,height,central_std,central_entropy,diff_ratio,fatal" > qa/metrics.csv

          for IDX in $(seq 0 71); do
            if [ "$IDX" -gt 0 ]; then
              adb shell input keyevent KEYCODE_N >/dev/null 2>&1
              sleep 3
            fi

            MODE="normal"
            RAW=$IDX
            if [ "$IDX" -ge 36 ]; then MODE="hardcore"; RAW=$((IDX-36)); fi
            WORLD=$((RAW / 12 + 1))
            LEVEL=$((RAW % 12 + 1))
            TAG=$(printf "%02d-%s-w%d-l%02d" $((IDX+1)) "$MODE" "$WORLD" "$LEVEL")

            adb logcat -c
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            adb shell dumpsys window > "qa/logs/${TAG}-window.txt" 2>&1
            FOCUS=$(grep -m1 'mCurrentFocus=' "qa/logs/${TAG}-window.txt" || true)
            FOCUSED=0
            echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
            [ -z "$PID" ] && FAIL=1
            [ "$FOCUSED" -ne 1 ] && FAIL=1

            adb exec-out screencap -p > "qa/screens/${TAG}-start.png"

            # Exercise the real Android/mobile control zones: RIGHT hold, JUMP, ACTION,
            # then a short LEFT hold. This reaches MobileControls -> legacy keyboard input.
            adb shell input swipe "$RIGHT_X" "$CTRL_Y" "$RIGHT_X" "$CTRL_Y" 650 >/dev/null 2>&1
            adb shell input tap "$JUMP_X" "$CTRL_Y" >/dev/null 2>&1
            sleep 0.25
            adb shell input tap "$ACTION_X" "$CTRL_Y" >/dev/null 2>&1
            sleep 0.25
            adb shell input swipe "$LEFT_X" "$CTRL_Y" "$LEFT_X" "$CTRL_Y" 300 >/dev/null 2>&1
            sleep 1

            adb exec-out screencap -p > "qa/screens/${TAG}-exercised.png"
            adb logcat -d > "qa/logs/${TAG}-logcat.txt" 2>&1
            FATAL=0
            if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError" "qa/logs/${TAG}-logcat.txt" > "qa/logs/${TAG}-fatal.txt"; then
              FATAL=1; FAIL=1
            else
              : > "qa/logs/${TAG}-fatal.txt"
            fi

            METRICS=$(python3 - "qa/screens/${TAG}-start.png" "qa/screens/${TAG}-exercised.png" <<'PY'
          import sys, math
          from PIL import Image, ImageStat, ImageChops
          a=Image.open(sys.argv[1]).convert('RGB')
          b=Image.open(sys.argv[2]).convert('RGB')
          w,h=a.size
          # Ignore top QA label and bottom touch HUD for blank-frame scoring.
          crop=(0, int(h*0.10), w, int(h*0.72))
          g=a.crop(crop).convert('L')
          stat=ImageStat.Stat(g)
          std=float(stat.stddev[0])
          hist=g.histogram(); total=sum(hist)
          entropy=0.0
          for n in hist:
              if n:
                  p=n/total; entropy -= p*math.log(p,2)
          d=ImageChops.difference(a.crop(crop), b.crop(crop)).convert('L')
          dh=d.histogram(); changed=total-dh[0]
          ratio=changed/total if total else 0
          print(f"{w},{h},{std:.3f},{entropy:.3f},{ratio:.6f}")
          PY
            )
            IFS=',' read MW MH STD ENT DIFF <<< "$METRICS"
            python3 - "$STD" "$ENT" <<'PY'
          import sys
          std=float(sys.argv[1]); ent=float(sys.argv[2])
          raise SystemExit(0 if std >= 5.0 and ent >= 1.0 else 1)
          PY
            if [ $? -ne 0 ]; then
              echo "VISUAL_BLANK_RISK $TAG std=$STD entropy=$ENT" >> qa/failures.txt
              FAIL=1
            fi

            echo "$((IDX+1)),$MODE,$WORLD,$LEVEL,$PID,$FOCUSED,$MW,$MH,$STD,$ENT,$DIFF,$FATAL" >> qa/metrics.csv
          done

          python3 - <<'PY'
          import csv
          from PIL import Image, ImageDraw
          rows=list(csv.DictReader(open('qa/metrics.csv', newline='')))
          assert len(rows)==72, len(rows)
          for mode, start in [('normal',0),('hardcore',36)]:
              shots=[]
              selected=rows[start:start+36]
              for r in selected:
                  tag=f"{int(r['index']):02d}-{r['mode']}-w{r['world']}-l{int(r['level']):02d}"
                  im=Image.open(f"qa/screens/{tag}-exercised.png").convert('RGB')
                  im.thumbnail((390,180))
                  tile=Image.new('RGB',(400,210),'black')
                  tile.paste(im,((400-im.width)//2,0))
                  d=ImageDraw.Draw(tile)
                  d.text((6,184),f"{r['index']}/72 W{r['world']} L{r['level']} std={r['central_std']} diff={r['diff_ratio']}",fill='white')
                  shots.append(tile)
              sheet=Image.new('RGB',(2400,1260),'black')
              for i,tile in enumerate(shots):
                  x=(i%6)*400; y=(i//6)*210
                  sheet.paste(tile,(x,y))
              sheet.save(f"qa/{mode}-contact-sheet.jpg",quality=88)
          PY

          if [ -f qa/failures.txt ]; then cat qa/failures.txt >> qa/summary.txt; fi
          echo "variants=72" >> qa/summary.txt
          echo "fail=$FAIL" >> qa/summary.txt
          if [ "$FAIL" -ne 0 ]; then exit 20; fi
          echo "PASS: 72/72 Android runtime variants loaded, remained focused/alive/landscape, passed central-frame nonblank scoring, received real mobile control-zone exercise, and produced no fatal/AS3 runtime signatures." >> qa/summary.txt
          exit 0
          EOF
          chmod +x exhaustive.sh
      - name: Run all 72 campaign variants on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash exhaustive.sh
      - name: Upload exhaustive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-exhaustive-72-evidence
          path: qa
          if-no-files-found: error

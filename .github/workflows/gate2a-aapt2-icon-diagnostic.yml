name: Gate 2A AAPT2 Icon Diagnostic

on:
  push:
    branches:
      - gate2a-aapt2-icon-diagnostic-r20

permissions:
  contents: read

jobs:
  aapt2-icon-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove product-byte equivalence to exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = 'fb89f9780d43127156ec86a1d666292e11ffb7cd'
          $parent = (& git rev-parse HEAD^).Trim()
          if ($parent -ne $candidate) { throw "Diagnostic parent mismatch. Expected $candidate, got $parent" }
          $changed = @(& git diff --name-only $candidate HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/gate2a-aapt2-icon-diagnostic.yml') {
            throw "Diagnostic branch changed product bytes or unexpected files: $($changed -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          @(
            "diagnostic_head=$((& git rev-parse HEAD).Trim())"
            "candidate_parent=$parent"
            "candidate_tree=$((& git rev-parse "$candidate^{tree}").Trim())"
            "diagnostic_tree=$((& git rev-parse 'HEAD^{tree}').Trim())"
            "only_changed_path=$($changed[0])"
          ) | Set-Content diag/source-equivalence.txt -Encoding utf8

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1 # signed v2 target
        with:
          air-version: '51.3.4.3'
          accept-license: true

      - name: Inspect exact icon inputs with independent AAPT2 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path diag/direct | Out-Null

          $sourceIcon = (Resolve-Path 'icons/android/icons/icon_192.png').Path
          $airOuya = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          $airPlaceholder = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/mipmap-xxxhdpi/icon.png'
          $inputs = @(
            [PSCustomObject]@{ Name='source-icon-192'; Path=$sourceIcon },
            [PSCustomObject]@{ Name='air-template-ouya'; Path=$airOuya },
            [PSCustomObject]@{ Name='air-template-placeholder'; Path=$airPlaceholder }
          )

          foreach ($input in $inputs) {
            if (-not (Test-Path -LiteralPath $input.Path -PathType Leaf)) { throw "Missing diagnostic input: $($input.Path)" }
            $item = Get-Item -LiteralPath $input.Path
            $sha = (Get-FileHash -Algorithm SHA256 $input.Path).Hash.ToLowerInvariant()
            $img = [System.Drawing.Image]::FromFile($input.Path)
            try {
              "$($input.Name)|bytes=$($item.Length)|sha256=$sha|width=$($img.Width)|height=$($img.Height)|pixel_format=$($img.PixelFormat)" |
                Add-Content diag/input-identities.txt
            } finally { $img.Dispose() }
          }

          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) { throw 'Android SDK unavailable.' }

          $tools = @()
          Get-ChildItem -Directory (Join-Path $androidSdk 'build-tools') | Sort-Object Name | ForEach-Object {
            $exe = Join-Path $_.FullName 'aapt2.exe'
            if (Test-Path $exe) { $tools += [PSCustomObject]@{ Name=('android-build-tools-' + $_.Name); Path=$exe } }
          }
          $airAapt2 = Join-Path $env:AIR_HOME 'lib/android/bin/aapt2.exe'
          if (Test-Path $airAapt2) { $tools += [PSCustomObject]@{ Name='air-bundled-aapt2'; Path=$airAapt2 } }

          foreach ($tool in $tools) {
            $toolDir = Join-Path 'diag/direct' $tool.Name
            New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
            $toolSha = (Get-FileHash -Algorithm SHA256 $tool.Path).Hash.ToLowerInvariant()
            $version = (& $tool.Path version 2>&1 | Out-String).Trim()
            "tool=$($tool.Name)|path=$($tool.Path)|sha256=$toolSha|version=$version" | Add-Content diag/tool-identities.txt
            foreach ($input in $inputs) {
              $outDir = Join-Path $toolDir $input.Name
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null
              $PSNativeCommandUseErrorActionPreference = $false
              $output = & $tool.Path compile --legacy -o $outDir $input.Path 2>&1
              $exit = $LASTEXITCODE
              $output | Set-Content (Join-Path $outDir 'console.txt') -Encoding utf8
              "tool=$($tool.Name)|input=$($input.Name)|exit=$exit" | Add-Content diag/direct-results.txt
              $global:LASTEXITCODE = 0
            }
          }

      - name: Reproduce ADT packaging and capture generated resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,diag/adt,diag/temp | Out-Null
          if (Test-Path bin/SLFforOuya.swf) { Remove-Item -Force bin/SLFforOuya.swf }
          & amxmlc -load-config+=obj/SLF_for_OuyaConfig.xml -output=bin/SLFforOuya.swf
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic compile failed: $LASTEXITCODE" }

          $cert = Join-Path $PWD 'diag/diag-signing.p12'
          & adt -certificate -validityPeriod 1 -cn 'Gate2A AAPT2 Diagnostic' 2048-RSA $cert gate2a
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic cert failed: $LASTEXITCODE" }

          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $env:TEMP = (Resolve-Path 'diag/temp').Path
          $env:TMP = $env:TEMP
          $outputPath = Join-Path $PWD 'diag/adt/diagnostic.aab'
          $PSNativeCommandUseErrorActionPreference = $false
          $adtOutput = & adt -package -target aab -storetype pkcs12 -keystore $cert -storepass gate2a $outputPath application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md -C third_party/licenses flixel-2.55-MIT.txt flixel-power-tools-Simplified-BSD.txt as3-controller-input-MIT.txt -platformsdk $androidSdk 2>&1
          $adtExit = $LASTEXITCODE
          $adtOutput | Set-Content diag/adt/console.txt -Encoding utf8
          "adt_exit=$adtExit" | Set-Content diag/adt/result.txt
          $global:LASTEXITCODE = 0

          $candidateFiles = Get-ChildItem -Path diag/temp -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('icon.png','ouya_icon.png') }
          foreach ($f in $candidateFiles) {
            $sha = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            $rel = [IO.Path]::GetRelativePath((Resolve-Path 'diag/temp').Path, $f.FullName).Replace('\','/')
            "$rel|bytes=$($f.Length)|sha256=$sha" | Add-Content diag/adt/generated-resource-identities.txt
            $safe = ($rel -replace '[^A-Za-z0-9._-]','_')
            Copy-Item -LiteralPath $f.FullName -Destination (Join-Path 'diag/adt' $safe) -Force
          }
          if (-not $candidateFiles) { 'no-generated-resources-survived-adt-cleanup' | Set-Content diag/adt/generated-resource-identities.txt }

          $gradleAapt2 = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.gradle') -Recurse -File -Filter aapt2.exe -ErrorAction SilentlyContinue | Select-Object -First 10
          foreach ($tool in $gradleAapt2) {
            $sha = (Get-FileHash -Algorithm SHA256 $tool.FullName).Hash.ToLowerInvariant()
            $version = (& $tool.FullName version 2>&1 | Out-String).Trim()
            "$($tool.FullName)|bytes=$($tool.Length)|sha256=$sha|version=$version" | Add-Content diag/adt/gradle-aapt2-identities.txt
            foreach ($pair in @(
              [PSCustomObject]@{Name='source-icon-192';Path=(Resolve-Path 'icons/android/icons/icon_192.png').Path},
              [PSCustomObject]@{Name='air-template-ouya';Path=(Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png')}
            )) {
              $outDir = Join-Path 'diag/adt' (('gradle-' + $sha.Substring(0,12) + '-' + $pair.Name))
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null
              $o = & $tool.FullName compile --legacy -o $outDir $pair.Path 2>&1
              $e = $LASTEXITCODE
              $o | Set-Content (Join-Path $outDir 'console.txt') -Encoding utf8
              "gradle_aapt2=$sha|input=$($pair.Name)|exit=$e" | Add-Content diag/adt/gradle-direct-results.txt
              $global:LASTEXITCODE = 0
            }
          }

      - name: Upload AAPT2 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-aapt2-icon-diagnostic
          path: diag
          if-no-files-found: error

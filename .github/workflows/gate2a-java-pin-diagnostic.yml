name: Gate2A Java pin diagnostic

on:
  push:
    branches:
      - gate2a-java-pin-diagnostic

permissions:
  contents: read

jobs:
  java-pin:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Set up exact Temurin 17.0.20.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17.0.20.1"
      - name: Record resolved Java
        shell: pwsh
        run: |
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

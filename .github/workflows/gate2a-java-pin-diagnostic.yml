name: Gate2A Java pin diagnostic

on:
  push:
    branches:
      - gate2a-java-pin-diagnostic

permissions:
  contents: read

jobs:
  java-pin:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Set up exact Temurin 17.0.20+101
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+101"
      - name: Record resolved Java
        shell: pwsh
        run: |
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

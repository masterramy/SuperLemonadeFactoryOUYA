name: Gate 2A Cold Display Certification

on:
  push:
    branches: [gate2a-display-scale-staging]
  workflow_dispatch:

concurrency:
  group: gate2a-cold-display-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-display-scale-staging
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile candidate
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 QA APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Cold Display Cert" 2048-RSA cold.p12 gate2a
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $sdk=$env:ANDROID_SDK_ROOT; if([string]::IsNullOrWhiteSpace($sdk)){$sdk=$env:ANDROID_HOME}
          $ok=$false
          for($n=1;$n -le 3;$n++){
            Remove-Item -Force -ErrorAction SilentlyContinue dist/SLF-cold-display.apk
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore cold.p12 -storepass gate2a dist/SLF-cold-display.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $sdk
            if($LASTEXITCODE -eq 0 -and (Test-Path dist/SLF-cold-display.apk)){$ok=$true;break}
            if($n -lt 3){Start-Sleep 45}
          }
          if(-not $ok){throw 'APK packaging failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-cold-display-apk
          path: dist/SLF-cold-display.apk
          if-no-files-found: error

  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-cold-display-apk
          path: apk
      - run: python3 -m pip install --quiet pillow numpy
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write cold-launch certification harness
        shell: bash
        run: |
          cat > cold-display.sh <<'EOS'
          #!/usr/bin/env bash
          set +e
          O=cold-display; mkdir -p "$O"; P=air.com.initialsgames.SLF; FAIL=0
          rgbdiff(){ python3 - "$1" "$2" <<'PY'
          import sys,numpy as np
          from PIL import Image
          a=np.asarray(Image.open(sys.argv[1]).convert('RGB')); b=np.asarray(Image.open(sys.argv[2]).convert('RGB'))
          if a.shape!=b.shape: print('1.000000')
          else: print(f'{np.any(a!=b,axis=2).mean():.6f}')
          PY
          }
          view(){ python3 - "$1" "$2" <<'PY'
          import sys
          w,h=map(int,sys.argv[1:]); vw=min(w,h*16/9); vh=vw*9/16; print(round((w-vw)/2),round((h-vh)/2),round(vw),round(vh))
          PY
          }
          overlaycheck(){ python3 - "$1" <<'PY'
          import sys,numpy as np
          from PIL import Image
          a=np.asarray(Image.open(sys.argv[1]).convert('RGB')); h,w=a.shape[:2]; vw=min(w,h*16/9); vh=vw*9/16; x=round((w-vw)/2); y=round((h-vh)/2); vw=round(vw); vh=round(vh)
          counts=[]; ok=True
          for i in range(6):
              xa=round(x+vw*i/6); xb=round(x+vw*(i+1)/6); ya=round(y+vh*.75); yb=round(y+vh)
              c=a[ya:yb,xa:xb]; m=(c.min(2)>170)&((c.max(2)-c.min(2))<60); counts.append(int(m.sum())); ok &= counts[-1]>80
          xa=round(x+vw*5/6); xb=round(x+vw); ya=y; yb=round(y+vh*.17); c=a[ya:yb,xa:xb]; m=(c.min(2)>170)&((c.max(2)-c.min(2))<60); pause=int(m.sum()); ok &= pause>40
          print(('1' if ok else '0')+':' + ','.join(map(str,counts)) + f':pause={pause}')
          raise SystemExit(0 if ok else 2)
          PY
          }
          darkness(){ python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import sys,numpy as np
          from PIL import Image
          a=np.asarray(Image.open(sys.argv[1]).convert('RGB')).mean(2); b=np.asarray(Image.open(sys.argv[2]).convert('RGB')).mean(2); x,y,w,h=map(int,sys.argv[3:7]); aa=a[y:y+h,x:x+w].mean(); bb=b[y:y+h,x:x+w].mean(); print(f'{bb/aa if aa else 1:.6f}')
          PY
          }
          adb install -r apk/SLF-cold-display.apk >"$O/install.txt" 2>&1 || exit 10
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          echo label,requested,actual,viewport,overlay,right,pause,dark,pid,focus,fatal >"$O/results.csv"
          labels=(16x9 ultra pixel tablet fold); sizes=(1080x1920 1080x2400 1440x3120 1200x1600 1600x1760); exp=(1920x1080 2400x1080 3120x1440 1600x1200 1760x1600)
          for i in 0 1 2 3 4; do
            L=${labels[$i]}; REQ=${sizes[$i]}; EXPECT=${exp[$i]}
            adb shell wm size "$REQ" >/dev/null 2>&1; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
            adb shell am force-stop "$P" >/dev/null 2>&1 || true; adb shell pm clear "$P" >/dev/null 2>&1 || true; adb logcat -c
            adb shell am start -W -n "$P/.AIRAppEntry" >"$O/$L-launch.txt" 2>&1; sleep 8; adb exec-out screencap -p >"$O/$L-01-intro.png"
            read W H < <(python3 - "$O/$L-01-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
            ); ACT=${W}x${H}; [ "$ACT" != "$EXPECT" ] && FAIL=1
            read X Y VW VH < <(view "$W" "$H"); CX=$((X+VW/2)); CY=$((Y+VH/2)); GY=$((Y+VH*7/8)); RX=$((X+VW/4)); PAUSEX=$((X+VW*11/12)); PAUSEY=$((Y+VH*8/100))
            adb shell input tap "$CX" "$CY"; sleep 4; adb shell input tap "$CX" "$CY"; sleep 4; adb shell input swipe $((X+VW*40/100)) "$CY" $((X+VW*68/100)) "$CY" 350; sleep 2; adb shell input tap "$CX" "$CY"; sleep 9; adb exec-out screencap -p >"$O/$L-02-gameplay.png"
            OC=$(overlaycheck "$O/$L-02-gameplay.png"); OCR=$?; [ $OCR -ne 0 ] && FAIL=1
            adb shell input swipe "$RX" "$GY" "$RX" "$GY" 700; sleep 1; adb exec-out screencap -p >"$O/$L-03-right.png"; DR=$(rgbdiff "$O/$L-02-gameplay.png" "$O/$L-03-right.png")
            adb shell input tap "$PAUSEX" "$PAUSEY"; sleep 1; adb exec-out screencap -p >"$O/$L-04-paused.png"; DP=$(rgbdiff "$O/$L-03-right.png" "$O/$L-04-paused.png"); DARK=$(darkness "$O/$L-03-right.png" "$O/$L-04-paused.png" "$X" "$Y" "$VW" "$VH")
            python3 - "$DR" "$DP" "$DARK" <<'PY'
          import sys
          r,p,d=map(float,sys.argv[1:]); raise SystemExit(0 if r>=.001 and p>=.10 and d<=.90 else 1)
          PY
            [ $? -ne 0 ] && FAIL=1
            PID=$(adb shell ps|tr -d '\r'|awk -v p="$P" '$NF==p{print $2;exit}'); F=$(adb shell dumpsys window|grep -m1 mCurrentFocus||true); FOC=0; echo "$F"|grep -q "$P"&&FOC=1; [ -z "$PID" ]&&FAIL=1; [ "$FOC" -ne 1 ]&&FAIL=1
            adb logcat -d >"$O/$L-logcat.txt" 2>&1; FAT=0; if grep -E "FATAL EXCEPTION|Process: $P|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$O/$L-logcat.txt" >"$O/$L-fatal.txt"; then FAT=1; FAIL=1; else : >"$O/$L-fatal.txt"; fi
            echo "$L,$REQ,$ACT,$X:$Y:$VW:$VH,$OC,$DR,$DP,$DARK,$PID,$FOC,$FAT" >>"$O/results.csv"
          done
          # Dedicated live fold -> expanded transition while gameplay remains active.
          adb shell wm size 1600x1760 >/dev/null 2>&1; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell am force-stop "$P" >/dev/null 2>&1 || true; adb shell pm clear "$P" >/dev/null 2>&1 || true; adb shell am start -W -n "$P/.AIRAppEntry" >/dev/null; sleep 8
          adb exec-out screencap -p >"$O/live-00-intro.png"; read W H < <(python3 - "$O/live-00-intro.png" <<'PY'
          import sys
          from PIL import Image
          i=Image.open(sys.argv[1]); print(i.width,i.height)
          PY
          ); read X Y VW VH < <(view "$W" "$H"); CX=$((X+VW/2)); CY=$((Y+VH/2)); adb shell input tap "$CX" "$CY"; sleep 4; adb shell input tap "$CX" "$CY"; sleep 4; adb shell input swipe $((X+VW*40/100)) "$CY" $((X+VW*68/100)) "$CY" 350; sleep 2; adb shell input tap "$CX" "$CY"; sleep 9; adb exec-out screencap -p >"$O/live-01-fold-gameplay.png"
          FOLD_OC=$(overlaycheck "$O/live-01-fold-gameplay.png"); [ $? -ne 0 ]&&FAIL=1
          adb shell wm size 1440x3120 >/dev/null 2>&1; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true; sleep 5; adb exec-out screencap -p >"$O/live-02-expanded.png"
          EXP_OC=$(overlaycheck "$O/live-02-expanded.png"); LIVEOK=$?; [ $LIVEOK -ne 0 ]&&FAIL=1
          read EW EH < <(python3 - "$O/live-02-expanded.png" <<'PY'
          import sys
          from PIL import Image
          i=Image.open(sys.argv[1]); print(i.width,i.height)
          PY
          ); [ "${EW}x${EH}" != "3120x1440" ]&&FAIL=1; read EX EY EVW EVH < <(view "$EW" "$EH"); PRX=$((EX+EVW/4)); PGY=$((EY+EVH*7/8)); PPX=$((EX+EVW*11/12)); PPY=$((EY+EVH*8/100)); adb shell input swipe "$PRX" "$PGY" "$PRX" "$PGY" 700; sleep 1; adb exec-out screencap -p >"$O/live-03-right.png"; LDR=$(rgbdiff "$O/live-02-expanded.png" "$O/live-03-right.png"); adb shell input tap "$PPX" "$PPY"; sleep 1; adb exec-out screencap -p >"$O/live-04-paused.png"; LDP=$(rgbdiff "$O/live-03-right.png" "$O/live-04-paused.png"); LDK=$(darkness "$O/live-03-right.png" "$O/live-04-paused.png" "$EX" "$EY" "$EVW" "$EVH")
          python3 - "$LDR" "$LDP" "$LDK" <<'PY'
          import sys
          r,p,d=map(float,sys.argv[1:]); raise SystemExit(0 if r>=.001 and p>=.10 and d<=.90 else 1)
          PY
          [ $? -ne 0 ]&&FAIL=1
          printf 'cold_fail=%s\nfold_overlay=%s\nexpanded_overlay=%s\nlive_right=%s\nlive_pause=%s\nlive_dark=%s\n' "$FAIL" "$FOLD_OC" "$EXP_OC" "$LDR" "$LDP" "$LDK" >"$O/summary.txt"
          adb shell wm size reset >/dev/null 2>&1 || true
          [ "$FAIL" -ne 0 ]&&exit 20
          echo PASS >>"$O/summary.txt"
          EOS
          chmod +x cold-display.sh
      - name: Run cold-launch display certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash cold-display.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2a-cold-display-evidence
          path: cold-display
          if-no-files-found: error

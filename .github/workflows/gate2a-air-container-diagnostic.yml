name: Gate 2A AIR Container Diagnostic

on:
  push:
    branches:
      - gate2a-air-container-diagnostic-r20

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Inspect AIR containers and binaries for OUYA resource provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $roots = @((Resolve-Path $env:AIR_HOME).Path)
          if (Test-Path 'C:\AIR_SDK') { $roots += (Resolve-Path 'C:\AIR_SDK').Path }
          $roots = @($roots | Sort-Object -Unique)

          $candidateArchives = @()
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.jar','.zip','.aar' } |
              ForEach-Object { $candidateArchives += $_.FullName }
          }
          $candidateArchives = @($candidateArchives | Sort-Object -Unique)
          "archive_count=$($candidateArchives.Count)" | Set-Content dist/container-summary.txt -Encoding utf8

          $matches = New-Object System.Collections.Generic.List[string]
          foreach ($archive in $candidateArchives) {
            try {
              $list = & jar tf $archive 2>$null
              $hits = @($list | Where-Object { $_ -match '(?i)ouya|app_entry/res/.+(icon|banner)' })
              foreach ($hit in $hits) { $matches.Add("ENTRY`t$archive`t$hit") }
            } catch {
              $matches.Add("JAR_TF_ERROR`t$archive`t$($_.Exception.Message)")
            }
          }

          # Search likely AIR Java/tool binaries for literal references even when not archive entries.
          $literalTargets = @()
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Include '*.jar','*.class','*.xml','*.properties','*.gradle','*.json','*.txt','*.bat' -ErrorAction SilentlyContinue |
              ForEach-Object { $literalTargets += $_.FullName }
          }
          $literalTargets = @($literalTargets | Sort-Object -Unique)
          foreach ($file in $literalTargets) {
            try {
              $bytes = [IO.File]::ReadAllBytes($file)
              $ascii = [Text.Encoding]::ASCII.GetString($bytes)
              if ($ascii -match '(?i)ouya_icon|ouya_icon\.png|drawable-xhdpi[/\\]ouya_icon') {
                $matches.Add("LITERAL`t$file`tOUYA_LITERAL_PRESENT")
              }
            } catch {}
          }

          $matches | Sort-Object -Unique | Set-Content dist/ouya-container-matches.txt -Encoding utf8
          Get-FileHash -Algorithm SHA256 (Join-Path $env:AIR_HOME 'lib/adt.jar'),(Join-Path $env:AIR_HOME 'lib/android/lib/resources/android-res.jar') |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path)" } | Set-Content dist/core-container-hashes.txt -Encoding utf8
          Write-Host "OUYA container/literal matches: $($matches.Count)"
          Get-Content dist/ouya-container-matches.txt | ForEach-Object { Write-Host $_ }

      - name: Upload container diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-air-container-diagnostic
          path: dist/
          if-no-files-found: error

name: Gate2A Rev52 Local Archive AAB Builder Qualification
on:
  push:
    branches:
      - qa/gate2a-rev52-archive-signing-repair
    paths:
      - tools/build-aab-entry.ps1
      - BUILD_WINDOWS_README.txt
      - .github/workflows/gate2a-rev52-archive-builder-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-extracted-archive-builder:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SLF_NO_PAUSE: '1'
      SLF_NO_PROMPTS: '1'
      SLF_ACCEPT_HARMAN_AIR_LICENSE: '1'
      SLF_ACCEPT_ANDROID_SDK_LICENSE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Guard exact original Rev52 app and only release-tooling change
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='0d5fd0bb63558ad6659ba31552deaede4745382b'
          git cat-file -e "$base^{commit}"
          if($LASTEXITCODE -ne 0){throw 'Missing exact original Rev52 source'}
          $changed=@(git diff --name-only "$base..HEAD")
          $allowed=@(
            'tools/build-aab-entry.ps1',
            'BUILD_WINDOWS_README.txt',
            '.github/workflows/gate2a-rev52-archive-builder-qualification.yml'
          )
          $extra=@($changed | Where-Object { $_ -notin $allowed })
          if($extra.Count -gt 0){throw "Original Rev52 source changed: $($extra -join ', ')"}
          if($changed -notcontains 'tools/build-aab-entry.ps1'){throw 'Missing local builder provenance repair'}
          $entry=Get-Content -Raw 'tools/build-aab-entry.ps1'
          if($entry -notmatch "FrozenCommit = '0d5fd0bb63558ad6659ba31552deaede4745382b'"){throw 'Rev52 source commit pin not repaired'}
          if($entry -notmatch "FrozenTree = 'ba0cfae73f758b3d4c9157e1e496357faf59acda'"){throw 'Rev52 tree pin not repaired'}
          if($entry -notmatch "'BUILD_WINDOWS_README.txt'" -or $entry -notmatch "'\.github/workflows/gate2a-rev52-archive-builder-qualification.yml'"){throw 'Archive tooling delta exception missing'}
          "base_product_commit=$base" | Set-Content 'qa-release-source-guard.txt'
          "tooling_branch_head=$(git rev-parse HEAD)" | Add-Content 'qa-release-source-guard.txt'
          "source_changes=$($changed -join ',')" | Add-Content 'qa-release-source-guard.txt'
      - name: Prove production signing fails closed with no owner secrets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:SLF_ANDROID_KEYSTORE -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_EXPECTED_CERT_SHA256 -ErrorAction SilentlyContinue
          $old=$ErrorActionPreference
          $oldNative=$PSNativeCommandUseErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $PSNativeCommandUseErrorActionPreference=$false
            $output=& cmd.exe /d /c 'BUILD_AAB_PRODUCTION.bat' 2>&1
            $rc=$LASTEXITCODE
          } finally {
            $ErrorActionPreference=$old
            $PSNativeCommandUseErrorActionPreference=$oldNative
          }
          $global:LASTEXITCODE=0
          if($rc -eq 0){throw 'Production signed without owner certificate (unsafe)'}
          if(($output | Out-String) -notmatch 'SLF_ANDROID_KEYSTORE is not set'){throw 'Signing failed for unexpected reason'}
          if(Test-Path 'dist/local-aab/SLF-production.aab'){throw 'False production AAB created without credentials'}
          Remove-Item -Recurse -Force 'dist/local-aab' -ErrorAction SilentlyContinue
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Ensure Android SDK 36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)){ $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME }
          $sdk=Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if($null -eq $sdk){$sdkPath=Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat'}else{$sdkPath=$sdk.Source}
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if($LASTEXITCODE -ne 0){throw 'Android SDK 36 unavailable'}
          Remove-Item -LiteralPath AIRSDK_Windows.zip -Force -ErrorAction SilentlyContinue
      - name: Build and verify exact-source extracted archive AAB with validation certificate only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'slf-rev52-source.zip'
          $root=Join-Path $env:RUNNER_TEMP 'slf-rev52-source'
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          git archive --format=zip HEAD -o $zip
          if($LASTEXITCODE -ne 0){throw 'Cannot generate frozen source archive'}
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          if(Test-Path (Join-Path $root '.git')){throw 'False archive isolation: git folder present'}
          Push-Location $root
          try {
            $oldNative=$PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference=$false
              & cmd.exe /d /c BUILD_AAB_VALIDATION.bat
              $rc=$LASTEXITCODE
            } finally { $PSNativeCommandUseErrorActionPreference=$oldNative }
            if($rc -ne 0) {
              $errorFile='dist/local-aab/LAST_BUILD_ERROR.txt'
              if(Test-Path $errorFile){Get-Content -Raw $errorFile | Write-Host}
              throw "Extracted-archive AAB validation failed: $rc"
            }
            $aab='dist/local-aab/SLF-validation.aab'
            $receipt='dist/local-aab/validation-proof/archive-source-verification.txt'
            $metadata='dist/local-aab/validation-proof/release-metadata.txt'
            if(-not(Test-Path $aab) -or -not(Test-Path $receipt) -or -not(Test-Path $metadata)){throw 'Missing independent build/identity receipts'}
            $prov=Get-Content -Raw $receipt
            $m=Get-Content -Raw $metadata
            if($prov -notmatch 'provenance_mode=archive-frozen-tree'){throw 'Not tested using extracted archive source'}
            if($prov -notmatch 'frozen_product_commit=0d5fd0bb63558ad6659ba31552deaede4745382b'){throw 'Wrong product commit'}
            if($prov -notmatch 'frozen_product_tree=ba0cfae73f758b3d4c9157e1e496357faf59acda'){throw 'Wrong Rev52 tree'}
            if($m -notmatch 'signing_mode=disposable-validation'){throw 'Unexpected signing mode'}
            if($m -notmatch 'manifest_package_verified=com.ramybaheeg.slfport'){throw 'Wrong package'}
            if($m -notmatch 'manifest_effective_permissions_verified=none'){throw 'Unexpected permission'}
            $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $aab).Hash.ToLowerInvariant()
            "validation_aab_sha256=$sha" | Add-Content 'qa-release-archive-proof.txt'
            "source_verified=true" | Add-Content 'qa-release-archive-proof.txt'
            "production_signing_performed=false" | Add-Content 'qa-release-archive-proof.txt'
            Copy-Item 'qa-release-archive-proof.txt' -Destination (Join-Path $env:GITHUB_WORKSPACE 'qa-release-archive-proof.txt')
            New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE 'archive-proof') -Force | Out-Null
            Copy-Item 'dist/local-aab/validation-proof/*' -Destination (Join-Path $env:GITHUB_WORKSPACE 'archive-proof') -Recurse -Force
            Get-Content $receipt
            Get-Content $metadata
          } finally { Pop-Location }
      - name: Upload independent source and validation-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-local-builder-provenance-verification
          path: |
            qa-release-source-guard.txt
            qa-release-archive-proof.txt
            archive-proof/
          if-no-files-found: warn

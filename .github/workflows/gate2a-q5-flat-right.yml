name: Gate 2A Q5 Frozen Lifecycle

on:
  push:
    branches:
      - qa/exact-frozen-q5-runtime-20260913

permissions:
  contents: read
  actions: read

jobs:
  frozen-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact frozen emulator APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-apk evidence
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/masterramy/SuperLemonadeFactoryOUYA/actions/artifacts/10313463979/zip" \
            -o runtime-apk/artifact.zip
          unzip -q runtime-apk/artifact.zip -d runtime-apk/unpacked
          APK="$(find runtime-apk/unpacked -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          EXPECTED="d37655e51498b83c1db2dac015df8326be4d13d928dbb0cd970ea1f5354e118b"
          printf 'artifact_id=10313463979\napk=%s\nactual_sha256=%s\nexpected_sha256=%s\nfrozen_source=703bf86dea43f527677b38c1886252d040bebfd2\n' "$APK" "$ACTUAL" "$EXPECTED" > evidence/apk-identity.txt
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" runtime-apk/SLF-emulator-x64.apk

      - name: Write ordinary-input lifecycle probe
        shell: bash
        run: |
          cat > q5-lifecycle.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          APK="$PWD/runtime-apk/SLF-emulator-x64.apk"
          PACKAGE="com.ramybaheeg.slfport"

          dismiss_system_overlay_text() {
            local wanted="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml evidence/window.xml >/dev/null 2>&1 || true
            if [ ! -s evidence/window.xml ]; then return 0; fi
            local coords
            coords="$(python3 - "$wanted" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          wanted=sys.argv[1].lower()
          try: root=ET.parse('evidence/window.xml').getroot()
          except Exception: raise SystemExit(0)
          for n in root.iter('node'):
              text=(n.attrib.get('text','')+' '+n.attrib.get('content-desc','')).lower()
              if wanted in text:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups()); print(f'{(x1+x2)//2} {(y1+y2)//2}'); break
          PY
            )"
            if [ -n "$coords" ]; then
              adb shell input tap $coords >/dev/null 2>&1 || true
              echo "dismissed_system_overlay=$wanted at $coords" >> evidence/system-overlay-dismissal.txt
              sleep 2
            fi
          }

          adb install -r "$APK" | tee evidence/install.txt
          adb shell pm clear "$PACKAGE" | tee evidence/pm-clear.txt
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm user-rotation lock 1 || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > evidence/launch.txt 2>&1
          sleep 12
          dismiss_system_overlay_text "got it"
          dismiss_system_overlay_text "ok"

          # Ordinary shipping inputs to fresh-save Level 2.
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 8
          adb shell input keyevent KEYCODE_X; sleep 4
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12
          adb shell input keyevent KEYCODE_X; sleep 8

          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-gameplay.txt
          adb shell dumpsys window > evidence/window-gameplay.txt 2>&1
          adb exec-out screencap -p > evidence/01-gameplay-before-pause.png

          # Actual rendered touchscreen PAUSE control on 3120x1440 landscape canvas.
          adb shell input tap 2630 120
          sleep 2
          adb exec-out screencap -p > evidence/02-paused-a.png
          sleep 4
          adb exec-out screencap -p > evidence/03-paused-b.png
          sha256sum evidence/02-paused-a.png evidence/03-paused-b.png > evidence/pause-frame-sha256.txt

          # Same rendered control now resumes.
          adb shell input tap 2630 120
          sleep 2
          adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
          sleep 2
          adb exec-out screencap -p > evidence/04-resumed-after-right.png
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-after-resume.txt

          # HOME is ordinary Android lifecycle behavior. Preserve process, then relaunch app
          # through launcher intent and prove post-return input.
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb exec-out screencap -p > evidence/05-home-background.png
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-background.txt
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > evidence/return-launch.txt 2>&1
          sleep 4
          adb exec-out screencap -p > evidence/06-returned-gameplay.png
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-returned.txt
          adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
          sleep 2
          adb exec-out screencap -p > evidence/07-post-return-right.png
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-post-return.txt

          adb logcat -d > evidence/logcat.txt 2>&1 || true
          grep -Ei 'FATAL EXCEPTION|Process: com\.ramybaheeg\.slfport' evidence/logcat.txt > evidence/fatal-scan.txt || true
          sha256sum evidence/*.png > evidence/frame-sha256.txt
          printf 'input_class=ordinary_shipping_keyboard_and_touch_plus_android_home\nforced_completion=false\nteleport=false\nsave_mutation=false\n' > evidence/probe-contract.txt
          test -s evidence/pid-gameplay.txt
          test ! -s evidence/fatal-scan.txt
          cmp -s evidence/pid-gameplay.txt evidence/pid-after-resume.txt
          cmp -s evidence/pid-gameplay.txt evidence/pid-background.txt
          cmp -s evidence/pid-gameplay.txt evidence/pid-returned.txt
          cmp -s evidence/pid-gameplay.txt evidence/pid-post-return.txt
          EOF
          chmod +x q5-lifecycle.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and execute exact-frozen lifecycle probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash q5-lifecycle.sh

      - name: Upload rendered lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-frozen-lifecycle
          path: evidence
          if-no-files-found: error
          retention-days: 14

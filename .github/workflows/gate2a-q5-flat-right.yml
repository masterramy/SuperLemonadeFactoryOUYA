name: Gate 2A Q5 Frozen Flat-Ground RIGHT

on:
  push:
    branches:
      - qa/exact-frozen-q5-runtime-20260913

permissions:
  contents: read
  actions: read

jobs:
  frozen-flat-right:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact frozen emulator APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-apk evidence
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/masterramy/SuperLemonadeFactoryOUYA/actions/artifacts/10313463979/zip" \
            -o runtime-apk/artifact.zip
          unzip -q runtime-apk/artifact.zip -d runtime-apk/unpacked
          APK="$(find runtime-apk/unpacked -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          EXPECTED="d37655e51498b83c1db2dac015df8326be4d13d928dbb0cd970ea1f5354e118b"
          printf 'artifact_id=10313463979\napk=%s\nactual_sha256=%s\nexpected_sha256=%s\nfrozen_source=703bf86dea43f527677b38c1886252d040bebfd2\n' "$APK" "$ACTUAL" "$EXPECTED" > evidence/apk-identity.txt
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" runtime-apk/SLF-emulator-x64.apk

      - name: Write ordinary-input flat-ground RIGHT probe
        shell: bash
        run: |
          cat > q5-flat-right.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          APK="$PWD/runtime-apk/SLF-emulator-x64.apk"
          PACKAGE="com.ramybaheeg.slfport"
          adb install -r "$APK" | tee evidence/install.txt
          adb shell pm clear "$PACKAGE" | tee evidence/pm-clear.txt
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm user-rotation lock 1 || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > evidence/launch.txt 2>&1
          sleep 14

          # Ordinary shipping keyboard inputs only: dismiss intro, activate Factory Floor,
          # select Level 2 from the fresh-save Level Select, then capture the spawn state.
          adb shell input keyevent KEYCODE_X
          sleep 2
          adb shell input keyevent KEYCODE_X
          sleep 8
          adb shell input keyevent KEYCODE_X
          sleep 4
          adb shell input keyevent KEYCODE_DPAD_RIGHT
          sleep 1
          adb shell input keyevent KEYCODE_X
          sleep 12
          # Same bounded shipping-action fallback used by the certified baseline; harmless in gameplay.
          adb shell input keyevent KEYCODE_X
          sleep 8

          adb shell dumpsys window > evidence/window-before-right.txt 2>&1
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-before-right.txt
          adb exec-out screencap -p > evidence/01-level2-before-right.png

          # Exercise RIGHT alone from the initial Level-2 ground state: no jump, teleport,
          # completion key, save edit, or game-state mutation.
          adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT
          sleep 2
          adb shell dumpsys window > evidence/window-after-right.txt 2>&1
          adb shell pidof "$PACKAGE" | tr -d '\r' > evidence/pid-after-right.txt
          adb exec-out screencap -p > evidence/02-level2-after-right.png

          adb logcat -d > evidence/logcat.txt 2>&1 || true
          grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.ramybaheeg\.slfport' evidence/logcat.txt > evidence/fatal-scan.txt || true
          sha256sum evidence/*.png > evidence/frame-sha256.txt
          printf 'input_class=ordinary_shipping_keyboard\nprobe=flat_ground_right_only\nforced_completion=false\nteleport=false\nsave_mutation=false\n' > evidence/probe-contract.txt
          test -s evidence/pid-before-right.txt
          test -s evidence/pid-after-right.txt
          cmp -s evidence/pid-before-right.txt evidence/pid-after-right.txt
          test ! -s evidence/fatal-scan.txt
          EOF
          chmod +x q5-flat-right.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and execute exact-frozen RIGHT probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash q5-flat-right.sh

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-frozen-flat-right
          path: evidence
          if-no-files-found: error
          retention-days: 14

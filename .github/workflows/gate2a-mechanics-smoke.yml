name: Gate2A Mechanics Representative Smoke
on:
  push:
    branches:
      - qa/gate2a-mechanics-coverage
    paths:
      - qa/mechanics_smoke.py
      - .github/workflows/gate2a-mechanics-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  warehouse-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Test Python syntax and import-contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/mechanics_smoke.py
          python3 -m pip install --quiet Pillow==11.3.0
          PYTHONPATH=qa python3 -m unittest -v qa.test_progress_guard qa.test_screen_navigation
      - name: Download exact read-only QA observation APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev52-patrol-observation-runtime
          path: runtime
          github-token: ${{ github.token }}
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 38462999144
      - name: Verify APK and read-only source delta
        shell: bash
        run: |
          set -euo pipefail
          expected=b20c289529dd2d4a6b3c53cbffb977776609c8afd44786db9c0fafe48aeae893
          test "$(sha256sum runtime/dist/emulator-qa/SLF-emulator-x64.apk | cut -d' ' -f1)" = "$expected"
          tr -d '\r' < runtime/qa-delta.txt | grep -Fxq src/PCPlayState.as
          test "$(tr -d '\r' < runtime/qa-delta.txt | sed '/^$/d' | wc -l)" -eq 1
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Representative ordinary-input mechanics smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python3 qa/mechanics_smoke.py
      - name: Upload mechanics observations, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-core-mechanics-observed
          path: mechanics-evidence
          if-no-files-found: warn

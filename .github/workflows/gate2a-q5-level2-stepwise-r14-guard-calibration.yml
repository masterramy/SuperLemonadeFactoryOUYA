name: Gate 2A Q5 AFC2 Level 2 Stepwise R14 Guard Calibration

on:
  push:
    branches: [qa/q5-afc2-level2-r14-guard-calibration]
    paths: [.github/workflows/gate2a-q5-level2-stepwise-r14-guard-calibration.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  level2-stepwise-r14-guard-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 32

      - name: Verify QA-only branch and runtime equivalence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          FROZEN=afc2e65a65dc95e35ef3391b92be8adc7827e16f
          CUSTOMER=9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c
          test "$(git rev-parse HEAD^)" = "$FROZEN"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gate2a-q5-level2-stepwise-r14-guard-calibration.yml"
          git diff --name-only "$CUSTOMER..$FROZEN" | sort > proof/freeze-vs-customer.txt
          printf '%s\n' '.github/workflows/gate2a-windows-aab-builders-validation.yml' 'BUILD_AAB_PRODUCTION.bat' 'BUILD_AAB_VALIDATION.bat' 'tools/build-aab.ps1' | sort > proof/allowed.txt
          diff -u proof/allowed.txt proof/freeze-vs-customer.txt
          printf '%s\n' \
            'ordinary_shipping_inputs_only=true' \
            'save_or_game_state_edit=false' \
            'teleport=false' \
            'forced_completion=false' \
            'strongest_prior_cursor=R12_run_34808850816_frame11_crate_tutorial' \
            'R13=rejected_prefix_divergence_terminal_before_switch' \
            'R14_initial=guard_false_negative_pre_switch_frame_was_healthy_but_tutorial_color_was_not_required' \
            'critical_guard=pid_focus_fatal_plus_brightness_at_each_checkpoint' \
            'new_action_authorization=healthy_render_plus_liselot_upper_platform_visual_position_equivalent_to_R12' \
            'new_action=exactly_one_bounded_raw_held_liselot_double_right_reposition_attempt' \
            'post_new_action_gameplay_input=false' \
            > proof/method.txt

      - name: Download runtime-equivalent emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34777986347

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk
          test "$(wc -c < "$APK" | tr -d ' ')" = 35875619
          test "$(sha256sum "$APK" | awk '{print $1}')" = 53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2
          sha256sum "$APK" > proof/runtime-apk-sha256.txt

      - name: Install image guard dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0

      - name: Write corrected checkpoint-guarded R14 probe
        shell: bash
        run: |
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=runtime-apk/SLF-emulator-x64.apk
          PACKAGE=com.ramybaheeg.slfport
          OUT=proof
          DEV=/dev/input/event1

          capture(){
            tag="$1"
            adb shell dumpsys window > "$OUT/window-$tag.txt" 2>&1
            adb exec-out screencap -p > "$OUT/$tag.png"
            adb logcat -d > "$OUT/logcat-$tag.txt" 2>&1
            pid=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-$tag.txt" || true)
            printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-$tag.txt"
            test -n "$pid"
            echo "$focus" | grep -q "$PACKAGE"
            ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-$tag.txt" > "$OUT/fatal-$tag.txt"
          }

          guard_render(){
            tag="$1"; mode="${2:-healthy}"
            python3 - "$OUT/$tag.png" "$OUT/guard-$tag.txt" "$mode" <<'PY'
          from PIL import Image
          import sys
          p,out,mode=sys.argv[1:4]
          im=Image.open(p).convert('RGB'); w,h=im.size
          px=list(im.getdata()); lum=[(r+g+b)/3 for r,g,b in px]
          mean=sum(lum)/len(lum); dark=sum(v<100 for v in lum)/len(lum)
          gp=[]
          for y in range(250,min(1050,h)):
            for x in range(1200,min(2100,w)):
              r,g,b=im.getpixel((x,y))
              if g>100 and g>r*1.25 and g>b*1.15: gp.append((x,y))
          cx=(sum(x for x,y in gp)/len(gp)) if gp else 9999.0
          cy=(sum(y for x,y in gp)/len(gp)) if gp else 9999.0
          with open(out,'w') as f:
            f.write(f'mode={mode}\nmean_luma={mean:.3f}\ndark_fraction={dark:.6f}\ngreen_pixels={len(gp)}\ngreen_centroid_x={cx:.3f}\ngreen_centroid_y={cy:.3f}\n')
          # Retained R13 terminal/downed pre-switch was mean~103/dark~0.608;
          # retained healthy R12 checkpoints are mean~164-170/dark~0.02-0.04.
          if not (mean>140 and dark<0.30): raise SystemExit(20)
          if mode=='crate':
            # Retained R12 frame11 Liselot upper-platform centroid ~= (1683,524),
            # 1216 green pixels; retained lower-floor R7 centroid y ~= 892.
            if not (len(gp)>700 and 1500<cx<1900 and 400<cy<650): raise SystemExit(22)
          PY
          }
          checkpoint(){ capture "$1"; guard_render "$1" "${2:-healthy}"; }

          dismiss_text(){
            wanted="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0
            adb pull /sdcard/window.xml "$OUT/window-ui.xml" >/dev/null 2>&1 || return 0
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try: r=ET.parse('proof/window-ui.xml').getroot()
          except: raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:
                a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2); break
          PY
            ); [ -z "$coords" ] || { adb shell input tap $coords >/dev/null 2>&1 || true; sleep 1; }
          }
          jump_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; wait "$p" || true; sleep .20; }
          liselot_double_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; sleep .16; adb shell input keyevent KEYCODE_C >/dev/null 2>&1 || true; wait "$p" || true; sleep .20; }
          walk_left(){ adb shell input keyevent --longpress KEYCODE_DPAD_LEFT >/dev/null 2>&1 || true; sleep .25; }
          raw_down(){ adb shell "sendevent $DEV 1 $1 1; sendevent $DEV 0 0 0"; }
          raw_up(){ adb shell "sendevent $DEV 1 $1 0; sendevent $DEV 0 0 0"; }
          raw_held_liselot_double_right(){ raw_down 106; sleep .04; raw_down 46; sleep .30; raw_up 46; sleep .06; raw_down 46; sleep .08; raw_up 46; sleep .22; raw_up 106; }

          adb root > "$OUT/adb-root.txt" 2>&1; sleep 2; adb wait-for-device
          adb shell id > "$OUT/root-identity.txt"; adb shell "test -w $DEV"
          adb shell "getevent -lp $DEV" > "$OUT/keyboard-device.txt" 2>&1
          grep -q KEY_C "$OUT/keyboard-device.txt"; grep -q KEY_RIGHT "$OUT/keyboard-device.txt"
          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true; adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 4
          for _ in 1 2 3 4; do dismiss_text 'Got it'; dismiss_text 'Wait'; sleep 1; done; sleep 8

          adb shell input keyevent KEYCODE_X; sleep 2; adb shell input keyevent KEYCODE_X; sleep 8
          adb shell input keyevent KEYCODE_X; sleep 4; adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12; adb shell input keyevent KEYCODE_X; sleep 12
          checkpoint 01-start healthy
          for i in $(seq 1 7); do jump_right; done
          adb shell input keyevent KEYCODE_V; sleep 2
          for i in $(seq 1 11); do liselot_double_right; done
          for i in $(seq 1 6); do walk_left; done
          adb shell input keyevent KEYCODE_V; sleep 2
          checkpoint 06-pre-switch healthy
          adb shell input keyevent KEYCODE_V; sleep 2; checkpoint 07-post-switch healthy
          liselot_double_right; sleep 1.25; checkpoint 08-r6-equivalent healthy
          liselot_double_right; sleep 1.25; checkpoint 09-r7-equivalent healthy
          raw_held_liselot_double_right; capture 10-immediate-r12-replay; sleep 1.25
          checkpoint 11-r12-equivalent-crate crate

          # Exactly one new bounded ordinary-input action, only after R12-equivalent
          # upper-platform state is rendered and guarded. No gameplay input follows.
          raw_held_liselot_double_right
          capture 12-immediate-after-reposition; sleep 1.25; capture 13-settled-after-reposition
          guard_render 13-settled-after-reposition healthy
          printf 'Corrected checkpoint guards passed through rendered R12-equivalent upper-platform state; exactly one bounded ordinary-input reposition attempt executed; zero further gameplay input sent.\n' > "$OUT/result.txt"
          EOF
          chmod +x probe.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and run corrected bounded R14 observation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-afc2-level2-stepwise-r14-guard-calibration
          path: proof
          if-no-files-found: error

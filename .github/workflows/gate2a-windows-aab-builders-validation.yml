name: Gate 2A Windows AAB Builders Validation

on:
  push:
    branches: [gate2a-release-hardening-staging]
    paths:
      - BUILD_AAB_VALIDATION.bat
      - BUILD_AAB_PRODUCTION.bat
      - tools/build-aab.ps1
      - .github/workflows/gate2a-windows-aab-builders-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows-builders:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 32

      - name: Verify tooling-only lineage from exact-final
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = '9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c'
          git merge-base --is-ancestor $product HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact-final is not an ancestor.' }
          $allowed = @(
            'BUILD_AAB_VALIDATION.bat',
            'BUILD_AAB_PRODUCTION.bat',
            'tools/build-aab.ps1',
            '.github/workflows/gate2a-windows-aab-builders-validation.yml'
          )
          $changed = @(git diff --name-only "$product..HEAD")
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected non-tooling delta: $($unexpected -join ', ')" }

      - name: Prove production BAT fails closed without signing inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:SLF_ANDROID_KEYSTORE -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_EXPECTED_CERT_SHA256 -ErrorAction SilentlyContinue
          $output = & cmd.exe /d /c BUILD_AAB_PRODUCTION.bat 2>&1
          $rc = $LASTEXITCODE
          $text = ($output | Out-String)
          Write-Host $text
          if ($rc -eq 0) { throw 'Production BAT unexpectedly succeeded without required external inputs.' }
          if ($text -notmatch 'SLF_ANDROID_KEYSTORE is not set') { throw 'Production BAT did not fail at the expected missing-keystore guard.' }
          if (Test-Path 'dist/local-aab/SLF-production.aab') { throw 'Production AAB must not exist after fail-closed preflight.' }

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true

      - name: Ensure Android SDK 36 inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) { $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) { throw 'Android SDK environment is unavailable.' }
          $sdk = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if ($null -eq $sdk) {
            $candidate = Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat'
            if (-not (Test-Path $candidate)) { throw 'sdkmanager.bat is unavailable.' }
            $sdkPath = $candidate
          } else { $sdkPath = $sdk.Source }
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          if (-not (Test-Path (Join-Path $env:ANDROID_SDK_ROOT 'platforms/android-36/android.jar'))) { throw 'android-36 platform did not install.' }

      - name: Run one-click disposable validation BAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /d /c BUILD_AAB_VALIDATION.bat
          if ($LASTEXITCODE -ne 0) { throw "Validation BAT failed with exit $LASTEXITCODE" }
          $aab = 'dist/local-aab/SLF-validation.aab'
          $metadata = 'dist/local-aab/validation-proof/release-metadata.txt'
          if (-not (Test-Path $aab)) { throw 'Validation BAT produced no AAB.' }
          if (-not (Test-Path $metadata)) { throw 'Validation BAT produced no release metadata.' }
          $meta = Get-Content -Raw $metadata
          if ($meta -notmatch 'signing_mode=disposable-validation') { throw 'Validation signing mode receipt missing.' }
          if ($meta -notmatch 'manifest_package_verified=com.ramybaheeg.slfport') { throw 'Package verification receipt missing.' }
          if ($meta -notmatch 'manifest_effective_permissions_verified=none') { throw 'Permission verification receipt missing.' }
          if ($meta -match 'SLF_ANDROID_KEYSTORE_PASSWORD') { throw 'Secret variable name leaked into metadata.' }
          Get-FileHash -Algorithm SHA256 $aab | Format-List

      - name: Confirm provider template restored after BAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          if (-not (Test-Path $target)) { throw 'AIR provider template was not restored.' }
          $item = Get-Item $target
          $sha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($item.Length -ne 1525) { throw "Restored provider byte count mismatch: $($item.Length)" }
          if ($sha -ne '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253') { throw "Restored provider hash mismatch: $sha" }

      - name: Upload validation AAB and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-windows-aab-builder-validation
          path: dist/local-aab
          if-no-files-found: warn

name: Gate 2A Windows AAB Builders Validation

on:
  push:
    branches:
      - gate2a-release-hardening-staging
      - gate2a-rev42-local-builder-fix
    paths:
      - BUILD_AAB_VALIDATION.bat
      - BUILD_AAB_PRODUCTION.bat
      - tools/build-aab.ps1
      - tools/build-aab-entry.ps1
      - .github/workflows/gate2a-windows-aab-builders-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows-builders:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SLF_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 64

      - name: Verify release-tooling-only lineage from frozen Q8 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'afc2e65a65dc95e35ef3391b92be8adc7827e16f'
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Q8 candidate is not an ancestor.' }
          $allowed = @(
            'BUILD_AAB_VALIDATION.bat',
            'BUILD_AAB_PRODUCTION.bat',
            'tools/build-aab-entry.ps1',
            '.github/workflows/gate2a-windows-aab-builders-validation.yml'
          )
          $changed = @(git diff --name-only "$base..HEAD")
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected non-tooling delta: $($unexpected -join ', ')" }
          if ($changed.Count -ne $allowed.Count) { throw "Expected exactly $($allowed.Count) release-tooling files to differ from frozen Q8; got $($changed.Count): $($changed -join ', ')" }

      - name: Prove production BAT fails closed and persists its error
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:SLF_ANDROID_KEYSTORE -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:SLF_ANDROID_EXPECTED_CERT_SHA256 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force 'dist/local-aab' -ErrorAction SilentlyContinue
          $oldNative = $PSNativeCommandUseErrorActionPreference
          $oldPreference = $ErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $ErrorActionPreference = 'Continue'
            $output = & cmd.exe /d /c BUILD_AAB_PRODUCTION.bat 2>&1
            $rc = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNative
            $ErrorActionPreference = $oldPreference
          }
          $global:LASTEXITCODE = 0
          $text = ($output | Out-String)
          Write-Host $text
          if ($rc -eq 0) { throw 'Production BAT unexpectedly succeeded without required external inputs.' }
          if ($text -notmatch 'SLF_ANDROID_KEYSTORE is not set') { throw 'Production BAT did not fail at the expected missing-keystore guard.' }
          $errorLog = 'dist/local-aab/LAST_BUILD_ERROR.txt'
          if (-not (Test-Path $errorLog)) { throw 'Production BAT did not persist LAST_BUILD_ERROR.txt.' }
          if ((Get-Content -Raw $errorLog) -notmatch 'SLF_ANDROID_KEYSTORE is not set') { throw 'Persistent production error log did not preserve the actionable failure.' }
          if (Test-Path 'dist/local-aab/SLF-production.aab') { throw 'Production AAB must not exist after fail-closed preflight.' }
          Remove-Item -Recurse -Force 'dist/local-aab' -ErrorAction SilentlyContinue

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true

      - name: Ensure Android SDK 36 inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) { $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) { throw 'Android SDK environment is unavailable.' }
          $sdk = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if ($null -eq $sdk) {
            $candidate = Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat'
            if (-not (Test-Path $candidate)) { throw 'sdkmanager.bat is unavailable.' }
            $sdkPath = $candidate
          } else { $sdkPath = $sdk.Source }
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          if (-not (Test-Path (Join-Path $env:ANDROID_SDK_ROOT 'platforms/android-36/android.jar'))) { throw 'android-36 platform did not install.' }

      - name: Remove setup-action checkout residue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'AIRSDK_Windows.zip' -Force -ErrorAction SilentlyContinue
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "Unexpected dirty checkout before provenance build:`n$($dirty -join "`n")" }

      - name: Run checkout-mode one-click validation BAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /d /c BUILD_AAB_VALIDATION.bat
          if ($LASTEXITCODE -ne 0) { throw "Checkout-mode validation BAT failed with exit $LASTEXITCODE" }
          $aab = 'dist/local-aab/SLF-validation.aab'
          $metadata = 'dist/local-aab/validation-proof/release-metadata.txt'
          $provenance = 'dist/local-aab/validation-proof/archive-source-verification.txt'
          if (-not (Test-Path $aab)) { throw 'Checkout-mode BAT produced no AAB.' }
          if (-not (Test-Path $metadata)) { throw 'Checkout-mode BAT produced no release metadata.' }
          if (-not (Test-Path $provenance)) { throw 'Checkout-mode provenance receipt missing.' }
          $meta = Get-Content -Raw $metadata
          $prov = Get-Content -Raw $provenance
          if ($prov -notmatch 'provenance_mode=git-checkout') { throw 'Checkout-mode provenance classification missing.' }
          if ($meta -notmatch 'signing_mode=disposable-validation') { throw 'Validation signing mode receipt missing.' }
          if ($meta -notmatch 'manifest_package_verified=com.ramybaheeg.slfport') { throw 'Package verification receipt missing.' }
          if ($meta -notmatch 'manifest_effective_permissions_verified=none') { throw 'Permission verification receipt missing.' }
          if (Test-Path 'dist/local-aab/LAST_BUILD_ERROR.txt') { throw 'Stale LAST_BUILD_ERROR.txt remained after successful checkout-mode build.' }
          Get-FileHash -Algorithm SHA256 $aab | Format-List

      - name: Confirm provider template restored after checkout-mode BAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          if (-not (Test-Path $target)) { throw 'AIR provider template was not restored.' }
          $item = Get-Item $target
          $sha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($item.Length -ne 1525) { throw "Restored provider byte count mismatch: $($item.Length)" }
          if ($sha -ne '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253') { throw "Restored provider hash mismatch: $sha" }

      - name: Run extracted-archive mode with no .git directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveZip = Join-Path $env:RUNNER_TEMP 'slf-source-archive.zip'
          $archiveRoot = Join-Path $env:RUNNER_TEMP 'slf-source-archive'
          Remove-Item -LiteralPath $archiveZip -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archiveRoot -Recurse -Force -ErrorAction SilentlyContinue
          git archive --format=zip HEAD -o $archiveZip
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed.' }
          Expand-Archive -LiteralPath $archiveZip -DestinationPath $archiveRoot -Force
          if (Test-Path (Join-Path $archiveRoot '.git')) { throw 'Archive-mode fixture unexpectedly contains .git.' }
          Push-Location $archiveRoot
          try {
            & cmd.exe /d /c BUILD_AAB_VALIDATION.bat
            if ($LASTEXITCODE -ne 0) {
              $log = Join-Path $archiveRoot 'dist/local-aab/LAST_BUILD_ERROR.txt'
              if (Test-Path $log) { Get-Content -Raw $log | Write-Host }
              throw "Archive-mode validation BAT failed with exit $LASTEXITCODE"
            }
            $aab = Join-Path $archiveRoot 'dist/local-aab/SLF-validation.aab'
            $metadata = Join-Path $archiveRoot 'dist/local-aab/validation-proof/release-metadata.txt'
            $provenance = Join-Path $archiveRoot 'dist/local-aab/validation-proof/archive-source-verification.txt'
            if (-not (Test-Path $aab)) { throw 'Archive-mode BAT produced no AAB.' }
            if (-not (Test-Path $metadata)) { throw 'Archive-mode BAT produced no release metadata.' }
            if (-not (Test-Path $provenance)) { throw 'Archive-mode provenance receipt missing.' }
            $prov = Get-Content -Raw $provenance
            $meta = Get-Content -Raw $metadata
            if ($prov -notmatch 'provenance_mode=archive-frozen-tree') { throw 'Archive-mode frozen-tree provenance classification missing.' }
            if ($prov -notmatch 'frozen_product_commit=afc2e65a65dc95e35ef3391b92be8adc7827e16f') { throw 'Archive-mode frozen product commit receipt missing.' }
            if ($prov -notmatch 'frozen_product_tree=999b5c3392f8c75e501c32b009880bd88351f80f') { throw 'Archive-mode frozen product tree receipt missing.' }
            if ($meta -notmatch 'manifest_package_verified=com.ramybaheeg.slfport') { throw 'Archive-mode package verification receipt missing.' }
            if ($meta -notmatch 'manifest_effective_permissions_verified=none') { throw 'Archive-mode permission verification receipt missing.' }
            if (Test-Path (Join-Path $archiveRoot 'dist/local-aab/LAST_BUILD_ERROR.txt')) { throw 'Stale archive-mode LAST_BUILD_ERROR.txt remained after success.' }
            Get-FileHash -Algorithm SHA256 $aab | Format-List
          } finally {
            Pop-Location
          }
          $copyTarget = 'dist/archive-mode-local-aab'
          Remove-Item -LiteralPath $copyTarget -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath (Join-Path $archiveRoot 'dist/local-aab') -Destination $copyTarget -Recurse -Force

      - name: Confirm provider template restored after archive-mode BAT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          if (-not (Test-Path $target)) { throw 'AIR provider template was not restored after archive-mode build.' }
          $item = Get-Item $target
          $sha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($item.Length -ne 1525) { throw "Restored provider byte count mismatch after archive mode: $($item.Length)" }
          if ($sha -ne '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253') { throw "Restored provider hash mismatch after archive mode: $sha" }

      - name: Upload checkout and archive-mode validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-windows-aab-builder-validation-rev42
          path: |
            dist/local-aab
            dist/archive-mode-local-aab
          if-no-files-found: warn

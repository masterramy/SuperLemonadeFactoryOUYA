name: Gate 2A Rev52 Natural Campaign

on:
  push:
    branches:
      - qa/rev52-natural-campaign
    paths:
      - qa/natural_campaign.py
      - qa/test_natural_campaign.py
      - src/QANaturalTelemetry.as
      - src/PCPlayState.as
      - .github/workflows/gate2a-rev52-natural-campaign.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Run telemetry decoder tests
        working-directory: qa
        run: python -m unittest -v test_natural_campaign.py

  build-learning-apk:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SLF_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Ensure Android SDK 36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)){ $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME }
          $sdk=Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if($null -eq $sdk){ $sdkPath=Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat' } else { $sdkPath=$sdk.Source }
          & $sdkPath 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if($LASTEXITCODE -ne 0){ throw 'Android SDK setup failed.' }
          Remove-Item -LiteralPath 'AIRSDK_Windows.zip' -Force -ErrorAction SilentlyContinue
      - name: Build QA-learning x64 APK
        shell: pwsh
        run: |
          & pwsh -NoProfile -File tools/build-emulator-apk.ps1
          if($LASTEXITCODE -ne 0){ throw "x64 emulator build failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-natural-campaign-learning-apk
          path: dist/emulator-qa
          if-no-files-found: error

  runtime-telemetry:
    needs: [telemetry-unit, build-learning-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev52-natural-campaign-learning-apk
          path: learning
      - name: Install decoder dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow==11.3.0
      - name: Prepare runtime RED test
        shell: bash
        run: |
          cat > runtime-telemetry.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="learning/SLF-emulator-x64.apk"
          PACKAGE="com.ramybaheeg.slfport"
          OUT="natural-campaign-runtime"
          mkdir -p "$OUT"
          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell pm clear "$PACKAGE" > "$OUT/clear.txt" 2>&1
          adb shell wm size 1920x1080
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1
          sleep 8

          # Native mobile route: intro tap -> main menu -> Factory -> Level Select.
          adb shell input tap 960 810
          sleep 5
          adb shell input tap 960 500
          sleep 5

          # Fresh selection is Level 1. One real swipe right selects Level 2.
          adb shell input swipe 700 540 1250 540 250
          sleep 2
          adb shell input tap 960 540
          sleep 8
          adb exec-out screencap -p > "$OUT/level2.png"

          PYTHONPATH=qa python - <<'PY'
          from PIL import Image
          from natural_campaign import decode_telemetry_image
          state=decode_telemetry_image(Image.open("natural-campaign-runtime/level2.png"), origin=(0,0), scale=3)
          print(state)
          assert state["world"] == 1
          assert state["level"] == 2
          PY
          EOF
          chmod +x runtime-telemetry.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require telemetry from actual Level 2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash runtime-telemetry.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate2a-rev52-natural-campaign-runtime
          path: natural-campaign-runtime
          if-no-files-found: warn

name: Gate 2A rev41 approved icon repair helper

on:
  push:
    branches:
      - gate2a-rev41-icon-fix-helper

permissions:
  contents: write

jobs:
  install-approved-icon:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate2a-rev41-exact-final
          fetch-depth: 1
          persist-credentials: true
      - name: Verify, validate, and install approved 192px icon
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expectedHead='fb89f9780d43127156ec86a1d666292e11ffb7cd'
          $expectedOld='a9aa4cafb64e0ff859207abce2ae6c1d7d303d63ed3c0a1a2f122d70b7ad1efa'
          $expectedNew='3ee6ad6c0b6035f6e67ba7a2cc01f6d8e4f53f3829f6f8f386d9bee0a624b900'
          $expectedSize=48849
          $target='icons/android/icons/icon_192.png'

          $head=(& git rev-parse HEAD).Trim()
          if($head -ne $expectedHead){throw "Exact-final moved: expected $expectedHead, got $head"}
          $old=(Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if($old -ne $expectedOld){throw "Target icon fence failed: expected old $expectedOld, got $old"}

          git fetch --no-tags --depth=1 origin gate2a-rev41-icon-fix-helper
          if($LASTEXITCODE -ne 0){throw 'Failed to fetch helper payload branch'}
          $payload = (& git show 'FETCH_HEAD:.gate2a/icon_192_rev4_candidate.b64') -join ''
          if([string]::IsNullOrWhiteSpace($payload)){throw 'Helper payload is empty'}
          try{$bytes=[Convert]::FromBase64String($payload)}catch{throw "Helper payload is not valid base64: $($_.Exception.Message)"}
          $candidate=Join-Path $env:RUNNER_TEMP 'icon_192_approved.png'
          [IO.File]::WriteAllBytes($candidate,$bytes)
          if((Get-Item $candidate).Length -ne $expectedSize){throw "Candidate size mismatch: $((Get-Item $candidate).Length)"}
          $new=(Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()
          if($new -ne $expectedNew){throw "Candidate SHA mismatch: $new"}

          Add-Type -AssemblyName System.Drawing
          $img=[Drawing.Image]::FromFile($candidate)
          try{if($img.Width -ne 192 -or $img.Height -ne 192){throw "Candidate dimensions $($img.Width)x$($img.Height), expected 192x192"}}finally{$img.Dispose()}

          $aapt2=Get-ChildItem "$env:ANDROID_SDK_ROOT/build-tools" -Recurse -File -Filter aapt2.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $aapt2){throw 'aapt2.exe not found'}
          $res=Join-Path $env:RUNNER_TEMP 'icon-aapt2-res'
          $drawable=Join-Path $res 'drawable'
          New-Item -ItemType Directory -Force -Path $drawable | Out-Null
          Copy-Item $candidate (Join-Path $drawable 'icon.png')
          $compiled=Join-Path $env:RUNNER_TEMP 'icon-aapt2.zip'
          & $aapt2.FullName compile --dir $res -o $compiled
          if($LASTEXITCODE -ne 0){throw "Approved candidate failed direct AAPT2 with exit $LASTEXITCODE"}

          Copy-Item -Force $candidate $target
          $installed=(Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if($installed -ne $expectedNew){throw "Installed icon SHA mismatch: $installed"}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed'}
          $changed=@(git diff --name-only)
          if($changed.Count -ne 1 -or $changed[0] -ne $target){throw "Unexpected changed paths: $($changed -join ', ')"}

          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $target
          git commit -m 'Gate 2A rev41: install approved AAPT2-safe 192px icon'
          if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          git push origin HEAD:gate2a-rev41-exact-final
          if($LASTEXITCODE -ne 0){throw 'Push to exact-final failed'}

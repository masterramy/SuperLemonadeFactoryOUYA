name: Gate 2A OUYA Resource Diagnostic

on:
  push:
    branches:
      - gate2a-ouya-resource-diagnostic

permissions:
  contents: read

jobs:
  trace-ouya-resource:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Compile release SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Package validation AAB and trace OUYA resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) { throw 'Android SDK unavailable.' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $keyPath = Join-Path $PWD 'diag-signing.p12'
          $storePass = 'gate2a-diagnostic'
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A Diagnostic' 2048-RSA $keyPath $storePass
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic certificate creation failed.' }

          & adt -package -target aab -storetype pkcs12 -keystore $keyPath -storepass $storePass dist/SLF-diag.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { throw "ADT packaging failed: $LASTEXITCODE" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/SLF-diag.aab'))
          try {
            $matches = @($zip.Entries | Where-Object { $_.FullName -match '(?i)ouya_icon|ouya_.*\.(png|psd)$' })
            if ($matches.Count -eq 0) { throw 'No OUYA-named packaged resources were found; prior release failure is not reproduced.' }
            foreach ($entry in $matches) {
              $stream = $entry.Open()
              try {
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $hashBytes = $sha.ComputeHash($stream) } finally { $sha.Dispose() }
                $hash = ([BitConverter]::ToString($hashBytes)).Replace('-','').ToLowerInvariant()
                Write-Host "AAB_OUYA_MATCH path=$($entry.FullName) bytes=$($entry.Length) sha256=$hash"
              } finally { $stream.Dispose() }
            }
          } finally { $zip.Dispose() }

          $airRoot = (Resolve-Path $env:AIR_HOME).Path
          $airMatches = @(Get-ChildItem -Path $airRoot -Recurse -File | Where-Object { $_.Name -match '(?i)ouya' })
          foreach ($file in $airMatches) {
            $rel = [IO.Path]::GetRelativePath($airRoot, $file.FullName).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            Write-Host "AIR_OUYA_SOURCE path=$rel bytes=$($file.Length) sha256=$hash"
          }

          Remove-Item -Force -ErrorAction SilentlyContinue $keyPath

name: Gate 2A Q5 AFC2 Level 2 Input Diagnostic R9

on:
  push:
    branches: [qa/q5-afc2-level2-r9]
    paths: [.github/workflows/gate2a-q5-level2-input-diagnostic-r9.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-diagnostic-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 8

      - name: Verify diagnostic-only branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          FROZEN=afc2e65a65dc95e35ef3391b92be8adc7827e16f
          test "$(git rev-parse HEAD^)" = "$FROZEN"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gate2a-q5-level2-input-diagnostic-r9.yml"
          printf '%s\n' \
            'diagnostic_only=true' \
            'game_installed=false' \
            'game_launched=false' \
            'gameplay_input=false' \
            'save_or_game_state_edit=false' \
            'purpose=identify_real_keyboard_event_device_and_true_key_down_up_capability' \
            > proof/method.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and collect input diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            set -u
            mkdir -p proof
            adb wait-for-device
            {
              echo '=== initial shell identity ==='
              adb shell id || true
              echo '=== build properties ==='
              adb shell getprop ro.build.type || true
              adb shell getprop ro.debuggable || true
              adb shell getprop ro.secure || true
            } > proof/identity-before-root.txt 2>&1
            adb shell input --help > proof/input-help.txt 2>&1 || true
            adb shell cat /proc/bus/input/devices > proof/proc-bus-input-devices.txt 2>&1 || true
            adb shell getevent -lp > proof/getevent-lp-before-root.txt 2>&1 || true
            adb shell dumpsys input > proof/dumpsys-input-before-root.txt 2>&1 || true
            adb shell 'ls -l /dev/input; for d in /dev/input/event*; do echo "=== $d ==="; ls -l "$d"; test -r "$d" && echo readable=yes || echo readable=no; test -w "$d" && echo writable=yes || echo writable=no; done' > proof/dev-input-before-root.txt 2>&1 || true

            {
              echo '=== adb root request ==='
              adb root 2>&1 || true
              sleep 2
              adb wait-for-device || true
              echo '=== identity after root request ==='
              adb shell id 2>&1 || true
            } > proof/root-capability.txt 2>&1

            adb shell cat /proc/bus/input/devices > proof/proc-bus-input-devices-after-root.txt 2>&1 || true
            adb shell getevent -lp > proof/getevent-lp-after-root.txt 2>&1 || true
            adb shell dumpsys input > proof/dumpsys-input-after-root.txt 2>&1 || true
            adb shell 'ls -l /dev/input; for d in /dev/input/event*; do echo "=== $d ==="; ls -l "$d"; test -r "$d" && echo readable=yes || echo readable=no; test -w "$d" && echo writable=yes || echo writable=no; done' > proof/dev-input-after-root.txt 2>&1 || true

            printf 'Diagnostic collection complete; no game was installed or launched and no gameplay key was injected.\n' > proof/result.txt

      - name: Upload diagnostic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-afc2-level2-input-diagnostic-r9
          path: proof
          if-no-files-found: error

name: Gate 2A R25 Workflow Fixer V2
on:
  push:
    branches: [gate2a-r25-signature-diagnostic]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate2a-r25-workflow-fix
          persist-credentials: true
          fetch-depth: 1
      - name: Guarded two-file repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pairs = {
            '.github/workflows/gate2a-android-release.yml': [
              ('',''),
              ('ICAgICAgICAgICAgZGlzdC9hYWItc2lnbmF0dXJlLXZlcmlmeS50eHQKICAgICAgICAgICAgZGlzdC9hYWItc2lnbmluZy1jZXJ0aWZpY2F0ZS50eHQ=','ICAgICAgICAgICAgZGlzdC9hYWItc2lnbmF0dXJlLXZlcmlmeS50eHQKICAgICAgICAgICAgZGlzdC9hYWItc2lnbmF0dXJlLXZlcmlmeS1kaXNwb3NhYmxlLnR4dAogICAgICAgICAgICBkaXN0L2FhYi1zaWduaW5nLWNlcnRpZmljYXRlLnR4dA==')],
            '.github/workflows/gate2a-air-baseline.yml': [
              ('',''),
              ('','')]
          }
          for path, reps in pairs.items():
              p=Path(path); s=p.read_text()
              for a,b in reps:
                  old=base64.b64decode(a).decode(); new=base64.b64decode(b).decode()
                  if s.count(old)!=1: raise SystemExit(f'{path}: expected one guarded block, got {s.count(old)}')
                  s=s.replace(old,new)
              p.write_text(s)
          PY
          git diff --check
          git status --short
          test "$(git status --short | wc -l)" -eq 2
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gate2a-android-release.yml .github/workflows/gate2a-air-baseline.yml
          git commit -m 'Gate 2A r25: repair recertification assertions'
          git push origin HEAD:gate2a-r25-workflow-fix

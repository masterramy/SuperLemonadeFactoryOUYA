name: Gate 2A R26 Runtime Provenance Fixer
on:
  push:
    branches: [gate2a-r25-signature-diagnostic]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate2a-r26-runtime-provenance-fix
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact runtime provenance repair
        shell: bash
        run: |
          # r26 guarded single-hunk repair
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gate2a-air-baseline.yml')
          s=p.read_text()
          old='''          sha256sum smoke-provenance/platform-tools-sha256-manifest.txt > smoke-provenance/platform-tools-manifest.sha256
          adb version > smoke-provenance/adb-version.txt 2>&1
          sha256sum "$(command -v adb)" > smoke-provenance/adb-binary.sha256
'''
          new='''          sha256sum smoke-provenance/platform-tools-sha256-manifest.txt > smoke-provenance/platform-tools-manifest.sha256
          ADB="$SDK_ROOT/platform-tools/adb"
          if [ ! -x "$ADB" ]; then
            echo "Android adb binary missing or not executable at $ADB" >&2
            exit 1
          fi
          "$ADB" version > smoke-provenance/adb-version.txt 2>&1
          sha256sum "$ADB" > smoke-provenance/adb-binary.sha256
'''
          if s.count(old)!=1: raise SystemExit(f'expected one provenance block, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- .github/workflows/gate2a-air-baseline.yml
          test "$(git status --short | wc -l)" -eq 1
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gate2a-air-baseline.yml
          git commit -m 'Gate 2A r26: resolve adb from proven SDK root'
          git push origin HEAD:gate2a-r26-runtime-provenance-fix

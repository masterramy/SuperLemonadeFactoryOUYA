name: QA Limeade graphics options Android touch
on:
  push:
    branches: [qa/gate2a-autonomous-graphics-options-emulator]
    paths: [.github/workflows/gate2a-autonomous-graphics-options.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: limeade-postlaunch-disposable-android-phone
          run-id: 39074848915
          github-token: ${{ github.token }}
          path: qa-apks
      - name: Make capture script
        shell: bash
        run: |
          cat > run-qa.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p graphics-options-qa
          apk=qa-apks/dist/postlaunch-disposable/SLF-DEV-EMULATOR-x64.apk
          test -s "$apk"
          sha256sum "$apk" > graphics-options-qa/apk_sha.txt
          adb install -r "$apk" | tee graphics-options-qa/install.txt
          adb shell pm clear com.ramybaheeg.slfport.dev
          adb shell wm size 1920x1080
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell am start -W -n com.ramybaheeg.slfport.dev/.AIRAppEntry
          sleep 9
          adb exec-out screencap -p > graphics-options-qa/01_title.png
          adb shell input tap 960 850
          sleep 4
          adb exec-out screencap -p > graphics-options-qa/02_menu.png
          adb shell input tap 1165 895
          sleep 4
          adb exec-out screencap -p > graphics-options-qa/03_options_before.png
          adb shell input tap 452 632
          sleep 3
          adb exec-out screencap -p > graphics-options-qa/04_options_after.png
          adb shell input tap 452 632
          sleep 3
          adb exec-out screencap -p > graphics-options-qa/05_options_restored.png
          python - <<'PY'
          from PIL import Image, ImageChops,ImageStat
          from pathlib import Path
          p=Path('graphics-options-qa')
          names=['01_title','02_menu','03_options_before','04_options_after','05_options_restored']
          a=[Image.open(p/f'{n}.png').convert('RGB') for n in names]
          def diff(x,y):
              return sum(ImageStat.Stat(ImageChops.difference(x,y)).mean)/3
          v={f'{names[i]}_{names[i+1]}':diff(a[i],a[i+1]) for i in range(4)}
          (p/'screen_diffs.txt').write_text(str(v))
          print(v)
          assert v['01_title_02_menu']>0.05
          assert v['02_menu_03_options_before']>0.05
          assert v['03_options_before_04_options_after']>0.005
          PY
          EOS
          chmod +x run-qa.sh
      - name: Pillow
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash run-qa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: limeade-graphics-options-touch-evidence
          path: graphics-options-qa
          if-no-files-found: warn

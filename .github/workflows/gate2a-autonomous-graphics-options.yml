name: QA Limeade graphics options Android touch
on:
  push:
    branches: [qa/gate2a-autonomous-graphics-options-emulator]
    paths: [.github/workflows/gate2a-autonomous-graphics-options.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: limeade-postlaunch-disposable-android-phone
          run-id: 39077206175
          github-token: ${{ github.token }}
          path: qa-apks
      - name: Make capture script
        shell: bash
        run: |
          cat > run-qa.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p graphics-options-qa
          apk=qa-apks/dist/postlaunch-disposable/SLF-DEV-EMULATOR-x64.apk
          test -s "$apk"
          sha256sum "$apk" > graphics-options-qa/apk_sha.txt
          adb install -r "$apk" | tee graphics-options-qa/install.txt
          adb shell pm clear com.ramybaheeg.slfport.dev
          adb shell wm size 1920x1080
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell am start -W -n com.ramybaheeg.slfport.dev/.AIRAppEntry
          sleep 9
          # Dismiss ONLY the explicitly identified Android Pixel Launcher ANR "Wait" button.
          # Never blind-tap game coordinates for a suspected system dialog.
          dismiss_dialog() {
            python - <<'PY'
          import re,subprocess,xml.etree.ElementTree as ET,time
          def sh(*args,timeout=30):
              return subprocess.run(args,capture_output=True,text=True,timeout=timeout,check=False)
          try:
              p=sh('adb','shell','uiautomator','dump','/sdcard/qa_window.xml')
              if p.returncode: raise RuntimeError('UIAutomator dump unavailable')
              q=sh('adb','shell','cat','/sdcard/qa_window.xml')
              nodes=list(ET.fromstring(q.stdout).iter('node'))
              texts=' '.join(n.get('text','') for n in nodes).lower()
              if "isn't responding" not in texts and 'not responding' not in texts:
                  print('No identified Android ANR; leaving UI untouched.')
              else:
                  waits=[n for n in nodes if n.get('text','').strip().lower()=='wait']
                  if not waits: raise RuntimeError('Android ANR has no identifiable Wait target')
                  bounds=re.findall(r'\d+',waits[0].get('bounds',''))
                  if len(bounds)!=4:raise RuntimeError('Unexpected Wait bounds')
                  x=(int(bounds[0])+int(bounds[2]))//2
                  y=(int(bounds[1])+int(bounds[3]))//2
                  print('Detected system ANR, press ONLY Wait:',x,y)
                  out=sh('adb','shell','input','tap',str(x),str(y))
                  if out.returncode:raise RuntimeError('Android Wait tap failed')
                  time.sleep(3)
          except Exception as e:
              print('Dialog inspection not conclusive:',type(e).__name__,str(e)[:160])
          PY
          }
          dismiss_dialog
          adb exec-out screencap -p > graphics-options-qa/01_title.png
          adb shell input tap 960 850
          sleep 4
          dismiss_dialog
          adb exec-out screencap -p > graphics-options-qa/02_menu.png
          adb shell input tap 810 895
          sleep 4
          dismiss_dialog
          adb exec-out screencap -p > graphics-options-qa/03_options_before.png
          adb shell input tap 525 666
          sleep 3
          dismiss_dialog
          adb exec-out screencap -p > graphics-options-qa/04_options_after.png
          adb shell input tap 525 666
          sleep 3
          dismiss_dialog
          adb exec-out screencap -p > graphics-options-qa/05_options_restored.png
          python - <<'PY'
          from PIL import Image, ImageChops,ImageStat
          from pathlib import Path
          p=Path('graphics-options-qa')
          names=['01_title','02_menu','03_options_before','04_options_after','05_options_restored']
          a=[Image.open(p/f'{n}.png').convert('RGB') for n in names]
          def diff(x,y):
              return sum(ImageStat.Stat(ImageChops.difference(x,y)).mean)/3
          v={f'{names[i]}_{names[i+1]}':diff(a[i],a[i+1]) for i in range(4)}
          (p/'screen_diffs.txt').write_text(str(v))
          print(v)
          assert v['01_title_02_menu']>0.05
          assert v['02_menu_03_options_before']>0.05
          # Verify graphics-label pixels, not merely a small change elsewhere
          # (e.g. Delete progress confirmation on the same Options page).
          label_roi=(690,610,1250,735)
          labels=[im.crop(label_roi) for im in a[2:5]]
          label_change=diff(labels[0],labels[1])
          label_restore=diff(labels[1],labels[2])
          label_roundtrip=diff(labels[0],labels[2])
          (p/'label_roi_diffs.txt').write_text(f'change={label_change} restore={label_restore} roundtrip={label_roundtrip}')
          print('graphics label ROI',label_change,label_restore,label_roundtrip)
          assert v['03_options_before_04_options_after']<5, 'Unexpected navigation away from Options'
          assert 0.05 < label_change < 20, 'Graphics label failed to change in place'
          assert 0.05 < label_restore < 20, 'Graphics label failed to restore'
          assert label_roundtrip<0.1, 'Graphics label did not return to Classic'
          PY
          EOS
          chmod +x run-qa.sh
      - name: Pillow
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash run-qa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: limeade-graphics-options-touch-evidence
          path: graphics-options-qa
          if-no-files-found: warn

name: Gate 2A AAPT2 Resource Diagnostic

on:
  push:
    branches:
      - gate2a-aapt2-diagnostic-r20

permissions:
  contents: read

jobs:
  preserve-generated-resources:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify diagnostic source relation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checkout mismatch: expected $expected got $actual" }
          New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
          @(
            "diagnostic_sha=$actual"
            "diagnostic_tree=$((& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant())"
            "customer_source_basis=fb89f9780d43127156ec86a1d666292e11ffb7cd"
            "purpose=preserve exact AIR-generated Android resource bytes after provider packaging failure"
          ) | Set-Content diagnostic/identity.txt -Encoding utf8

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1 # v2 target
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Preserve source and AIR template resource bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path diagnostic/source | Out-Null
          New-Item -ItemType Directory -Force -Path diagnostic/air-template | Out-Null

          Copy-Item -LiteralPath icons/android/icons/icon_192.png -Destination diagnostic/source/icon_192.png
          $airOuya = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          if (-not (Test-Path -LiteralPath $airOuya -PathType Leaf)) {
            throw "AIR template resource missing: $airOuya"
          }
          Copy-Item -LiteralPath $airOuya -Destination diagnostic/air-template/ouya_icon.png

          @(
            "source_icon_192_sha256=$((Get-FileHash -Algorithm SHA256 icons/android/icons/icon_192.png).Hash.ToLowerInvariant())"
            "source_icon_192_bytes=$((Get-Item icons/android/icons/icon_192.png).Length)"
            "air_template_ouya_icon_sha256=$((Get-FileHash -Algorithm SHA256 $airOuya).Hash.ToLowerInvariant())"
            "air_template_ouya_icon_bytes=$((Get-Item $airOuya).Length)"
            "air_home=$env:AIR_HOME"
            "java=$((& java -version 2>&1 | Out-String).Trim() -replace "`r?`n", ' | ')"
            "adt=$((& adt -version 2>&1 | Out-String).Trim())"
          ) | Set-Content diagnostic/input-hashes.txt -Encoding utf8

      - name: Compile exact customer source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Create disposable diagnostic certificate
        shell: cmd
        run: |
          if exist gate2a-diagnostic.p12 del /f /q gate2a-diagnostic.p12
          adt -certificate -validityPeriod 1 -cn "Gate2A AAPT2 Diagnostic" 2048-RSA gate2a-diagnostic.p12 gate2a

      - name: Run ADT packaging and preserve generated Android resources
        id: package_diag
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) {
            throw 'No usable external Android SDK.'
          }

          New-Item -ItemType Directory -Force -Path diagnostic/generated | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue diagnostic/SLF-diagnostic.apk
          $started = [DateTime]::UtcNow.AddMinutes(-1)

          $output = & adt -package -target apk -storetype pkcs12 -keystore gate2a-diagnostic.p12 -storepass gate2a diagnostic/SLF-diagnostic.apk application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -platformsdk $androidSdk 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $output | Set-Content diagnostic/adt-package.log -Encoding utf8
          "adt_exit_code=$exitCode" | Set-Content diagnostic/package-result.txt -Encoding utf8

          $tempRoots = @()
          foreach ($rootPath in @($env:TEMP, (Join-Path $env:LOCALAPPDATA 'Temp'))) {
            if ([string]::IsNullOrWhiteSpace($rootPath) -or -not (Test-Path $rootPath)) { continue }
            $tempRoots += Get-ChildItem -LiteralPath $rootPath -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -ge $started }
          }

          $found = 0
          foreach ($root in ($tempRoots | Sort-Object FullName -Unique)) {
            $resPath = Join-Path $root.FullName 'app/src/main/res'
            if (-not (Test-Path -LiteralPath $resPath -PathType Container)) { continue }
            $found++
            $dest = Join-Path 'diagnostic/generated' $root.Name
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -LiteralPath $resPath -Destination $dest -Recurse -Force
            "generated_res_root=$resPath" | Add-Content diagnostic/package-result.txt
          }
          "generated_res_roots_found=$found" | Add-Content diagnostic/package-result.txt

          $pngs = Get-ChildItem diagnostic -Recurse -File -Filter *.png -ErrorAction SilentlyContinue | Sort-Object FullName
          $pngs | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path diagnostic).Path, $_.FullName).Replace('\','/')
            $sha = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$sha  $($_.Length)  $relative"
          } | Set-Content diagnostic/png-sha256-manifest.txt -Encoding utf8

          if (Get-Command aapt2 -ErrorAction SilentlyContinue) {
            (& aapt2 version 2>&1 | Out-String).Trim() | Set-Content diagnostic/path-aapt2-version.txt -Encoding utf8
          }
          $global:LASTEXITCODE = 0

      - name: Upload exact resource diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-aapt2-resource-diagnostic
          path: diagnostic
          if-no-files-found: error

name: Gate 2A R25 Signature Diagnostic

on:
  push:
    branches:
      - gate2a-r25-signature-diagnostic

permissions:
  contents: read

jobs:
  signature-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Sanitize exact obsolete AIR drawable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          if ((Get-Item $target).Length -ne 1525 -or $hash -ne '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253') {
            throw "AIR template identity drifted: $hash"
          }
          Remove-Item -Force $target

      - name: Compile exact source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Package disposable AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A Validation' 2048-RSA release-signing.p12 gate2a-validation
          if ($LASTEXITCODE -ne 0) { throw "certificate creation failed: $LASTEXITCODE" }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore release-signing.p12 -storepass gate2a-validation dist/SLF-release.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { throw "ADT AAB packaging failed: $LASTEXITCODE" }

      - name: Compare ordinary and strict jarsigner verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $ordinary = & jarsigner -verify -certs dist/SLF-release.aab 2>&1
          $ordinaryExit = $LASTEXITCODE
          $ordinaryText = ($ordinary | Out-String)
          $ordinary | Set-Content dist/jarsigner-ordinary.txt -Encoding utf8
          Write-Host '=== ORDINARY JARSIGNER OUTPUT ==='
          $ordinary | ForEach-Object { Write-Host $_ }
          Write-Host "ordinary_exit=$ordinaryExit"
          $strict = & jarsigner -verify -strict -certs dist/SLF-release.aab 2>&1
          $strictExit = $LASTEXITCODE
          $strictText = ($strict | Out-String)
          $strict | Set-Content dist/jarsigner-strict.txt -Encoding utf8
          Write-Host '=== STRICT JARSIGNER OUTPUT ==='
          $strict | ForEach-Object { Write-Host $_ }
          Write-Host "strict_exit=$strictExit"
          @(
            "ordinary_exit=$ordinaryExit"
            "strict_exit=$strictExit"
            "ordinary_has_jar_verified=$($ordinaryText -match '(?i)jar verified')"
            "strict_has_jar_verified=$($strictText -match '(?i)jar verified')"
          ) | Set-Content dist/signature-summary.txt -Encoding utf8
          if ($ordinaryExit -ne 0 -or $ordinaryText -notmatch '(?i)jar verified') {
            throw "Ordinary jarsigner verification did not prove a valid signature. exit=$ordinaryExit"
          }
          if ($strictText -notmatch '(?i)jar verified') {
            throw "Strict jarsigner output did not report jar verified. exit=$strictExit"
          }
          $global:LASTEXITCODE = 0

      - name: Upload diagnostic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-r25-signature-diagnostic
          path: |
            dist/jarsigner-ordinary.txt
            dist/jarsigner-strict.txt
            dist/signature-summary.txt
          if-no-files-found: warn

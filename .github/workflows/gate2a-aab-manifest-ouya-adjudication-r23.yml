name: Gate 2A AAB OUYA Manifest Adjudication R23

on:
  push:
    branches:
      - gate2a-aab-manifest-ouya-adjudication-r23

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Compile and package exact staging AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A R23 Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-r23.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "AAB package failed: $LASTEXITCODE" }

      - name: Adjudicate OUYA strings and resource identity in final AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AAB = (Resolve-Path 'dist/SLF-r23.aab').Path
          @'
          import os, zipfile, hashlib
          aab=os.environ['AAB']
          out=[]
          with zipfile.ZipFile(aab) as z:
              names=z.namelist()
              ouya_names=[n for n in names if 'ouya' in n.lower()]
              out.append(f'AAB_ENTRY_COUNT={len(names)}')
              out.append(f'OUYA_NAMED_ENTRY_COUNT={len(ouya_names)}')
              for n in ouya_names:
                  b=z.read(n)
                  out.append(f'OUYA_NAMED_ENTRY path={n} bytes={len(b)} sha256={hashlib.sha256(b).hexdigest()}')
              manifest='base/manifest/AndroidManifest.xml'
              if manifest not in names:
                  raise SystemExit('missing base manifest')
              mb=z.read(manifest)
              lower=mb.lower()
              out.append(f'MANIFEST_BYTES={len(mb)}')
              out.append(f'MANIFEST_HAS_OUYA={b"ouya" in lower}')
              out.append(f'MANIFEST_HAS_OUYA_ICON={b"ouya_icon" in lower}')
              # Inspect every non-resource-image entry for literal OUYA markers.
              literal=[]
              for n in names:
                  if n in ouya_names: continue
                  try: b=z.read(n)
                  except Exception: continue
                  if b'ouya' in b.lower(): literal.append(n)
              out.append(f'NON_OUYA_NAMED_ENTRIES_WITH_OUYA_BYTES={len(literal)}')
              for n in literal: out.append('OUYA_LITERAL_ENTRY='+n)
          text='\n'.join(out)+'\n'
          print(text,end='')
          open('adjudication.txt','w',encoding='utf-8').write(text)
          '@ | Set-Content -Encoding UTF8 adjudicate.py
          python adjudicate.py

      - name: Publish adjudication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aab-ouya-adjudication-r23
          path: adjudication.txt
          if-no-files-found: error
          retention-days: 1

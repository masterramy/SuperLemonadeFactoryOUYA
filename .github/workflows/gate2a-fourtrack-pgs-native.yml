name: QA Limeade Native PGSv2 Android and AIR ANE
on:
  push:
    branches:
      - qa/gate2a-fourtrack-dualpad-cloudoptions-20261018
    paths:
      - native/pgs-ane/**
      - .github/workflows/gate2a-fourtrack-pgs-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-google-sdk-ane:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Resolve Android SDK 35
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)){$env:ANDROID_SDK_ROOT=$env:ANDROID_HOME}
          $sdk=Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if($sdk){$p=$sdk.Source}else{$p=Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools/latest/bin/sdkmanager.bat'}
          & $p 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          if($LASTEXITCODE -ne 0){throw 'Android SDK setup failed'}
      - name: Real Google SDK native compile and native extension packaging
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:AIR_HOME)){throw 'AIR_HOME not defined by AIR SDK setup'}
          & .\native\pgs-ane\build_ane.ps1 -AirSdk $env:AIR_HOME -GradleCommand 'gradle' *> pgs-native-compile.log
          $rc=$LASTEXITCODE
          Get-Content pgs-native-compile.log | Select-Object -Last 90
          if($rc -ne 0 -or -not (Test-Path native/pgs-ane/dist/SLF_PGSv2_WIP.ane)){throw "Native ANE compile/package failed $rc"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: limeade-pgs2-real-sdk-native-ane-build-evidence
          path: |
            pgs-native-compile.log
            native/pgs-ane/dist/SLF_PGSv2_WIP.ane
            native/pgs-ane/dist/SLF_PGS_ANE_WIP_RECEIPT.txt
          if-no-files-found: warn

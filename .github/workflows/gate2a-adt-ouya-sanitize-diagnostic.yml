name: Gate 2A ADT OUYA Sanitation Diagnostic

on:
  push:
    branches:
      - gate2a-adt-ouya-sanitize-diagnostic-r20

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Hash-guard and remove embedded OUYA icon from active ADT jar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $adt = Get-Command adt -ErrorAction Stop
          $adtBin = Split-Path -Parent $adt.Source
          $airRoot = Split-Path -Parent $adtBin
          $jar = Join-Path $airRoot 'lib/adt.jar'
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "Active adt.jar missing: $jar" }
          $expectedJar = '68386e96a40a8fd86ceea8e20ec425b6703501be0e71e2a4abf084b048f7700c'
          $actualJar = (Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant()
          if ($actualJar -ne $expectedJar) { throw "ADT jar identity changed. Expected $expectedJar got $actualJar" }
          $target = 'com/adobe/air/apk/ouya_icon.png'
          $zip = [IO.Compression.ZipFile]::Open($jar,[IO.Compression.ZipArchiveMode]::Update)
          try {
            $entries = @($zip.Entries | Where-Object { $_.FullName -eq $target })
            if ($entries.Count -ne 1) { throw "Expected exactly one embedded OUYA icon entry, found $($entries.Count)" }
            if ($entries[0].Length -ne 4147) { throw "Unexpected embedded OUYA icon byte count: $($entries[0].Length)" }
            $entries[0].Delete()
          } finally { $zip.Dispose() }
          $zip2 = [IO.Compression.ZipFile]::OpenRead($jar)
          try { if (@($zip2.Entries | Where-Object { $_.FullName -eq $target }).Count -ne 0) { throw 'Embedded OUYA icon entry still present after sanitation.' } } finally { $zip2.Dispose() }
          @(
            "adt_source=$($adt.Source)"
            "adt_jar=$jar"
            "adt_jar_original_sha256=$actualJar"
            "removed_entry=$target"
            'removed_entry_bytes=4147'
            "adt_jar_sanitized_sha256=$((Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant())"
          ) | Set-Content dist/adt-sanitation.txt -Encoding utf8

      - name: Compile and package sanitized AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A ADT Sanitation Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-sanitized.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "Sanitized AAB package failed: $LASTEXITCODE" }
          if (-not (Test-Path dist/SLF-sanitized.aab -PathType Leaf)) { throw 'Sanitized AAB missing.' }

      - name: Verify sanitized package surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/SLF-sanitized.aab).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            $required = @(
              'base/assets/LICENSE',
              'base/assets/THIRD_PARTY_NOTICES.md',
              'base/assets/third_party/licenses/flixel-2.55-MIT.txt',
              'base/assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt',
              'base/assets/third_party/licenses/as3-controller-input-MIT.txt'
            )
            foreach ($entry in $required) { if ($entries -notcontains $entry) { throw "Required notice missing: $entry" } }
            $bad = @($entries | Where-Object { $_ -match '(?i)(^|/)ouya_icon\.png$' })
            $bad | Set-Content dist/ouya-resource-scan.txt -Encoding utf8
            if ($bad.Count -ne 0) { throw "OUYA icon resource remains: $($bad -join ', ')" }
            $entries | Sort-Object | Set-Content dist/aab-entry-list.txt -Encoding utf8
          } finally { $zip.Dispose() }
          $aab = Get-Item dist/SLF-sanitized.aab
          @(
            "source_sha=$env:GITHUB_SHA"
            "aab_bytes=$($aab.Length)"
            "aab_sha256=$((Get-FileHash -Algorithm SHA256 $aab.FullName).Hash.ToLowerInvariant())"
            'nested_notices_verified=true'
            'ouya_icon_entries=0'
          ) | Set-Content dist/result.txt -Encoding utf8

      - name: Upload sanitation proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-adt-ouya-sanitation-diagnostic
          path: |
            dist/adt-sanitation.txt
            dist/result.txt
            dist/ouya-resource-scan.txt
            dist/aab-entry-list.txt
          if-no-files-found: warn

name: Gate2A rev41 workflow applicator dry-run
on:
  push:
    branches:
      - gate2a-rev41-source-write-helper-18
permissions:
  contents: read
jobs:
  workflow-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone and verify post-notice exact-final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout gate2a-rev41-exact-final
          test "$(git rev-parse HEAD)" = "3d9069ccd1b84f4f216f4ca790984cd0b931b641"
          test "$(git rev-parse HEAD^{tree})" = "6736b64d4df5863a0858bca03adde8b8001bebb7"
          test "$(git rev-parse HEAD:.github/workflows/gate2a-android-release.yml)" = "1e9ae00f9748dc982ea92ec3e55eb47662776cfe"
          test "$(git rev-parse HEAD:.github/workflows/gate2a-air-baseline.yml)" = "dd124aed3826ebd16722881793024faa4a3bc5f3"
          test -z "$(git status --porcelain)"
      - name: Fetch and verify workflow applicator
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b878-81fd-9080-6393ff9cb314/raw?se=2026-09-12T21%3A44%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=f8b73b60-b784-5152-b216-6cdf7d39e594&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A06%3A45Z&ske=2026-09-13T01%3A06%3A45Z&sks=b&skv=2026-02-06&sig=Fnhbb1Hwvxy8bCWoZIQ3lflOBtqWYv9sqloqnXAINyQ%3D' -o /tmp/workflow_app.py
          echo 'eb6bddeb6ddc19b8c414740caa00b66eef12aa7ffa3e8209f1d1d2a6a7ee6b91  /tmp/workflow_app.py' | sha256sum --check --strict
          python -m py_compile /tmp/workflow_app.py
      - name: Full fail-closed workflow dry-run
        run: |
          set -euo pipefail
          cd repo
          python /tmp/workflow_app.py
          test -z "$(git status --porcelain)"

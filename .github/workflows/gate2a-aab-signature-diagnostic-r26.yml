name: Gate 2A AAB Signature Diagnostic R26

on:
  push:
    branches:
      - gate2a-aab-signature-diagnostic-r26

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9dda58d5f3086bf5908a90ab429e3020ce69f9f2
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Build same sanitized AAB with one-day and control disposable certificates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist,bin | Out-Null
          $target = Join-Path $env:AIR_HOME 'lib/android/lib/resources/app_entry/res/drawable-xhdpi/ouya_icon.png'
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          if ((Get-Item $target).Length -ne 1525 -or $hash -ne '58d4af4a730200aacdb84a8c768d344b463428f6df9ecd4d7dca2e1cabf0e253') { throw 'AIR sanitation preimage drift' }
          Remove-Item -Force -LiteralPath $target
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "compile failed $LASTEXITCODE" }
          $sdk=$env:ANDROID_SDK_ROOT; if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk=$env:ANDROID_HOME }
          foreach ($case in @(@{Name='oneday';Days=1},@{Name='control';Days=3650})) {
            $p12="dist/$($case.Name).p12"; $aab="dist/$($case.Name).aab"
            & adt -certificate -validityPeriod $case.Days -cn "Gate 2A $($case.Name)" 2048-RSA $p12 gate2a
            if ($LASTEXITCODE -ne 0) { throw "cert failed $($case.Name)" }
            & adt -package -target aab -storetype pkcs12 -keystore $p12 -storepass gate2a $aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $sdk
            if ($LASTEXITCODE -ne 0) { throw "package failed $($case.Name): $LASTEXITCODE" }
          }

      - name: Capture exact Java signature semantics without failing diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          foreach ($name in @('oneday','control')) {
            $aab=(Resolve-Path "dist/$name.aab").Path
            & jarsigner -verify -strict -certs $aab *> "dist/$name-jarsigner-strict.txt"
            $strict=$LASTEXITCODE
            & jarsigner -verify -certs $aab *> "dist/$name-jarsigner-nonstrict.txt"
            $nonstrict=$LASTEXITCODE
            & keytool -printcert -jarfile $aab *> "dist/$name-keytool.txt"
            $keytool=$LASTEXITCODE
            "case=$name`nstrict_exit=$strict`nnonstrict_exit=$nonstrict`nkeytool_exit=$keytool" | Set-Content "dist/$name-exits.txt" -Encoding utf8
            Write-Host "CASE $name strict=$strict nonstrict=$nonstrict keytool=$keytool"
            Get-Content "dist/$name-jarsigner-strict.txt" | ForEach-Object { Write-Host $_ }
          }
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate2a-aab-signature-diagnostic-r26
          path: |
            dist/*-jarsigner-*.txt
            dist/*-keytool.txt
            dist/*-exits.txt
          if-no-files-found: error
          retention-days: 7

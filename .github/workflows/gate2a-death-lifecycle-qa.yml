name: Gate 2A Death Retry Lifecycle QA

on:
  push:
    branches:
      - gate2a-wholegame-qa-staging

permissions:
  contents: read

jobs:
  build-instrumented-apk:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA staging
        uses: actions/checkout@v4
        with:
          ref: gate2a-wholegame-qa-staging

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true

      - name: Inject non-shipping death trigger
        shell: pwsh
        run: |
          $path = 'src/PCPlayState.as'
          $text = Get-Content -Raw $path
          $needle = "`t`t`tsuper.update();"
          $replacement = $needle + "`r`n`t`t`t// GATE2A_QA_ONLY: invoke the real game-over path without altering shipping source.`r`n`t`t`tif (FlxG.keys.justPressed(`"G`")) { this.tryAgain(); }"
          $count = ([regex]::Matches($text, [regex]::Escape($needle))).Count
          if ($count -ne 1) { throw "Expected exactly one PCPlayState super.update() needle; found $count" }
          $text = $text.Replace($needle, $replacement)
          Set-Content -Path $path -Value $text -NoNewline
          Select-String -Path $path -Pattern 'GATE2A_QA_ONLY' | ForEach-Object { $_.Line }

      - name: Compile QA SWF
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Create ephemeral signing certificate
        shell: cmd
        run: adt -certificate -validityPeriod 1 -cn "Gate2A QA" 2048-RSA gate2a-qa.p12 gate2a

      - name: Package x64 emulator APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-qa.p12 -storepass gate2a dist/SLF-qa-x64.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-death-lifecycle-qa-apk
          path: dist/SLF-qa-x64.apk
          if-no-files-found: error

  death-retry-lifecycle:
    needs: build-instrumented-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download QA APK
        uses: actions/download-artifact@v4
        with:
          name: gate2a-death-lifecycle-qa-apk
          path: runtime-apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write QA runtime script
        shell: bash
        run: |
          cat > qa-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p qa
          APK="runtime-apk/SLF-qa-x64.apk"
          PACKAGE="air.com.initialsgames.SLF"

          adb install -r "$APK" > qa/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          adb logcat -c
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > qa/launch.txt 2>&1
          sleep 12

          # Intro -> menu -> level select -> Level 2 gameplay.
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 5
          adb shell input keyevent KEYCODE_X; sleep 4
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12

          PID_GAME=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          test -n "$PID_GAME"
          echo "$PID_GAME" > qa/pid-gameplay.txt
          adb exec-out screencap -p > qa/01-gameplay.png

          # Invoke the real tryAgain() path through QA-only keyboard injection.
          adb shell input keyevent KEYCODE_G
          sleep 3
          PID_GAMEOVER=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          test -n "$PID_GAMEOVER"
          echo "$PID_GAMEOVER" > qa/pid-gameover.txt
          adb exec-out screencap -p > qa/02-gameover.png

          # Game-over defaults to Play Again; X must invoke the real resetLevel().
          adb shell input keyevent KEYCODE_X
          sleep 5
          PID_RETRY=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          test -n "$PID_RETRY"
          echo "$PID_RETRY" > qa/pid-retry.txt
          adb exec-out screencap -p > qa/03-after-retry.png

          # Pause and resume using the shipping P path.
          adb shell input keyevent KEYCODE_P
          sleep 2
          adb exec-out screencap -p > qa/04-paused.png
          adb shell input keyevent KEYCODE_P
          sleep 2
          adb exec-out screencap -p > qa/05-resumed.png

          # Android background/resume lifecycle: HOME then relaunch the same AIR activity.
          PID_BEFORE_BG=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_BEFORE_BG" > qa/pid-before-background.txt
          adb shell input keyevent KEYCODE_HOME
          sleep 5
          PID_BACKGROUND=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_BACKGROUND" > qa/pid-background.txt
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > qa/relaunch.txt 2>&1
          sleep 5
          PID_AFTER_BG=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          test -n "$PID_AFTER_BG"
          echo "$PID_AFTER_BG" > qa/pid-after-background.txt
          adb shell dumpsys window > qa/window-after-background.txt 2>&1
          grep -m1 'mCurrentFocus=' qa/window-after-background.txt > qa/focus-after-background.txt || true
          grep -q "$PACKAGE" qa/focus-after-background.txt
          adb exec-out screencap -p > qa/06-after-background-resume.png

          # Prove input is still processed after resume.
          adb shell input keyevent KEYCODE_D
          sleep 2
          adb exec-out screencap -p > qa/07-after-resume-input.png

          adb logcat -d > qa/logcat.txt 2>&1
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError" qa/logcat.txt > qa/fatal-scan.txt; then
            cat qa/fatal-scan.txt
            exit 41
          fi

          printf 'gameplay_pid=%s\ngameover_pid=%s\nretry_pid=%s\nbefore_bg_pid=%s\nbackground_pid=%s\nafter_bg_pid=%s\n' \
            "$PID_GAME" "$PID_GAMEOVER" "$PID_RETRY" "$PID_BEFORE_BG" "$PID_BACKGROUND" "$PID_AFTER_BG" > qa/result.txt
          EOF
          chmod +x qa-runtime.sh

      - name: Boot Android and exercise death retry lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash qa-runtime.sh

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-death-lifecycle-evidence
          path: qa
          if-no-files-found: error

name: Gate 2A Notice Path Correction Writer

on:
  push:
    branches:
      - gate2a-notice-path-diagnostic

permissions:
  contents: write

jobs:
  write-correction:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate2a-icon192-repair-r20
          persist-credentials: true
          fetch-depth: 2
      - name: Apply exact proven notice-path correction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Path-preservation behavior was proven by diagnostic run 34733017762.
          $expected='509d3db8cd40125c93a8d2b2c7ae0a72cfc0d3e3'
          if ((git rev-parse HEAD).Trim() -ne $expected) { throw 'repair branch basis drifted' }
          if (git status --porcelain) { throw 'repair branch checkout is not clean' }

          $old='-C third_party/licenses flixel-2.55-MIT.txt flixel-power-tools-Simplified-BSD.txt as3-controller-input-MIT.txt'
          $new='-C . third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt'
          $targets=@{
            '.github/workflows/gate2a-android-release.yml'=1
            '.github/workflows/gate2a-air-baseline.yml'=2
          }
          foreach($path in $targets.Keys){
            $text=[IO.File]::ReadAllText((Resolve-Path $path))
            $count=([regex]::Matches($text,[regex]::Escape($old))).Count
            if($count -ne $targets[$path]){ throw "unexpected old notice packaging occurrence count in $path: $count" }
            $updated=$text.Replace($old,$new)
            [IO.File]::WriteAllText((Resolve-Path $path),$updated,(New-Object Text.UTF8Encoding($false)))
            $oldLeft=([regex]::Matches($updated,[regex]::Escape($old))).Count
            $newCount=([regex]::Matches($updated,[regex]::Escape($new))).Count
            if($oldLeft -ne 0 -or $newCount -ne $targets[$path]){ throw "postcondition failed for $path" }
          }
          $changed=@(git status --porcelain | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expectedChanged=@('.github/workflows/gate2a-air-baseline.yml','.github/workflows/gate2a-android-release.yml')
          if (($changed -join "`n") -ne ($expectedChanged -join "`n")) { throw "unexpected changed paths: $($changed -join ', ')" }
          git diff --check
          if($LASTEXITCODE -ne 0){ throw 'git diff --check failed' }

          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .github/workflows/gate2a-android-release.yml .github/workflows/gate2a-air-baseline.yml
          git commit -m 'Gate 2A rev41: preserve nested third-party notice paths in packages'
          git push origin HEAD:gate2a-icon192-repair-r20

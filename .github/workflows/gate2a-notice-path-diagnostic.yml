name: Gate 2A Notice Path Diagnostic

on:
  push:
    branches:
      - gate2a-notice-path-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact repaired source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 509d3db8cd40125c93a8d2b2c7ae0a72cfc0d3e3
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne '509d3db8cd40125c93a8d2b2c7ae0a72cfc0d3e3') { throw 'source drift' }
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Compile exact repaired source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package with preserved notice paths and verify archive entries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $keyPath=Join-Path $PWD 'diag.p12'; $pass='gate2a-validation'
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A Notice Diagnostic' 2048-RSA $keyPath $pass
          if ($LASTEXITCODE -ne 0) { throw 'certificate failed' }
          $androidSdk=$env:ANDROID_SDK_ROOT; if ([string]::IsNullOrWhiteSpace($androidSdk)) {$androidSdk=$env:ANDROID_HOME}
          & adt -package -target aab -storetype pkcs12 -keystore $keyPath -storepass $pass dist/diag.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt third_party/licenses/as3-controller-input-MIT.txt -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist/diag.aab)) { throw 'ADT package failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/diag.aab))
          try {
            $names=@($z.Entries | ForEach-Object FullName)
            $need=@('base/assets/LICENSE','base/assets/THIRD_PARTY_NOTICES.md','base/assets/third_party/licenses/flixel-2.55-MIT.txt','base/assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt','base/assets/third_party/licenses/as3-controller-input-MIT.txt')
            $names | Where-Object { $_ -match 'LICENSE|NOTICE|flixel|controller' } | Sort-Object | ForEach-Object { Write-Host "ENTRY=$_" }
            foreach($n in $need){ if($names -notcontains $n){ throw "missing expected nested notice $n" } }
            Write-Host 'NESTED_NOTICE_PATHS=PASS'
          } finally { $z.Dispose() }

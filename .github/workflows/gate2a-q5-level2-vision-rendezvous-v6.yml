name: Gate 2A Q5 Level 2 Vision Rendezvous V6

on:
  push:
    branches: [gate2a-android-modernization]
    paths: [.github/workflows/gate2a-q5-level2-vision-rendezvous-v6.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  level2-vision-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {fetch-depth: 40}
      - name: Verify exact product ancestor and QA-only delta
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c'
          git merge-base --is-ancestor "$PRODUCT" HEAD
          if git diff --name-only "$PRODUCT" HEAD | grep -Ev '^(\.github/workflows/gate2a-q5-.*\.yml|qa-proof/level2-.*-current/.*)$' | grep -q .; then echo 'Non-QA delta' >&2; exit 1; fi
      - name: Download exact repaired emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: gate2a-emulator-x64-apk, path: runtime-apk, github-token: '${{ secrets.GITHUB_TOKEN }}', run-id: 34777986347}
      - name: Verify APK identity
        shell: bash
        run: |
          APK='runtime-apk/SLF-emulator-x64.apk'; test "$(wc -c < "$APK"|tr -d ' ')" = '35875619'; test "$(sha256sum "$APK"|awk '{print $1}')" = '53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2'
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Write guarded ordinary-input probe
        shell: bash
        run: |
          cat > vision.py <<'PY'
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]).convert('RGB'); w,h=im.size; p=im.load()
          def c(colors, minimum=80):
              pts=[]
              for y in range(300,int(h*.82)):
                  for x in range(w):
                      if p[x,y] in colors: pts.append((x,y))
              if len(pts)<minimum:return None
              return (sum(x for x,y in pts)//len(pts),sum(y for x,y in pts)//len(pts),len(pts))
          # Andre = bright green hat. Never use the former pink anchor: retained proof showed that was the army NPC.
          A=c({(106,211,64),(104,170,51)}); L=c({(254,233,103)})
          print('A',*(A or ('NA','NA',0))); print('L',*(L or ('NA','NA',0)))
          if A and L: print('DX',A[0]-L[0]); print('DY',A[1]-L[1])
          PY
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK='runtime-apk/SLF-emulator-x64.apk'; PACKAGE='com.ramybaheeg.slfport'; OUT='level2-vision-v6'; mkdir -p "$OUT"
          dismiss(){ adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1||return 0; adb pull /sdcard/window.xml "$OUT/ui.xml" >/dev/null 2>&1||return 0; python3 - "$1" <<'PY' >/tmp/c
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse('level2-vision-v6/ui.xml').getroot()
          except:raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
          PY
          read x y </tmp/c||true; [ -z "${x:-}" ]||{ adb shell input tap "$x" "$y"; sleep 1; }; }
          stabilize(){
            for n in 1 2 3 4 5 6; do
              focus=$(adb shell dumpsys window 2>/dev/null|grep -m1 'mCurrentFocus='||true)
              if echo "$focus"|grep -q "$PACKAGE"; then echo "focus_ok_attempt=$n" >> "$OUT/stabilize.txt"; return 0; fi
              echo "attempt=$n focus=$focus" >> "$OUT/stabilize.txt"
              dismiss 'Wait'; dismiss 'Got it'
              adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1||true
              adb shell am start -W -n "$PACKAGE/.AIRAppEntry" >> "$OUT/refocus.txt" 2>&1||true
              sleep 2
            done
            adb shell dumpsys window > "$OUT/focus-failure.txt" 2>&1; return 1
          }
          capture(){ tag="$1"; stabilize; adb shell dumpsys window > "$OUT/window-${tag}.txt" 2>&1; adb exec-out screencap -p > "$OUT/${tag}.png"; adb logcat -d > "$OUT/logcat-${tag}.txt" 2>&1; pid=$(adb shell pidof "$PACKAGE"|tr -d '\r'); focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-${tag}.txt"||true); printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-${tag}.txt"; test -n "$pid"; echo "$focus"|grep -q "$PACKAGE"; ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-${tag}.txt" > "$OUT/fatal-${tag}.txt"; python3 vision.py "$OUT/${tag}.png" > "$OUT/vision-${tag}.txt"||true; }
          jr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT & p=$!; sleep .05; adb shell input keyevent KEYCODE_C; wait "$p"||true; sleep .30; }
          dbr(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT & p=$!; sleep .05; adb shell input keyevent KEYCODE_C; sleep .16; adb shell input keyevent KEYCODE_C; wait "$p"||true; sleep .45; }
          dbl(){ adb shell input keyevent --longpress KEYCODE_DPAD_LEFT & p=$!; sleep .05; adb shell input keyevent KEYCODE_C; sleep .16; adb shell input keyevent KEYCODE_C; wait "$p"||true; sleep .45; }
          sr(){ adb shell input touchscreen swipe 920 1280 920 1280 145; sleep .45; }
          sl(){ adb shell input touchscreen swipe 500 1280 500 1280 145; sleep .45; }
          val(){ awk -v k="$2" '$1==k{print $2}' "$1"|tail -1; }
          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed||true; adb shell settings put system accelerometer_rotation 0||true; adb shell settings put system user_rotation 1||true; adb shell wm user-rotation lock 1||true; adb shell input keyevent KEYCODE_WAKEUP||true; adb shell wm dismiss-keyguard||true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1||true
          adb logcat -c; adb shell am force-stop "$PACKAGE"||true; adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt"; sleep 5
          for _ in 1 2 3 4; do dismiss 'Got it'; dismiss 'Wait'; done
          stabilize; sleep 2; dismiss 'Wait'; stabilize
          # Ordinary customer navigation to Level 2 only.
          adb shell input keyevent KEYCODE_X; sleep 2; stabilize
          adb shell input keyevent KEYCODE_X; sleep 8; dismiss 'Wait'; stabilize
          adb shell input keyevent KEYCODE_X; sleep 4; stabilize
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1; adb shell input keyevent KEYCODE_X; sleep 12; dismiss 'Wait'; stabilize
          adb shell input keyevent KEYCODE_X; sleep 12; dismiss 'Wait'; stabilize
          capture 01-start
          for _ in $(seq 1 7); do jr; done; capture 02-andre-wall
          adb shell input keyevent KEYCODE_V; sleep 2; capture 03-liselot
          for _ in $(seq 1 3); do dbr; done; capture 04-upper
          for i in 1 2 3; do sl; capture "05-crate-left-${i}"; done
          for i in 1 2 3 4 5 6; do dbl; capture "06-return-${i}"; done
          for i in 1 2 3 4; do sl; capture "07-close-${i}"; done
          adb shell input keyevent KEYCODE_V; sleep 2; capture 08-andre-active
          rendezvous=false
          for i in $(seq 1 16); do
            capture "09-adapt-${i}"; vf="$OUT/vision-09-adapt-${i}.txt"; ax=$(val "$vf" A); ay=$(awk '$1=="A"{print $3}' "$vf"|tail -1); lx=$(val "$vf" L); ly=$(awk '$1=="L"{print $3}' "$vf"|tail -1)
            if [[ "$ax" =~ ^[0-9]+$ && "$ay" =~ ^[0-9]+$ && "$lx" =~ ^[0-9]+$ && "$ly" =~ ^[0-9]+$ ]]; then dx=$((ax-lx)); adx=${dx#-}; dy=$((ay-ly)); ady=${dy#-}; echo "step=$i ax=$ax ay=$ay lx=$lx ly=$ly dx=$dx dy=$dy" >> "$OUT/adaptive.txt"; if [ "$adx" -le 90 ] && [ "$ady" -le 110 ]; then rendezvous=true; echo "rendered_rendezvous_step=$i" >> "$OUT/adaptive.txt"; break; fi; if [ "$dx" -lt 0 ]; then sr; else sl; fi; else echo "step=$i detector_unresolved_stop_without_piggy" >> "$OUT/adaptive.txt"; break; fi
          done
          capture 10-guard; echo "rendezvous_guard=$rendezvous" >> "$OUT/adaptive.txt"
          if [ "$rendezvous" = true ]; then adb shell input keyevent KEYCODE_B; sleep 2; capture 11-after-piggy; for i in 1 2 3 4 5 6; do jr; capture "12-piggy-right-${i}"; done; else echo piggy_input_sent=false >> "$OUT/adaptive.txt"; fi
          capture 14-terminal-observation
          printf '%s\n' ordinary_shipping_inputs_only=true adaptive_state_signal=screenshot_pixels_only save_or_game_state_read=false save_or_game_state_edit=false teleport=false forced_completion=false completion_confirmation_input=false unknown_terminal_states_are_not_confirmed=true launcher_anr_is_external_harness_noise=true > "$OUT/method.txt"
          EOF
          chmod +x probe.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules; sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Run launcher-hardened rendered probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: gate2a-q5-level2-vision-rendezvous-v6, path: level2-vision-v6, if-no-files-found: error}
      - name: Retain current rendered proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail; test -d level2-vision-v6||exit 0; rm -rf qa-proof/level2-vision-v6-current; mkdir -p qa-proof/level2-vision-v6-current; cp level2-vision-v6/*.png level2-vision-v6/*.txt qa-proof/level2-vision-v6-current/ 2>/dev/null||true; git config user.name 'Gate 2A QA Worker'; git config user.email 'actions@users.noreply.github.com'; git add qa-proof/level2-vision-v6-current; git diff --cached --quiet&&exit 0; git commit -m 'qa-proof: retain launcher-hardened Level 2 vision frames'; git push origin HEAD:gate2a-android-modernization

name: Gate 2A AIR Baseline Compile

on:
  push:
    branches:
      - gate2a-android-modernization
  workflow_dispatch:
    inputs:
      accept_air_sdk_license:
        description: "I accept the HARMAN Adobe AIR SDK License Agreement"
        required: true
        type: boolean

jobs:
  baseline-compile:
    if: ${{ github.event_name == 'push' || inputs.accept_air_sdk_license }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: gate2a-android-modernization

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true

      - name: Record tool versions
        shell: pwsh
        run: |
          Write-Host "AIR_HOME=$env:AIR_HOME"
          Get-Command amxmlc | Format-List *
          Get-Command adt | Format-List *
          java -version

      - name: Baseline compile - unchanged game source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Create ephemeral benchmark signing certificate
        shell: cmd
        run: |
          if exist gate2a-benchmark.p12 del /f /q gate2a-benchmark.p12
          adt -certificate -validityPeriod 1 -cn "Gate2A Benchmark" 2048-RSA gate2a-benchmark.p12 gate2a

      - name: Baseline Android APK package - original descriptor and OUYA extension
        shell: cmd
        run: |
          if not exist dist mkdir dist
          if exist dist\SLF-baseline.apk del /f /q dist\SLF-baseline.apk
          adt -package -target apk -storetype pkcs12 -keystore gate2a-benchmark.p12 -storepass gate2a dist\SLF-baseline.apk application.xml -C bin SLFforOuya.swf -C icons\android . -extdir lib

      - name: Upload fresh SWF if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-baseline-swf
          path: bin/SLFforOuya.swf
          if-no-files-found: ignore

      - name: Upload baseline APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-baseline-apk
          path: dist/SLF-baseline.apk
          if-no-files-found: ignore

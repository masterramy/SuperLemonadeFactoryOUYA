name: Gate 2A Rev50 Release Qualification

on:
  push:
    branches:
      - qa/rev50-release-qualification
    paths:
      - .github/workflows/gate2a-rev50-release-qualification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify-rendered-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Prove QA branch has no shipping-source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 354e354809d240811cd2bc50aea3b4017ca7b3e4 -- \
            src data application.xml BUILD_ANDROID_VALIDATION.bat BUILD_ANDROID_PRODUCTION.bat tools \
            release/store-assets
          printf 'shipping_source_delta=none\nrev50=354e354809d240811cd2bc50aea3b4017ca7b3e4\n' > qualification-source.txt

      - name: Download exact promoted Rev50 validation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev50-exact-head-android-validation
          path: validation
          github-token: ${{ github.token }}
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 35495911788

      - name: Verify exact promoted x64 QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK="validation/emulator-qa/SLF-emulator-x64.apk"
          test -f "$APK"
          actual="$(sha256sum "$APK" | awk '{print $1}')"
          expected="90fde292caacbeb5cb68aa0d56c9672808e0aadd55c719c3b1b65e688440998c"
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual" | tee qualification-apk-sha256.txt
          test "$actual" = "$expected"

      - name: Prepare exact-APK touch-navigation qualification harness
        shell: bash
        run: |
          cat > qualify.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="validation/emulator-qa/SLF-emulator-x64.apk"
          PACKAGE="com.ramybaheeg.slfport"
          OUT="qualification"
          DIR="$OUT/touch-navigation"
          mkdir -p "$DIR"

          dismiss_system_ui(){
            for _ in 1 2 3; do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$OUT/window.xml" >/dev/null 2>&1 || true
              python3 - "$OUT/window.xml" <<'PY' > "$OUT/taps.txt" || true
          import re,sys,xml.etree.ElementTree as ET
          try: root=ET.parse(sys.argv[1]).getroot()
          except Exception: raise SystemExit
          for n in root.iter('node'):
              if n.attrib.get('text') in ('Got it','Wait','OK','Continue'):
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2)
          PY
              while read -r tx ty; do
                test -z "${tx:-}" || adb shell input tap "$tx" "$ty" >/dev/null 2>&1 || true
              done < "$OUT/taps.txt"
              sleep 1
            done
          }

          capture(){
            local file="$1"
            adb exec-out screencap -p > "$file"
            test -s "$file"
            adb shell dumpsys window > "$file.window.txt" 2>&1
            local pid focus
            pid="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            focus="$(grep -m1 'mCurrentFocus=' "$file.window.txt" || true)"
            test -n "$pid"
            echo "$focus" | grep -q "$PACKAGE"
          }

          swipe_right(){
            adb shell input swipe 700 540 1250 540 250
            sleep 1
          }

          swipe_left(){
            adb shell input swipe 1250 540 700 540 250
            sleep 1
          }

          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell wm size 1920x1080
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true

          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell pm clear "$PACKAGE" > "$DIR/clear-data.txt" 2>&1
          grep -q '^Success' "$DIR/clear-data.txt"
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$DIR/launch.txt" 2>&1
          sleep 5
          dismiss_system_ui
          sleep 4

          # PCIntroState: a single real touch is converted by MobileControls
          # to the established two-step X/action intro advance.
          adb shell input tap 960 540
          sleep 5
          capture "$DIR/00-main-menu.png"

          # Main menu defaults to FACTORY. A real tap generates ordinary X/action.
          adb shell input tap 960 540
          sleep 4
          capture "$DIR/01-level-select-baseline.png"

          # Fresh Level Select highlights Level 1. Two real horizontal swipes
          # generate RIGHT navigation pulses and select Level 3.
          swipe_right
          swipe_right
          capture "$DIR/02-level3-highlighted.png"

          adb shell input tap 960 540
          sleep 3
          capture "$DIR/03-level3-lock-dialog.png"

          # Do not use FlxG.log as a release assertion: AIR does not guarantee
          # those traces are surfaced in Android logcat. Preserve the rendered
          # frame as the semantic proof surface and ensure activation changed
          # the rendered state before continuing.
          if cmp -s "$DIR/02-level3-highlighted.png" "$DIR/03-level3-lock-dialog.png"; then
            echo "Level 3 activation produced no rendered change" >&2
            exit 1
          fi

          # Rev50 behavior under test: ordinary Android touch/action dismisses
          # the lock modal after the modal's debounce interval.
          adb shell input tap 960 540
          sleep 3
          capture "$DIR/04-after-dismiss-touch.png"

          # Return selection from Level 3 to Level 2 with a real left swipe and
          # activate it with a real tap. Source logic sends Level 2 directly
          # to PCPlayState, so the final frame must be gameplay, not cinematic.
          swipe_left
          capture "$DIR/05-level2-highlighted.png"
          adb shell input tap 960 540
          sleep 8
          capture "$DIR/06-level2-gameplay.png"

          adb logcat -d > "$DIR/final-logcat.txt" 2>&1
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$DIR/final-logcat.txt" > "$DIR/fatal.txt"; then
            echo "fatal runtime evidence" >&2
            exit 1
          fi

          cat > "$OUT/method.txt" <<'METHOD'
          exact_rev50_x64_apk=true
          exact_rev50_x64_apk_sha256=90fde292caacbeb5cb68aa0d56c9672808e0aadd55c719c3b1b65e688440998c
          shipping_source_delta=false
          touch_menu_semantics=tap_is_action_swipe_is_direction
          save_or_game_state_edit=false
          teleport=false
          forced_completion=false
          level2_completion_campaign_replayed=false
          purpose=locked-level-modal-dismissal-and-level2-launch-via-real-touch-navigation
          lock_log_required=false
          visual_adjudication_required=true
          METHOD
          EOF
          chmod +x qualify.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run bounded rendered qualification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash qualify.sh

      - name: Upload exact-APK qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev50-release-qualification-evidence
          path: |
            qualification
            qualification-source.txt
            qualification-apk-sha256.txt
          if-no-files-found: error

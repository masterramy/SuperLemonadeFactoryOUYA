name: Gate 2A Final Release QA

on:
  push:
    branches:
      - gate2a-display-scale-staging
  workflow_dispatch:

concurrency:
  group: gate2a-final-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-display-scale-staging
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true

      - name: Compile shipping candidate
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Package shipping-candidate QA APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Final Release QA" 2048-RSA gate2a-final-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path dist/SLF-final-qa.apk) { Remove-Item -Force dist/SLF-final-qa.apk }
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-final-qa.p12 -storepass gate2a dist/SLF-final-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { exit 1 }

      - name: Make disposable adjacent-spawn Level 2
        shell: pwsh
        run: |
          $path = "data/SLF_levelEditor/PC/level2.oel"
          $text = [IO.File]::ReadAllText($path)
          $patched = $text.Replace('<liselot x="580" y="470"', '<liselot x="82" y="470"')
          if ($patched -eq $text) { throw "Level 2 Liselot spawn patch did not match exactly" }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($path, $patched, $utf8)

      - name: Compile disposable real-piggyback QA SWF
        shell: cmd
        run: |
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Package disposable piggyback QA APK and restore source
        shell: pwsh
        run: |
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path dist/SLF-piggy-qa.apk) { Remove-Item -Force dist/SLF-piggy-qa.apk }
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-final-qa.p12 -storepass gate2a dist/SLF-piggy-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          git checkout -- data/SLF_levelEditor/PC/level2.oel
          if (-not $ok) { exit 1 }
          git diff --quiet -- data/SLF_levelEditor/PC/level2.oel
          if ($LASTEXITCODE -ne 0) { throw "Disposable level patch was not restored" }

      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-release-qa-apks
          path: |
            dist/SLF-final-qa.apk
            dist/SLF-piggy-qa.apk
          if-no-files-found: error

  runtime-native-touch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-release-qa-apks
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow numpy
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write native touchscreen harness
        shell: bash
        run: |
          cat > native-touch.sh <<'EOF_SCRIPT'
          #!/usr/bin/env bash
          set +e
          OUT="native-touch-api-${API_LEVEL}"; mkdir -p "$OUT"
          APK="runtime-apk/SLF-final-qa.apk"; PACKAGE="air.com.initialsgames.SLF"; FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true

          diff_ratio() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from PIL import Image,ImageChops
          a=Image.open(sys.argv[1]).convert('RGB'); b=Image.open(sys.argv[2]).convert('RGB')
          if a.size != b.size: print('1.000000'); raise SystemExit
          d=ImageChops.difference(a,b).convert('L'); h=d.histogram(); t=sum(h); print(f"{(t-h[0])/t if t else 0:.6f}")
          PY
          }

          viewport() {
            python3 - "$1" "$2" <<'PY'
          import sys
          w,h=map(int,sys.argv[1:]); vw=min(float(w),float(h)*16/9); vh=vw*9/16
          print(int(round((w-vw)/2)),int(round((h-vh)/2)),int(round(vw)),int(round(vh)))
          PY
          }

          pause_darkness() {
            python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import sys, numpy as np
          from PIL import Image
          a=np.asarray(Image.open(sys.argv[1]).convert('RGB')).mean(2); b=np.asarray(Image.open(sys.argv[2]).convert('RGB')).mean(2)
          x0,y0,vw,vh=map(int,sys.argv[3:7]); aa=a[y0:y0+vh,x0:x0+vw].mean(); bb=b[y0:y0+vh,x0:x0+vw].mean(); print(f"{bb/aa if aa else 1:.5f}")
          PY
          }

          route_level2() {
            local prefix="$1"
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true; adb shell pm clear "$PACKAGE" >/dev/null 2>&1 || true; adb logcat -c
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/${prefix}-launch.txt" 2>&1; sleep 8
            adb exec-out screencap -p > "$OUT/${prefix}-01-intro.png"
            read W H < <(python3 - "$OUT/${prefix}-01-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
            )
            if [ "$W" -le "$H" ]; then return 40; fi
            read X0 Y0 VW VH < <(viewport "$W" "$H")
            CX=$((X0+VW/2)); CY=$((Y0+VH/2)); GY=$((Y0+VH*7/8)); ZW=$((VW/6))
            LEFT_X=$((X0+ZW/2)); RIGHT_X=$((X0+ZW+ZW/2)); SWITCH_X=$((X0+ZW*2+ZW/2)); PIGGY_X=$((X0+ZW*3+ZW/2)); ACTION_X=$((X0+ZW*4+ZW/2)); JUMP_X=$((X0+ZW*5+ZW/2)); PAUSE_X=$JUMP_X; PAUSE_Y=$((Y0+VH*8/100))
            export W H X0 Y0 VW VH CX CY GY LEFT_X RIGHT_X SWITCH_X PIGGY_X ACTION_X JUMP_X PAUSE_X PAUSE_Y
            adb shell input tap "$CX" "$CY"; sleep 4; adb exec-out screencap -p > "$OUT/${prefix}-02-menu.png"
            adb shell input tap "$CX" "$CY"; sleep 4; adb exec-out screencap -p > "$OUT/${prefix}-03-level-select.png"
            adb shell input swipe $((X0+VW*40/100)) "$CY" $((X0+VW*68/100)) "$CY" 350; sleep 2; adb exec-out screencap -p > "$OUT/${prefix}-04-level2-selected.png"
            adb shell input tap "$CX" "$CY"; sleep 9; adb exec-out screencap -p > "$OUT/${prefix}-05-gameplay.png"
          }

          route_level2 main
          if [ $? -ne 0 ]; then echo "route_not_landscape" > "$OUT/failures.txt"; exit 20; fi
          A=$(diff_ratio "$OUT/main-01-intro.png" "$OUT/main-02-menu.png"); B=$(diff_ratio "$OUT/main-02-menu.png" "$OUT/main-03-level-select.png"); C=$(diff_ratio "$OUT/main-03-level-select.png" "$OUT/main-04-level2-selected.png"); D=$(diff_ratio "$OUT/main-04-level2-selected.png" "$OUT/main-05-gameplay.png")
          python3 - "$A" "$B" "$C" "$D" <<'PY'
          import sys
          a,b,c,d=map(float,sys.argv[1:]); raise SystemExit(0 if a>=.05 and b>=.03 and c>=.0002 and d>=.03 else 1)
          PY
          [ $? -ne 0 ] && echo "ROUTE $A $B $C $D" >> "$OUT/failures.txt" && FAIL=1

          adb shell input swipe "$RIGHT_X" "$GY" "$RIGHT_X" "$GY" 900; sleep 1; adb exec-out screencap -p > "$OUT/main-06-right.png"; RIGHT=$(diff_ratio "$OUT/main-05-gameplay.png" "$OUT/main-06-right.png")
          adb shell input swipe "$LEFT_X" "$GY" "$LEFT_X" "$GY" 650; sleep 1; adb exec-out screencap -p > "$OUT/main-07-left.png"; LEFT=$(diff_ratio "$OUT/main-06-right.png" "$OUT/main-07-left.png")
          adb shell input tap "$SWITCH_X" "$GY"; sleep 1; adb exec-out screencap -p > "$OUT/main-08-switch.png"; SWITCH=$(diff_ratio "$OUT/main-07-left.png" "$OUT/main-08-switch.png")
          adb shell input tap "$JUMP_X" "$GY"; sleep 0.35; adb exec-out screencap -p > "$OUT/main-09-jump.png"; JUMP=$(diff_ratio "$OUT/main-08-switch.png" "$OUT/main-09-jump.png"); sleep 1
          adb shell input tap "$SWITCH_X" "$GY"; sleep 0.5; adb exec-out screencap -p > "$OUT/main-10-before-action.png"
          adb shell input swipe "$ACTION_X" "$GY" "$ACTION_X" "$GY" 260; sleep 0.35; adb exec-out screencap -p > "$OUT/main-11-action.png"; ACTION=$(diff_ratio "$OUT/main-10-before-action.png" "$OUT/main-11-action.png")
          adb shell input tap "$PIGGY_X" "$GY"; sleep 0.5; adb exec-out screencap -p > "$OUT/main-12-piggy-dispatch.png"
          adb shell input tap "$PAUSE_X" "$PAUSE_Y"; sleep 2; adb exec-out screencap -p > "$OUT/main-13-paused.png"; PAUSE=$(diff_ratio "$OUT/main-12-piggy-dispatch.png" "$OUT/main-13-paused.png"); DARK=$(pause_darkness "$OUT/main-12-piggy-dispatch.png" "$OUT/main-13-paused.png" "$X0" "$Y0" "$VW" "$VH")
          adb shell input tap "$PAUSE_X" "$PAUSE_Y"; sleep 2; adb exec-out screencap -p > "$OUT/main-14-resumed.png"; RESUME=$(diff_ratio "$OUT/main-13-paused.png" "$OUT/main-14-resumed.png")

          python3 - "$RIGHT" "$LEFT" "$SWITCH" "$JUMP" "$ACTION" "$PAUSE" "$RESUME" "$DARK" <<'PY'
          import sys
          r,l,s,j,a,p,u,d=map(float,sys.argv[1:]); ok=r>=.001 and l>=.001 and s>=.002 and j>=.001 and a>=.001 and p>=.10 and u>=.10 and d<=.90; raise SystemExit(0 if ok else 1)
          PY
          [ $? -ne 0 ] && echo "CONTROLS right=$RIGHT left=$LEFT switch=$SWITCH jump=$JUMP action=$ACTION pause=$PAUSE resume=$RESUME dark=$DARK" >> "$OUT/failures.txt" && FAIL=1

          PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}'); adb shell dumpsys window > "$OUT/window.txt" 2>&1; FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/window.txt" || true); FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
          adb logcat -d > "$OUT/logcat.txt" 2>&1; FATAL=0; if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/logcat.txt" > "$OUT/fatal.txt"; then FATAL=1; FAIL=1; else : > "$OUT/fatal.txt"; fi
          [ -z "$PID" ] && FAIL=1; [ "$FOCUSED" -ne 1 ] && FAIL=1
          printf 'api=%s\nscreen=%sx%s\nviewport=%s,%s,%s,%s\nroute=%s,%s,%s,%s\nright=%s\nleft=%s\nswitch=%s\njump=%s\naction=%s\npause=%s\nresume=%s\npause_dark=%s\npid=%s\nfocused=%s\nfatal=%s\n' "$API_LEVEL" "$W" "$H" "$X0" "$Y0" "$VW" "$VH" "$A" "$B" "$C" "$D" "$RIGHT" "$LEFT" "$SWITCH" "$JUMP" "$ACTION" "$PAUSE" "$RESUME" "$DARK" "$PID" "$FOCUSED" "$FATAL" > "$OUT/metrics.txt"

          if [ "$API_LEVEL" = "36" ]; then
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true; adb shell pm clear "$PACKAGE" >/dev/null 2>&1 || true; adb logcat -c
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/cutscene-launch.txt" 2>&1; sleep 8
            adb exec-out screencap -p > "$OUT/cutscene-00-intro.png"
            read CW CH < <(python3 - "$OUT/cutscene-00-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
            )
            read CX0 CY0 CVW CVH < <(viewport "$CW" "$CH"); CCX=$((CX0+CVW/2)); CCY=$((CY0+CVH/2))
            adb shell input tap "$CCX" "$CCY"; sleep 4; adb shell input tap "$CCX" "$CCY"; sleep 4; adb shell input tap "$CCX" "$CCY"; sleep 5
            adb exec-out screencap -p > "$OUT/cutscene-01-before-skip.png"
            SKIP_X=$((CX0+CVW*84/100)); SKIP_Y=$((CY0+CVH*8/100)); adb shell input tap "$SKIP_X" "$SKIP_Y"; sleep 5
            adb exec-out screencap -p > "$OUT/cutscene-02-after-skip.png"; SKIP=$(diff_ratio "$OUT/cutscene-01-before-skip.png" "$OUT/cutscene-02-after-skip.png")
            python3 - "$SKIP" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1])>=.05 else 1)
          PY
            [ $? -ne 0 ] && echo "CUTSCENE_SKIP diff=$SKIP" >> "$OUT/failures.txt" && FAIL=1
            echo "cutscene_skip_diff=$SKIP" >> "$OUT/metrics.txt"
          fi

          [ -f "$OUT/failures.txt" ] && cat "$OUT/failures.txt" > "$OUT/summary.txt" || : > "$OUT/summary.txt"
          echo "api=$API_LEVEL" >> "$OUT/summary.txt"; echo "fail=$FAIL" >> "$OUT/summary.txt"; [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS-CANDIDATE: native touchscreen route, LEFT/RIGHT/SWITCH/JUMP/ACTION, PIGGY dispatch, real PAUSE/RESUME, process/focus/fatal gates passed; API36 also exercised cutscene SKIP. Manual screenshot review required." >> "$OUT/summary.txt"
          EOF_SCRIPT
          chmod +x native-touch.sh
      - name: Run native touchscreen QA
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash native-touch.sh
      - name: Upload native touch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-native-touch-api-${{ matrix.api }}
          path: native-touch-api-${{ matrix.api }}
          if-no-files-found: error

  runtime-display-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-release-qa-apks
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write display-only matrix
        shell: bash
        run: |
          cat > display-matrix.sh <<'EOF_SCRIPT'
          #!/usr/bin/env bash
          set +e
          OUT=display-matrix; mkdir -p "$OUT"; APK="runtime-apk/SLF-final-qa.apk"; PACKAGE="air.com.initialsgames.SLF"; FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true; adb shell pm clear "$PACKAGE" >/dev/null 2>&1 || true; adb logcat -c
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 8
          adb exec-out screencap -p > "$OUT/native-intro.png"
          read W H < <(python3 - "$OUT/native-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
          )
          VW=$(python3 - "$W" "$H" <<'PY'
          import sys
          w,h=map(int,sys.argv[1:]); print(int(round(min(float(w),float(h)*16/9))))
          PY
          ); VH=$((VW*9/16)); X0=$(((W-VW)/2)); Y0=$(((H-VH)/2)); CX=$((X0+VW/2)); CY=$((Y0+VH/2))
          adb shell input tap "$CX" "$CY"; sleep 4; adb shell input tap "$CX" "$CY"; sleep 4; adb shell input swipe $((X0+VW*40/100)) "$CY" $((X0+VW*68/100)) "$CY" 350; sleep 2; adb shell input tap "$CX" "$CY"; sleep 9
          adb exec-out screencap -p > "$OUT/native-gameplay.png"

          echo "label,requested,actual,expected_viewport" > "$OUT/metrics.csv"
          labels=(sixteen-nine ultra-wide pixel-wide tablet-four-three fold-near-square)
          sizes=(1080x1920 1080x2400 1440x3120 1200x1600 1600x1760)
          expected=(1920x1080 2400x1080 3120x1440 1600x1200 1760x1600)
          for I in 0 1 2 3 4; do
            LABEL=${labels[$I]}; SIZE=${sizes[$I]}; EXP=${expected[$I]}
            adb shell wm size "$SIZE" >/dev/null 2>&1 || true; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true; sleep 4
            adb exec-out screencap -p > "$OUT/${LABEL}-gameplay.png"
            read SW SH < <(python3 - "$OUT/${LABEL}-gameplay.png" <<'PY'
          import sys
          from PIL import Image,ImageStat
          im=Image.open(sys.argv[1]).convert('RGB'); print(im.width,im.height); raise SystemExit(0 if sum(ImageStat.Stat(im).var)>25 else 2)
          PY
            ); RC=$?; [ "$RC" -ne 0 ] && echo "NONVISUAL $LABEL" >> "$OUT/failures.txt" && FAIL=1
            ACT="${SW}x${SH}"; [ "$ACT" != "$EXP" ] && echo "SIZE $LABEL requested=$SIZE expected=$EXP actual=$ACT" >> "$OUT/failures.txt" && FAIL=1
            EVW=$(python3 - "$SW" "$SH" <<'PY'
          import sys
          w,h=map(int,sys.argv[1:]); print(int(round(min(float(w),float(h)*16/9))))
          PY
            ); EVH=$((EVW*9/16)); EX0=$(((SW-EVW)/2)); EY0=$(((SH-EVH)/2))
            echo "$LABEL,$SIZE,$ACT,${EX0}:${EY0}:${EVW}:${EVH}" >> "$OUT/metrics.csv"
            PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}'); [ -z "$PID" ] && echo "PID $LABEL" >> "$OUT/failures.txt" && FAIL=1
          done
          adb shell dumpsys window > "$OUT/window.txt" 2>&1; FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/window.txt" || true); echo "$FOCUS" | grep -q "$PACKAGE" || { echo "FOCUS" >> "$OUT/failures.txt"; FAIL=1; }
          adb logcat -d > "$OUT/logcat.txt" 2>&1; if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/logcat.txt" > "$OUT/fatal.txt"; then echo "FATAL" >> "$OUT/failures.txt"; FAIL=1; else : > "$OUT/fatal.txt"; fi
          adb shell wm size reset >/dev/null 2>&1 || true
          [ -f "$OUT/failures.txt" ] && cat "$OUT/failures.txt" > "$OUT/summary.txt" || : > "$OUT/summary.txt"; echo "fail=$FAIL" >> "$OUT/summary.txt"; [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS-CANDIDATE: API36 retained live Level 2 through all five requested display shapes with expected screenshot dimensions, live process/focus, and no fatal runtime signature. Manual screenshot review is the geometry authority." >> "$OUT/summary.txt"
          EOF_SCRIPT
          chmod +x display-matrix.sh
      - name: Run API36 display-only matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash display-matrix.sh
      - name: Upload display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-display-matrix-api36
          path: display-matrix
          if-no-files-found: error

  runtime-piggyback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-release-qa-apks
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write real piggyback proof
        shell: bash
        run: |
          cat > piggy.sh <<'EOF_SCRIPT'
          #!/usr/bin/env bash
          set +e
          OUT=piggyback; mkdir -p "$OUT"; APK="runtime-apk/SLF-piggy-qa.apk"; PACKAGE="air.com.initialsgames.SLF"; FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true; adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true; adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true; adb shell pm clear "$PACKAGE" >/dev/null 2>&1 || true; adb logcat -c
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 8; adb exec-out screencap -p > "$OUT/00-intro.png"
          read W H < <(python3 - "$OUT/00-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
          )
          VW=$(python3 - "$W" "$H" <<'PY'
          import sys
          w,h=map(int,sys.argv[1:]); print(int(round(min(float(w),float(h)*16/9))))
          PY
          ); VH=$((VW*9/16)); X0=$(((W-VW)/2)); Y0=$(((H-VH)/2)); CX=$((X0+VW/2)); CY=$((Y0+VH/2)); GY=$((Y0+VH*7/8)); PIGGY_X=$((X0+VW*7/12))
          adb shell input tap "$CX" "$CY"; sleep 4; adb shell input tap "$CX" "$CY"; sleep 4; adb shell input swipe $((X0+VW*40/100)) "$CY" $((X0+VW*68/100)) "$CY" 350; sleep 2; adb shell input tap "$CX" "$CY"; sleep 9
          adb exec-out screencap -p > "$OUT/01-before-piggy.png"; adb shell input tap "$PIGGY_X" "$GY"; sleep 0.8; adb exec-out screencap -p > "$OUT/02-on-shoulders.png"; adb shell input tap "$PIGGY_X" "$GY"; sleep 0.8; adb exec-out screencap -p > "$OUT/03-released.png"
          diff() { python3 - "$1" "$2" <<'PY'
          import sys
          from PIL import Image,ImageChops
          a=Image.open(sys.argv[1]).convert('RGB'); b=Image.open(sys.argv[2]).convert('RGB'); d=ImageChops.difference(a,b).convert('L'); h=d.histogram(); t=sum(h); print(f"{(t-h[0])/t if t else 0:.6f}")
          PY
          }
          ON=$(diff "$OUT/01-before-piggy.png" "$OUT/02-on-shoulders.png"); OFF=$(diff "$OUT/02-on-shoulders.png" "$OUT/03-released.png")
          python3 - "$ON" "$OFF" <<'PY'
          import sys
          a,b=map(float,sys.argv[1:]); raise SystemExit(0 if a>=.001 and b>=.001 else 1)
          PY
          [ $? -ne 0 ] && FAIL=1
          PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}'); adb shell dumpsys window > "$OUT/window.txt" 2>&1; FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/window.txt" || true); FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1; [ -z "$PID" ] && FAIL=1; [ "$FOCUSED" -ne 1 ] && FAIL=1
          adb logcat -d > "$OUT/logcat.txt" 2>&1; if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/logcat.txt" > "$OUT/fatal.txt"; then FAIL=1; else : > "$OUT/fatal.txt"; fi
          printf 'adjacent_spawn_patch=Level2_Liselot_580_to_82\non_diff=%s\noff_diff=%s\npid=%s\nfocused=%s\nfail=%s\n' "$ON" "$OFF" "$PID" "$FOCUSED" "$FAIL" > "$OUT/summary.txt"; [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS-CANDIDATE: disposable adjacent-spawn build exercised PIGGY on and off through the shipping native touch target. Manual screenshot review must confirm the real shoulders/release states." >> "$OUT/summary.txt"
          EOF_SCRIPT
          chmod +x piggy.sh
      - name: Run real piggyback proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash piggy.sh
      - name: Upload piggyback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-real-piggyback
          path: piggyback
          if-no-files-found: error

  runtime-minsdk21:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-release-qa-apks
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write API21 minimum-SDK smoke
        shell: bash
        run: |
          cat > minsdk21.sh <<'EOF_SCRIPT'
          #!/usr/bin/env bash
          set +e
          OUT=minsdk21; mkdir -p "$OUT"; APK="runtime-apk/SLF-final-qa.apk"; PACKAGE="air.com.initialsgames.SLF"; FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10; adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 12; adb exec-out screencap -p > "$OUT/launch.png"
          PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}'); adb shell dumpsys window > "$OUT/window.txt" 2>&1; FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/window.txt" || true); FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
          python3 - "$OUT/launch.png" <<'PY'
          import sys
          from PIL import Image,ImageStat
          im=Image.open(sys.argv[1]).convert('RGB'); raise SystemExit(0 if im.width>0 and im.height>0 and sum(ImageStat.Stat(im).var)>25 else 1)
          PY
          [ $? -ne 0 ] && FAIL=1; [ -z "$PID" ] && FAIL=1; [ "$FOCUSED" -ne 1 ] && FAIL=1
          adb logcat -d > "$OUT/logcat.txt" 2>&1; if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/logcat.txt" > "$OUT/fatal.txt"; then FAIL=1; else : > "$OUT/fatal.txt"; fi
          printf 'api=21\npid=%s\nfocused=%s\nfail=%s\n' "$PID" "$FOCUSED" "$FAIL" > "$OUT/summary.txt"; [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS: minSdk21 installs, launches, renders, retains process/focus, and has no fatal runtime signature." >> "$OUT/summary.txt"
          EOF_SCRIPT
          chmod +x minsdk21.sh
      - name: Run API21 minimum-SDK smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash minsdk21.sh
      - name: Upload API21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-minsdk21
          path: minsdk21
          if-no-files-found: error

name: Gate 2A Final Android Touch Display QA

on:
  push:
    branches:
      - gate2a-display-scale-staging
  workflow_dispatch:

concurrency:
  group: gate2a-final-touch-display-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-display-scale-staging
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.4.1"
          accept-license: true
      - name: Compile final touch/display candidate
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf
      - name: Package x64 QA APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & adt -certificate -validityPeriod 1 -cn "Gate2A Final Touch QA" 2048-RSA gate2a-final-qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path dist/SLF-final-qa.apk) { Remove-Item -Force dist/SLF-final-qa.apk }
            & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-final-qa.p12 -storepass gate2a dist/SLF-final-qa.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $androidSdk
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-touch-apk
          path: dist/SLF-final-qa.apk
          if-no-files-found: error

  runtime-touch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-touch-apk
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow numpy
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write rendered-geometry touch harness
        shell: bash
        run: |
          cat > touch-qa.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          OUT="touch-api-${API_LEVEL}"
          mkdir -p "$OUT"
          APK="runtime-apk/SLF-final-qa.apk"
          PACKAGE="air.com.initialsgames.SLF"
          FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          echo "label,screen_w,screen_h,hud_span,expected_span,fill_ratio,center_error,pid,focused,intro_menu,menu_level,level_nav,level_game,right_diff,left_diff,switch_hud_diff,jump_diff,action_diff,pause_diff,resume_diff,fatal" > "$OUT/metrics.csv"

          diff_ratio() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from PIL import Image,ImageChops
          a=Image.open(sys.argv[1]).convert('RGB'); b=Image.open(sys.argv[2]).convert('RGB')
          if a.size != b.size: print("1.000000"); raise SystemExit(0)
          d=ImageChops.difference(a,b).convert('L'); h=d.histogram(); total=sum(h); changed=total-h[0]
          print(f"{changed/total if total else 0:.6f}")
          PY
          }

          crop_diff() {
            python3 - "$1" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import sys
          from PIL import Image,ImageChops
          a=Image.open(sys.argv[1]).convert('RGB'); b=Image.open(sys.argv[2]).convert('RGB')
          x0,y0,x1,y1=map(int,sys.argv[3:7]); a=a.crop((x0,y0,x1,y1)); b=b.crop((x0,y0,x1,y1))
          d=ImageChops.difference(a,b).convert('L'); h=d.histogram(); total=sum(h); print(f"{(total-h[0])/total if total else 0:.6f}")
          PY
          }

          labels=(sixteen-nine ultra-wide pixel-wide tablet-four-three fold-near-square)
          portrait_sizes=(1080x1920 1080x2400 1440x3120 1200x1600 1600x1760)
          for I in 0 1 2 3 4; do
            LABEL=${labels[$I]}
            PS=${portrait_sizes[$I]}
            adb shell wm size "$PS" >/dev/null 2>&1 || true
            adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
            adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
            sleep 2
            adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
            adb shell pm clear "$PACKAGE" >/dev/null 2>&1 || true
            adb logcat -c
            adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/${LABEL}-launch.txt" 2>&1
            sleep 8
            adb exec-out screencap -p > "$OUT/${LABEL}-01-intro.png"
            read W H < <(python3 - "$OUT/${LABEL}-01-intro.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1]); print(im.width,im.height)
          PY
            )
            if [ "$W" -le "$H" ]; then echo "NOT_LANDSCAPE $LABEL ${W}x${H}" >> "$OUT/failures.txt"; FAIL=1; continue; fi
            CX=$((W/2)); CY=$((H/2))

            # One physical tap -> deterministic historical two-beat Intro start.
            adb shell input tap "$CX" "$CY" >/dev/null 2>&1
            sleep 4
            adb exec-out screencap -p > "$OUT/${LABEL}-02-menu.png"
            # One tap -> default Factory Floor / Level Select.
            adb shell input tap "$CX" "$CY" >/dev/null 2>&1
            sleep 4
            adb exec-out screencap -p > "$OUT/${LABEL}-03-level-select.png"
            # Swipe to Level 2, then choose it.
            adb shell input swipe $((W*40/100)) "$CY" $((W*68/100)) "$CY" 350 >/dev/null 2>&1
            sleep 2
            adb exec-out screencap -p > "$OUT/${LABEL}-04-level-2-selected.png"
            adb shell input tap "$CX" "$CY" >/dev/null 2>&1
            sleep 9
            adb exec-out screencap -p > "$OUT/${LABEL}-05-gameplay.png"

            INTRO_MENU=$(diff_ratio "$OUT/${LABEL}-01-intro.png" "$OUT/${LABEL}-02-menu.png")
            MENU_LEVEL=$(diff_ratio "$OUT/${LABEL}-02-menu.png" "$OUT/${LABEL}-03-level-select.png")
            LEVEL_NAV=$(diff_ratio "$OUT/${LABEL}-03-level-select.png" "$OUT/${LABEL}-04-level-2-selected.png")
            LEVEL_GAME=$(diff_ratio "$OUT/${LABEL}-04-level-2-selected.png" "$OUT/${LABEL}-05-gameplay.png")
            python3 - "$INTRO_MENU" "$MENU_LEVEL" "$LEVEL_NAV" "$LEVEL_GAME" <<'PY'
          import sys
          a,b,c,d=map(float,sys.argv[1:]); raise SystemExit(0 if a>=.05 and b>=.03 and c>=.0002 and d>=.05 else 1)
          PY
            if [ $? -ne 0 ]; then echo "ROUTE_STATE_ASSERTION $LABEL intro_menu=$INTRO_MENU menu_level=$MENU_LEVEL level_nav=$LEVEL_NAV level_game=$LEVEL_GAME" >> "$OUT/failures.txt"; FAIL=1; continue; fi

            # Detect the six actual rendered HUD buttons. This makes native touch use
            # rendered geometry rather than assumptions about Android's wm-size mapping.
            read GX0 GX1 GY HUDSPAN EXPECTED FILLRATIO CENTERERR YOFF CONTENTH < <(python3 - "$OUT/${LABEL}-05-gameplay.png" "$PS" <<'PY'
          import sys, numpy as np
          from PIL import Image
          im=np.asarray(Image.open(sys.argv[1]).convert('RGB')); h,w,_=im.shape
          pw,ph=map(int,sys.argv[2].split('x')); lw,lh=ph,pw
          br=im.mean(2); mid=(br>55)&(br<180); white=(im[:,:,0]>180)&(im[:,:,1]>180)&(im[:,:,2]>180)
          bottom=mid[int(h*.50):]; cf=bottom.mean(0); cols=np.where(cf>.12)[0]
          if not len(cols): raise SystemExit(2)
          x0,x1=int(cols.min()),int(cols.max()); span=x1-x0+1
          rf=white.mean(1); candidates=np.where(np.arange(h)>h*.55)[0]; top=int(candidates[np.argmax(rf[candidates])])
          mrf=mid.mean(1); rows=np.where((np.arange(h)>=top)&(mrf>.15))[0]; bot=int(rows.max()) if len(rows) else h-1
          gy=int((top+bot)/2)
          desired_lw=min(float(lw),float(lh)*16.0/9.0); expected=desired_lw*(float(w)/float(lw))
          ratio=span/expected if expected else 0; centererr=abs(((x0+x1)/2.0)-(w/2.0))/w
          contenth=span*9.0/16.0; yoff=(h-contenth)/2.0
          print(x0,x1,gy,span,f"{expected:.2f}",f"{ratio:.5f}",f"{centererr:.5f}",int(round(yoff)),int(round(contenth)))
          PY
            )
            if [ -z "$GX0" ]; then echo "HUD_GEOMETRY_MISSING $LABEL" >> "$OUT/failures.txt"; FAIL=1; continue; fi
            python3 - "$FILLRATIO" "$CENTERERR" <<'PY'
          import sys
          r,c=map(float,sys.argv[1:]); raise SystemExit(0 if .90<=r<=1.08 and c<=.055 else 1)
          PY
            if [ $? -ne 0 ]; then echo "DISPLAY_FIT_ASSERTION $LABEL span=$HUDSPAN expected=$EXPECTED ratio=$FILLRATIO center=$CENTERERR" >> "$OUT/failures.txt"; FAIL=1; fi

            ZW=$((HUDSPAN/6)); LEFT_X=$((GX0+ZW/2)); RIGHT_X=$((GX0+ZW+ZW/2)); SWITCH_X=$((GX0+ZW*2+ZW/2)); PIGGY_X=$((GX0+ZW*3+ZW/2)); ACTION_X=$((GX0+ZW*4+ZW/2)); JUMP_X=$((GX0+ZW*5+ZW/2))
            PAUSE_X=$JUMP_X; PAUSE_Y=$((YOFF+CONTENTH*8/100))

            adb shell input swipe "$RIGHT_X" "$GY" "$RIGHT_X" "$GY" 900 >/dev/null 2>&1; sleep 1
            adb exec-out screencap -p > "$OUT/${LABEL}-06-after-right.png"
            RIGHT_DIFF=$(diff_ratio "$OUT/${LABEL}-05-gameplay.png" "$OUT/${LABEL}-06-after-right.png")
            adb shell input swipe "$LEFT_X" "$GY" "$LEFT_X" "$GY" 650 >/dev/null 2>&1; sleep 1
            adb exec-out screencap -p > "$OUT/${LABEL}-07-after-left.png"
            LEFT_DIFF=$(diff_ratio "$OUT/${LABEL}-06-after-right.png" "$OUT/${LABEL}-07-after-left.png")

            adb shell input tap "$SWITCH_X" "$GY" >/dev/null 2>&1; sleep 1
            adb exec-out screencap -p > "$OUT/${LABEL}-08-after-switch.png"
            HUD_X1=$((GX0+HUDSPAN/4)); HUD_Y1=$((YOFF+CONTENTH/4)); [ "$HUD_Y1" -le "$YOFF" ] && HUD_Y1=$((YOFF+100))
            SWITCH_DIFF=$(crop_diff "$OUT/${LABEL}-07-after-left.png" "$OUT/${LABEL}-08-after-switch.png" "$GX0" "$YOFF" "$HUD_X1" "$HUD_Y1")

            adb shell input tap "$JUMP_X" "$GY" >/dev/null 2>&1; sleep 0.35
            adb exec-out screencap -p > "$OUT/${LABEL}-09-after-jump.png"
            JUMP_DIFF=$(diff_ratio "$OUT/${LABEL}-08-after-switch.png" "$OUT/${LABEL}-09-after-jump.png"); sleep 1

            adb shell input tap "$SWITCH_X" "$GY" >/dev/null 2>&1; sleep 0.5
            adb exec-out screencap -p > "$OUT/${LABEL}-10-before-action.png"
            adb shell input swipe "$ACTION_X" "$GY" "$ACTION_X" "$GY" 260 >/dev/null 2>&1; sleep 0.35
            adb exec-out screencap -p > "$OUT/${LABEL}-11-after-action.png"
            ACTION_DIFF=$(diff_ratio "$OUT/${LABEL}-10-before-action.png" "$OUT/${LABEL}-11-after-action.png")

            adb shell input tap "$PIGGY_X" "$GY" >/dev/null 2>&1; sleep 0.5
            adb exec-out screencap -p > "$OUT/${LABEL}-12-after-piggy-input.png"

            adb shell input tap "$PAUSE_X" "$PAUSE_Y" >/dev/null 2>&1; sleep 2
            adb exec-out screencap -p > "$OUT/${LABEL}-13-paused.png"
            PAUSE_DIFF=$(diff_ratio "$OUT/${LABEL}-12-after-piggy-input.png" "$OUT/${LABEL}-13-paused.png")
            adb shell input tap "$PAUSE_X" "$PAUSE_Y" >/dev/null 2>&1; sleep 2
            adb exec-out screencap -p > "$OUT/${LABEL}-14-resumed.png"
            RESUME_DIFF=$(diff_ratio "$OUT/${LABEL}-13-paused.png" "$OUT/${LABEL}-14-resumed.png")

            python3 - "$RIGHT_DIFF" "$LEFT_DIFF" "$SWITCH_DIFF" "$JUMP_DIFF" "$ACTION_DIFF" "$PAUSE_DIFF" "$RESUME_DIFF" <<'PY'
          import sys
          r,l,s,j,a,p,u=map(float,sys.argv[1:])
          ok=r>=.001 and l>=.001 and s>=.03 and j>=.001 and a>=.001 and p>=.05 and u>=.05
          raise SystemExit(0 if ok else 1)
          PY
            if [ $? -ne 0 ]; then echo "CONTROL_ASSERTION $LABEL right=$RIGHT_DIFF left=$LEFT_DIFF switchHUD=$SWITCH_DIFF jump=$JUMP_DIFF action=$ACTION_DIFF pause=$PAUSE_DIFF resume=$RESUME_DIFF" >> "$OUT/failures.txt"; FAIL=1; fi

            PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}')
            adb shell dumpsys window > "$OUT/${LABEL}-window.txt" 2>&1
            FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/${LABEL}-window.txt" || true); FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
            [ -z "$PID" ] && FAIL=1; [ "$FOCUSED" -ne 1 ] && FAIL=1
            adb logcat -d > "$OUT/${LABEL}-logcat.txt" 2>&1
            FATAL=0
            if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/${LABEL}-logcat.txt" > "$OUT/${LABEL}-fatal.txt"; then FATAL=1; FAIL=1; else : > "$OUT/${LABEL}-fatal.txt"; fi
            echo "$LABEL,$W,$H,$HUDSPAN,$EXPECTED,$FILLRATIO,$CENTERERR,$PID,$FOCUSED,$INTRO_MENU,$MENU_LEVEL,$LEVEL_NAV,$LEVEL_GAME,$RIGHT_DIFF,$LEFT_DIFF,$SWITCH_DIFF,$JUMP_DIFF,$ACTION_DIFF,$PAUSE_DIFF,$RESUME_DIFF,$FATAL" >> "$OUT/metrics.csv"
          done

          adb shell wm size reset >/dev/null 2>&1 || true
          [ -f "$OUT/failures.txt" ] && cat "$OUT/failures.txt" > "$OUT/summary.txt" || : > "$OUT/summary.txt"
          echo "api=$API_LEVEL" >> "$OUT/summary.txt"; echo "fail=$FAIL" >> "$OUT/summary.txt"
          [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS-CANDIDATE: five display shapes reached real Level 2 by touch only; rendered HUD geometry fills the expected centered 16:9 fit; native rendered button centers drive LEFT/RIGHT/SWITCH/JUMP/ACTION/PIGGY input; PAUSE/RESUME produces the actual pause state; process/focus/fatal checks are clean. Manual screenshot review required." >> "$OUT/summary.txt"
          EOF
          chmod +x touch-qa.sh
      - name: Run final touch/display matrix
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash touch-qa.sh
      - name: Upload final touch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-touch-api-${{ matrix.api }}
          path: touch-api-${{ matrix.api }}
          if-no-files-found: error

  runtime-minsdk21:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-final-touch-apk
          path: runtime-apk
      - run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write API 21 minimum-SDK smoke
        shell: bash
        run: |
          cat > minsdk21.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          OUT=minsdk21; mkdir -p "$OUT"; APK="runtime-apk/SLF-final-qa.apk"; PACKAGE="air.com.initialsgames.SLF"; FAIL=0
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 10
          adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch.txt" 2>&1; sleep 12
          adb exec-out screencap -p > "$OUT/launch.png"
          PID=$(adb shell ps | tr -d '\r' | awk -v p="$PACKAGE" '$NF==p {print $2; exit}')
          adb shell dumpsys window > "$OUT/window.txt" 2>&1; FOCUS=$(grep -m1 'mCurrentFocus=' "$OUT/window.txt" || true); FOCUSED=0; echo "$FOCUS" | grep -q "$PACKAGE" && FOCUSED=1
          python3 - "$OUT/launch.png" <<'PY'
          import sys
          from PIL import Image,ImageStat
          im=Image.open(sys.argv[1]).convert('RGB'); raise SystemExit(0 if im.width>0 and im.height>0 and sum(ImageStat.Stat(im).var)>25 else 1)
          PY
          [ $? -ne 0 ] && FAIL=1; [ -z "$PID" ] && FAIL=1; [ "$FOCUSED" -ne 1 ] && FAIL=1
          adb logcat -d > "$OUT/logcat.txt" 2>&1
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError|RangeError" "$OUT/logcat.txt" > "$OUT/fatal.txt"; then FAIL=1; else : > "$OUT/fatal.txt"; fi
          printf 'api=21\npid=%s\nfocused=%s\nfail=%s\n' "$PID" "$FOCUSED" "$FAIL" > "$OUT/summary.txt"; [ "$FAIL" -ne 0 ] && exit 20
          echo "PASS: minSdk 21 installs, launches, renders, retains process/focus, and has no fatal runtime signature." >> "$OUT/summary.txt"
          EOF
          chmod +x minsdk21.sh
      - name: Run API 21 minimum-SDK smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash minsdk21.sh
      - name: Upload API 21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-final-minsdk21
          path: minsdk21
          if-no-files-found: error

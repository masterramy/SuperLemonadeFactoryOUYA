name: Gate 2A Offline Ending QA

on:
  push:
    branches: [gate2a-offline-ending-qa]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate2a-offline-ending-qa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: '51.3.4.1'
          accept-license: true
      - name: Compile cleaned shipping SWF and scan bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qa | Out-Null
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          & amxmlc '-load-config+=obj\SLF_for_OuyaConfig.xml' '-output=bin\SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [IO.File]::ReadAllBytes('bin/SLFforOuya.swf')
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $forbidden = @('initialscommand.com','superlemonadefactory.initialsgames.com','mailto:initials@initialsgames.com')
          $hits = @()
          foreach ($f in $forbidden) { if ($ascii.Contains($f)) { $hits += $f } }
          "swf_bytes=$($bytes.Length)" | Set-Content qa/byte-scan.txt
          "forbidden_hits=$($hits -join ',')" | Add-Content qa/byte-scan.txt
          if ($hits.Count -ne 0) { throw "Compiled SWF still contains runtime legacy endpoint(s): $($hits -join ', ')" }
      - name: Build QA-only direct ending APK
        shell: pwsh
        run: |
          $p='src/SLF.as'
          $t=Get-Content -Raw $p
          $needle='super(640, 360, PCIntroState, 3, 60, 30);'
          if (($t.Split($needle).Count-1) -ne 1) { throw 'Expected one initial-state needle' }
          $t=$t.Replace($needle,'super(640, 360, PrizeState, 3, 60, 30);')
          Set-Content -NoNewline -Path $p -Value $t
          & amxmlc '-load-config+=obj\SLF_for_OuyaConfig.xml' '-output=bin\SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          adt -certificate -validityPeriod 1 -cn "Gate2A Ending QA" 2048-RSA qa.p12 gate2a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk=$env:ANDROID_SDK_ROOT; if ([string]::IsNullOrWhiteSpace($sdk)) {$sdk=$env:ANDROID_HOME}
          adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore qa.p12 -storepass gate2a qa/ending.apk application.xml -C bin SLFforOuya.swf -C icons/android . -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-offline-ending-apk
          path: qa/ending.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gate2a-offline-byte-scan
          path: qa/byte-scan.txt

  runtime:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gate2a-offline-ending-apk
          path: qa-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write runtime check
        run: |
          cat > run.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p evidence
          P=air.com.initialsgames.SLF
          adb install -r qa-apk/ending.apk > evidence/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb logcat -c
          adb shell am start -W -n "$P/.AIRAppEntry" > evidence/launch.txt 2>&1
          sleep 8
          test -n "$(adb shell pidof "$P" | tr -d '\r')"
          adb exec-out screencap -p > evidence/01-ending.png
          adb shell input keyevent KEYCODE_X
          sleep 5
          test -n "$(adb shell pidof "$P" | tr -d '\r')"
          adb exec-out screencap -p > evidence/02-returned-menu.png
          adb logcat -d > evidence/logcat.txt 2>&1
          if grep -E "FATAL EXCEPTION|Fatal signal|SecurityError|ArgumentError|ReferenceError|TypeError|VerifyError" evidence/logcat.txt > evidence/fatal-scan.txt; then exit 41; fi
          EOF
          chmod +x run.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2a-offline-ending-evidence
          path: evidence

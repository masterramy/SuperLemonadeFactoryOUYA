name: Gate 2A ADT OUYA Sanitation Diagnostic R21

on:
  push:
    branches:
      - gate2a-adt-ouya-sanitize-diagnostic-r21

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1
        with:
          air-version: "51.3.4.3"
          accept-license: true

      - name: Hash-guard and remove AIR OUYA source bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $airRoot = (Resolve-Path $env:AIR_HOME).Path
          $adtJar = Join-Path $airRoot 'lib/adt.jar'
          $expectedJar = '68386e96a40a8fd86ceea8e20ec425b6703501be0e71e2a4abf084b048f7700c'
          $actualJar = (Get-FileHash -Algorithm SHA256 $adtJar).Hash.ToLowerInvariant()
          if ($actualJar -ne $expectedJar) { throw "ADT jar identity changed: $actualJar" }

          $loose = @(Get-ChildItem -Path $airRoot -Recurse -File | Where-Object { $_.Name -ieq 'ouya_icon.png' })
          foreach ($file in $loose) {
            $rel = [IO.Path]::GetRelativePath($airRoot,$file.FullName).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            Write-Host "LOOSE_BEFORE path=$rel bytes=$($file.Length) sha256=$hash"
            Remove-Item -LiteralPath $file.FullName -Force
          }

          $target = 'com/adobe/air/apk/ouya_icon.png'
          $zip = [IO.Compression.ZipFile]::Open($adtJar,[IO.Compression.ZipArchiveMode]::Update)
          try {
            $entries = @($zip.Entries | Where-Object { $_.FullName -eq $target })
            if ($entries.Count -ne 1) { throw "Expected one embedded OUYA entry; found $($entries.Count)" }
            if ($entries[0].Length -ne 4147) { throw "Unexpected embedded OUYA bytes: $($entries[0].Length)" }
            $entries[0].Delete()
          } finally { $zip.Dispose() }
          Write-Host "SANITIZED_ADT_SHA256=$((Get-FileHash -Algorithm SHA256 $adtJar).Hash.ToLowerInvariant())"

      - name: Compile and package doubly sanitized AAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          & amxmlc '-load-config+=obj/SLF_for_OuyaConfig.xml' '-output=bin/SLFforOuya.swf'
          if ($LASTEXITCODE -ne 0) { throw "SWF compile failed: $LASTEXITCODE" }
          & adt -certificate -validityPeriod 1 -cn 'Gate 2A R21 Diagnostic' 2048-RSA diagnostic-signing.p12 gate2a
          if ($LASTEXITCODE -ne 0) { throw "Certificate failed: $LASTEXITCODE" }
          $sdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_HOME }
          & adt -package -target aab -storetype pkcs12 -keystore diagnostic-signing.p12 -storepass gate2a dist/SLF-r21.aab application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md third_party/licenses/flixel-2.55-MIT.txt third_party/licenses/flixel-power-tools-Simplified-BSD.txt as3-controller-input-MIT.txt -platformsdk $sdk
          if ($LASTEXITCODE -ne 0) { throw "AAB package failed: $LASTEXITCODE" }

      - name: Hash residual OUYA package entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $repoIcon = (Get-FileHash -Algorithm SHA256 'icons/android/icons/icon_192.png').Hash.ToLowerInvariant()
          Write-Host "REPO_ICON_192 bytes=$((Get-Item 'icons/android/icons/icon_192.png').Length) sha256=$repoIcon"
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/SLF-r21.aab').Path)
          try {
            $matches = @($zip.Entries | Where-Object { $_.FullName -match '(?i)(^|/)ouya_icon\.png$' })
            Write-Host "RESIDUAL_COUNT=$($matches.Count)"
            foreach ($entry in $matches) {
              $stream = $entry.Open()
              try {
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $bytes = $sha.ComputeHash($stream) } finally { $sha.Dispose() }
                $hash = ([BitConverter]::ToString($bytes)).Replace('-','').ToLowerInvariant()
                Write-Host "RESIDUAL path=$($entry.FullName) bytes=$($entry.Length) sha256=$hash equals_repo_icon_192=$($hash -eq $repoIcon)"
              } finally { $stream.Dispose() }
            }
          } finally { $zip.Dispose() }

name: Gate 2A Rev52 Observed Natural Playthrough

on:
  push:
    branches:
      - qa/rev52-observed-playthrough
    paths:
      - qa/observed_playthrough.py
      - qa/ledge_navigation.py
      - qa/hazard_navigation.py
      - qa/guard_navigation.py
      - qa/test_guard_navigation.py
      - qa/test_patrol_observer.py
      - qa/crate_navigation.py
      - qa/test_crate_navigation.py
      - src/PCPlayState.as
      - qa/test_hazard_navigation.py
      - qa/test_ledge_navigation.py
      - qa/screen_navigation.py
      - qa/test_screen_navigation.py
      - .github/workflows/gate2a-rev52-observed-playthrough.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  natural-level2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Install screenshot-classification test dependency
        shell: bash
        run: python3 -m pip install --quiet Pillow==11.3.0

      - name: Verify completion-versus-death guard (pure QA unit tests)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=qa python3 -m unittest -v qa.test_progress_guard
          PYTHONPATH=qa python3 -m unittest -v qa.test_ledge_navigation
          PYTHONPATH=qa python3 -m unittest -v qa.test_hazard_navigation
          PYTHONPATH=qa python3 -m unittest -v qa.test_guard_navigation
          PYTHONPATH=qa python3 -m unittest -v qa.test_screen_navigation
          PYTHONPATH=qa python3 -m unittest -v qa.test_patrol_observer
          PYTHONPATH=qa python3 -m unittest -v qa.test_crate_navigation

      - name: Download existing exact QA observation APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-rev52-patrol-observation-runtime
          path: runtime
          github-token: ${{ github.token }}
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 38462999144

      - name: Verify observation runtime identity and no shipping delta
        shell: bash
        run: |
          set -euo pipefail
          expected=b20c289529dd2d4a6b3c53cbffb977776609c8afd44786db9c0fafe48aeae893
          test "$(sha256sum runtime/dist/emulator-qa/SLF-emulator-x64.apk | cut -d' ' -f1)" = "$expected"
          cat runtime/qa-delta.txt
          # Windows observer builder writes CRLF; strip CR without
          # weakening the exact source-delta assertion.
          tr -d '\r' < runtime/qa-delta.txt | grep -Fxq src/PCPlayState.as
          test "$(tr -d '\r' < runtime/qa-delta.txt | sed '/^$/d' | wc -l)" -eq 1
          git diff --exit-code 3e65ef5df0acb0f7a2c1e16e6eb0998e6501b7ae -- \
            application.xml src/PCLevelSelectState.as data/logo_limeade.png tools/build-emulator-apk.ps1

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run observed ordinary-input playthrough with diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: python3 qa/observed_playthrough.py

      - name: Upload observed-play evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-rev52-observed-natural-level2
          path: playthrough-evidence
          if-no-files-found: error

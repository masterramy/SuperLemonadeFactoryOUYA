name: Gate 2A Q5 Level 2 Completion Proof

on:
  push:
    branches: [gate2a-android-modernization]
    paths: [.github/workflows/gate2a-q5-level2-completion-proof.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  level2-completion-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download frozen emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34751262569
      - name: Verify frozen APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="runtime-apk/SLF-emulator-x64.apk"
          test -f "$APK"
          test "$(wc -c < "$APK" | tr -d ' ')" = "35875555"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "c33340f6370e30ab6742c75d79fb7d8b3312fb492c3f3198a709e5f46569b4f7"
      - name: Write completion-state-aware ordinary-input Level 2 harness
        shell: bash
        run: |
          cat > level2-proof.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p level2-proof
          APK="runtime-apk/SLF-emulator-x64.apk"; PACKAGE="com.ramybaheeg.slfport"
          capture(){ tag="$1"; adb shell dumpsys window > "level2-proof/window-${tag}.txt" 2>&1; adb exec-out screencap -p > "level2-proof/${tag}.png"; adb logcat -d > "level2-proof/logcat-${tag}.txt" 2>&1; pid=$(adb shell pidof "$PACKAGE"|tr -d '\r'); focus=$(grep -m1 'mCurrentFocus=' "level2-proof/window-${tag}.txt"||true); printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "level2-proof/state-${tag}.txt"; test -n "$pid"; echo "$focus"|grep -q "$PACKAGE"; ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "level2-proof/logcat-${tag}.txt" > "level2-proof/fatal-${tag}.txt"; }
          dismiss_text(){ wanted="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1||return 0; adb pull /sdcard/window.xml level2-proof/window-ui.xml >/dev/null 2>&1||return 0; coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse('level2-proof/window-ui.xml').getroot()
          except:raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:
                a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
          PY
          ); [ -z "$coords" ]||{ adb shell input tap $coords >/dev/null 2>&1||true; sleep 1; }; }
          gameplay_signature(){ python3 - "$1" <<'PY'
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]).convert('RGB')
          w,h=im.size
          # Top-right shipping PAUSE-control region. A large visual change here is a safe
          # stop signal for blind traversal input; it never mutates or inspects game state.
          box=im.crop((int(w*.76),int(h*.015),int(w*.97),int(h*.16))).resize((64,32))
          vals=[]
          for p in box.getdata(): vals.extend(p)
          print(','.join(map(str,vals)))
          PY
          }
          signature_mad(){ python3 - "$1" "$2" <<'PY'
          import sys
          a=list(map(int,open(sys.argv[1]).read().strip().split(',')))
          b=list(map(int,open(sys.argv[2]).read().strip().split(',')))
          print(sum(abs(x-y) for x,y in zip(a,b))/len(a))
          PY
          }
          move_once(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .18; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .25; }
          launch(){ adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1||true; adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$1" 2>&1; sleep 4; for _ in 1 2 3 4; do dismiss_text "Got it"; dismiss_text "Wait"; sleep 1; done; sleep 8; }
          to_level_select(){ adb shell input keyevent KEYCODE_X; sleep 2; adb shell input keyevent KEYCODE_X; sleep 8; adb shell input keyevent KEYCODE_X; sleep 4; }

          adb install -r "$APK" > level2-proof/install.txt 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1||true; adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1||true; adb shell settings put system user_rotation 1 >/dev/null 2>&1||true; adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1||true; adb shell wm user-rotation lock 1 >/dev/null 2>&1||true; adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1||true; adb shell wm dismiss-keyguard >/dev/null 2>&1||true

          launch level2-proof/launch-command.txt
          to_level_select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1; adb shell input keyevent KEYCODE_X; sleep 12; adb shell input keyevent KEYCODE_X; sleep 12
          capture 01-level2-start; pid0=$(adb shell pidof "$PACKAGE"|tr -d '\r')
          gameplay_signature level2-proof/01-level2-start.png > level2-proof/sig-baseline.txt

          # Traverse in single bounded ordinary-input bursts. After every burst, render and
          # compare only the visible PAUSE-control region. Once the rendered state changes
          # materially, stop movement immediately; never continue blind RIGHT+C across it.
          transitioned=0
          for i in $(seq -w 1 28); do
            move_once
            tag="02-step-${i}"
            capture "$tag"
            gameplay_signature "level2-proof/${tag}.png" > "level2-proof/sig-${tag}.txt"
            mad=$(signature_mad level2-proof/sig-baseline.txt "level2-proof/sig-${tag}.txt")
            printf '%s %s\n' "$tag" "$mad" >> level2-proof/signature-mad.txt
            if python3 - "$mad" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1]) >= 18.0 else 1)
          PY
            then
              transitioned=1
              printf 'rendered_transition_detected_at=%s\nmad=%s\n' "$tag" "$mad" | tee level2-proof/transition.txt
              break
            fi
          done
          test "$pid0" = "$(adb shell pidof "$PACKAGE"|tr -d '\r')"
          printf 'ordinary_inputs_only=true\nsave_or_game_state_edit=false\nteleport=false\nrendered_state_guard=true\n' > level2-proof/method.txt

          # Preserve the transition before any further input. Then use only the default
          # highlighted action. On genuine LEVEL COMPLETE this means Next Level; on a death
          # it means Retry. No LEFT/RIGHT is emitted here, so Menu cannot be selected blindly.
          sleep 5; capture 03-transition-settled
          if [ "$transitioned" = 1 ]; then
            adb shell input keyevent KEYCODE_X; sleep 12; capture 04-default-action-result
            adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 2; capture 05-post-action-benign-movement
          fi

          # Cold persistence probe. Force-stop/relaunch is lifecycle control only; no save or
          # game-state file is edited. Navigate ordinarily to Level Select and attempt Level 3.
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1||true; sleep 2
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > level2-proof/cold-relaunch-command.txt 2>&1; sleep 4
          for _ in 1 2 3 4; do dismiss_text "Got it"; dismiss_text "Wait"; sleep 1; done; sleep 8
          to_level_select
          capture 06-cold-level-select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          capture 07-cold-level3-selected
          adb shell input keyevent KEYCODE_X; sleep 10
          capture 08-cold-level3-action-result
          printf 'PASS-CANDIDATE only: rendered sequence requires sequential visual adjudication for genuine LEVEL COMPLETE, Next Level progression, and cold Level-3 unlock persistence.\n' > level2-proof/result.txt
          EOF
          chmod +x level2-proof.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and execute genuine Level 2 traversal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash level2-proof.sh
      - name: Upload Level 2 rendered proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-level2-completion-render-proof
          path: level2-proof
          if-no-files-found: error

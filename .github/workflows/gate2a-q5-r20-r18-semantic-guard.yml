name: Gate 2A Q5 R20 R18 Semantic Guard
on:
  push:
    branches: [qa/q5-afc2-r20-r18-semantic-guard]
    paths: [.github/workflows/gate2a-q5-r20-r18-semantic-guard.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {fetch-depth: 8}
      - name: Verify QA-only frozen ancestry
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=afc2e65a65dc95e35ef3391b92be8adc7827e16f
          test "$(git merge-base HEAD "$FROZEN")" = "$FROZEN"
          test "$(git diff --name-only "$FROZEN"..HEAD)" = ".github/workflows/gate2a-q5-r20-r18-semantic-guard.yml"
      - name: Download retained R18 PASS proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-q5-afc2-level2-stepwise-r18-switch-from-safe-parking
          path: r18
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34848966553
      - name: Download retained R19 false-positive proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-q5-afc2-level2-stepwise-r19-liselot-spike-clear
          path: r19
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34851949337
      - name: Validate localized semantic guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          mkdir -p proof
          python3 - <<'PY'
          from PIL import Image
          import numpy as np, pathlib
          good=pathlib.Path('r18/10-switch-settled.png')
          bad=pathlib.Path('r19/10-r18-equivalent.png')
          assert good.exists() and bad.exists()
          def metric(p):
              im=np.asarray(Image.open(p).convert('RGB'))
              h,w,_=im.shape
              # R18's required lower-center player-state region. Relative coordinates keep this resolution-independent.
              x0,x1=int(w*.48),int(w*.70); y0,y1=int(h*.45),int(h*.78)
              q=im[y0:y1,x0:x1].astype(np.int16)
              R,G,B=q[:,:,0],q[:,:,1],q[:,:,2]
              green=((G>110)&((G-R)>25)&((G-B)>25)).mean()
              sat=((q.max(axis=2)-q.min(axis=2))>60).mean()
              return float(green),float(sat),(x0,y0,x1,y1)
          gg,gs,box=metric(good); bg,bs,_=metric(bad)
          # Adversarially selected to leave margin from both retained classes.
          # Required R18 state has both a localized green player signal and higher localized chroma.
          def accept(g,s): return g>=0.004 and s>=0.050
          out=(f'roi={box}\nR18 green_fraction={gg:.6f} saturated_fraction={gs:.6f} accept={accept(gg,gs)}\n'
               f'R19_false_positive green_fraction={bg:.6f} saturated_fraction={bs:.6f} accept={accept(bg,bs)}\n'
               'expected: R18 ACCEPT; R19 false-positive REJECT\n')
          pathlib.Path('proof/semantic-guard-validation.txt').write_text(out)
          print(out)
          assert accept(gg,gs), 'R18 retained baseline must ACCEPT'
          assert not accept(bg,bs), 'R19 retained false-positive must REJECT'
          PY
      - name: Upload guard proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-r20-r18-semantic-guard
          path: proof
          if-no-files-found: error

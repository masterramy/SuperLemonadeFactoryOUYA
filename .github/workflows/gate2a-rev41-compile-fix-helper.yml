name: Gate 2A rev41 compile-fix helper

on:
  push:
    branches:
      - gate2a-rev41-compile-fix-helper

permissions:
  contents: write

jobs:
  patch-exact-final:
    runs-on: windows-latest
    steps:
      - name: Checkout exact-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gate2a-rev41-exact-final
          fetch-depth: 1
          persist-credentials: true
      - name: Remove retired custom-level registry write
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/PCLevelSelectState.as'
          $text = [IO.File]::ReadAllText($path)
          $needle = "`t`t`t//not playing a custom level, so when ESCAPE go to this menu. `r`n`t`t`tRegistry.isPlayingCustomLevel = false;`r`n`t`t`t`r`n"
          $count = ([regex]::Matches($text, [regex]::Escape($needle))).Count
          if ($count -ne 1) { throw "Expected exactly one retired custom-level write block, found $count." }
          $text = $text.Replace($needle, '')
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          if (Select-String -LiteralPath $path -SimpleMatch 'isPlayingCustomLevel') { throw 'Retired isPlayingCustomLevel reference remains.' }
          git diff --check
          $diff = git diff -- src/PCLevelSelectState.as
          if ($LASTEXITCODE -ne 0) { throw 'git diff failed.' }
          $changed = git diff --name-only
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/PCLevelSelectState.as') { throw "Unexpected changed paths: $($changed -join ', ')" }
      - name: Commit exact bounded repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'gate2a-worker@users.noreply.github.com'
          git add -- src/PCLevelSelectState.as
          git commit -m 'Gate 2A rev41: remove retired custom-level registry write'
          git push origin HEAD:gate2a-rev41-exact-final

name: Q5 Exact-Frozen Ordinary-Input Runtime

on:
  push:
    branches:
      - qa/q5-runtime-ordinary-input-r1

permissions:
  contents: read
  actions: read

jobs:
  q5-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact-frozen emulator APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: masterramy/SuperLemonadeFactoryOUYA
          run-id: 34743928276

      - name: Verify exact frozen APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=runtime-apk/SLF-emulator-x64.apk
          test -f "$apk"
          actual=$(sha256sum "$apk" | awk '{print $1}')
          expected=d37655e51498b83c1db2dac015df8326be4d13d928dbb0cd970ea1f5354e118b
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual" | tee apk-identity.txt
          test "$actual" = "$expected"

      - name: Record platform-tools provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q5-evidence/provenance
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$ADB"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$ADB" version > q5-evidence/provenance/adb-version.txt 2>&1
          sha256sum "$ADB" > q5-evidence/provenance/adb-binary.sha256
          cp apk-identity.txt q5-evidence/provenance/apk-identity.txt

      - name: Write ordinary-input runtime harness
        shell: bash
        run: |
          cat > q5-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p q5-evidence
          APK=runtime-apk/SLF-emulator-x64.apk
          PACKAGE=com.ramybaheeg.slfport

          adb install -r "$APK" > q5-evidence/install.txt 2>&1
          adb shell pm path "$PACKAGE" > q5-evidence/package-path.txt 2>&1
          grep -q '^package:' q5-evidence/package-path.txt

          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher >/dev/null 2>&1 || true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true

          dismiss_text() {
            local wanted="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0
            adb pull /sdcard/window.xml q5-evidence/window-ui.xml >/dev/null 2>&1 || return 0
            local coords
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          wanted=sys.argv[1]
          try: root=ET.parse('q5-evidence/window-ui.xml').getroot()
          except Exception: raise SystemExit
          for node in root.iter('node'):
              if node.attrib.get('text') != wanted: continue
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',node.attrib.get('bounds',''))
              if m:
                  x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); break
          PY
            )
            if [ -n "$coords" ]; then adb shell input tap $coords >/dev/null 2>&1 || true; sleep 1; fi
          }

          capture() {
            local stem="$1"
            adb exec-out screencap -p > "q5-evidence/${stem}.png"
            adb shell dumpsys window > "q5-evidence/${stem}-window.txt" 2>&1
            adb logcat -d > "q5-evidence/${stem}-logcat.txt" 2>&1
            local pid focus
            pid=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            focus=$(grep -m1 'mCurrentFocus=' "q5-evidence/${stem}-window.txt" || true)
            printf 'pid=%s\nfocus=%s\n' "$pid" "$focus" > "q5-evidence/${stem}-health.txt"
            test -n "$pid"
            echo "$focus" | grep -q "$PACKAGE"
            if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "q5-evidence/${stem}-logcat.txt" > "q5-evidence/${stem}-fatal-scan.txt"; then
              echo "fatal signature at $stem" >&2; exit 90
            fi
          }

          adb logcat -c
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > q5-evidence/launch.txt 2>&1
          sleep 4
          for _ in 1 2 3 4; do dismiss_text "Got it"; dismiss_text "Wait"; sleep 1; done
          sleep 8
          capture 01-launch

          # Ordinary shipping keyboard inputs only: action, menu activation, directional movement.
          adb shell input keyevent KEYCODE_X; sleep 2
          adb shell input keyevent KEYCODE_X; sleep 8
          capture 02-main-menu
          adb shell input keyevent KEYCODE_X; sleep 4
          capture 03-level-select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1
          adb shell input keyevent KEYCODE_X; sleep 12
          adb shell input keyevent KEYCODE_X; sleep 12
          capture 04-level2-before-right

          # Flat-ground RIGHT: ordinary DPAD right input only, no QA hotkeys/state mutation.
          for _ in $(seq 1 14); do adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 0.18; done
          adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT || true
          sleep 3
          capture 05-level2-after-right

          # Ordinary Android lifecycle interruption and return.
          adb shell input keyevent KEYCODE_HOME
          sleep 4
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > q5-evidence/return-from-home.txt 2>&1
          sleep 7
          capture 06-after-background-return

          printf '%s\n' \
            'candidate=703bf86dea43f527677b38c1886252d040bebfd2' \
            'apk_sha256=d37655e51498b83c1db2dac015df8326be4d13d928dbb0cd970ea1f5354e118b' \
            'inputs=ordinary_shipping_only' \
            'qa_hotkeys=none' \
            'save_or_state_mutation=none' \
            'teleport=none' \
            'forced_completion=none' \
            'result=PASS_CANDIDATE_REQUIRES_RENDERED_ADJUDICATION' > q5-evidence/result.txt
          EOF
          chmod +x q5-runtime.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and execute exact-frozen Q5 slice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash q5-runtime.sh

      - name: Upload Q5 rendered/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q5-exact-frozen-ordinary-input-r1
          path: q5-evidence
          if-no-files-found: error
          retention-days: 7

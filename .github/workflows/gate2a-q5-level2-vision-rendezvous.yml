name: Gate 2A Q5 Level 2 Vision Rendezvous Probe

on:
  push:
    branches: [gate2a-android-modernization]
    paths: [.github/workflows/gate2a-q5-level2-vision-rendezvous.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  level2-vision-rendezvous:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA staging
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 24

      - name: Verify exact product ancestor and QA-only delta
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="9d8bf6a0b27ef3a6d538c14285af3ccbca48d37c"
          git merge-base --is-ancestor "$PRODUCT" HEAD
          git diff --name-only "$PRODUCT" HEAD | tee qa-delta.txt
          if git diff --name-only "$PRODUCT" HEAD | grep -Ev '^(\.github/workflows/gate2a-q5-.*\.yml|qa-proof/level2-.*-current/.*)$' | grep -q .; then
            echo 'Non-QA customer delta detected above exact product head' >&2
            exit 1
          fi

      - name: Download exact repaired emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34777986347

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='runtime-apk/SLF-emulator-x64.apk'
          test -f "$APK"
          test "$(wc -c < "$APK" | tr -d ' ')" = '35875619'
          test "$(sha256sum "$APK" | awk '{print $1}')" = '53e0293f7ff3d8382db9e62b4f507706efbd015bb9bc001deed6de28cbfd5cd2'

      - name: Install rendered-state detector
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Write ordinary-input vision-guided rendezvous probe
        shell: bash
        run: |
          cat > vision.py <<'PY'
          from PIL import Image
          import sys, statistics
          p=sys.argv[1]
          im=Image.open(p).convert('RGB')
          w,h=im.size
          # Canvas-only ROI; excludes top status/tutorial region and bottom touch controls.
          y0,y1=int(h*0.18),int(h*0.82)
          def locate(kind):
              pts=[]
              for y in range(y0,y1,2):
                  for x in range(0,w,2):
                      r,g,b=im.getpixel((x,y))
                      if kind=='L':
                          hit=(80<=r<=125 and 165<=g<=215 and 15<=b<=105) or (150<=r<=205 and 180<=g<=225 and 55<=b<=120)
                      else:
                          hit=(195<=r<=235 and 95<=g<=145 and 130<=b<=175) or (80<=r<=155 and 45<=g<=110 and 45<=b<=105)
                      if hit: pts.append((x,y))
              if len(pts)<18: return None
              xs=[x for x,y in pts]; ys=[y for x,y in pts]
              # Robust median resists background accents sharing a palette color.
              return (int(statistics.median(xs)),int(statistics.median(ys)),len(pts))
          L=locate('L'); A=locate('A')
          print('L',*L if L else ('NA','NA',0))
          print('A',*A if A else ('NA','NA',0))
          if L and A:
              print('DX',A[0]-L[0]); print('DY',A[1]-L[1])
          PY

          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK='runtime-apk/SLF-emulator-x64.apk'; PACKAGE='com.ramybaheeg.slfport'; OUT='level2-vision-probe'
          mkdir -p "$OUT"
          capture(){
            tag="$1"
            adb shell dumpsys window > "$OUT/window-${tag}.txt" 2>&1
            adb exec-out screencap -p > "$OUT/${tag}.png"
            adb logcat -d > "$OUT/logcat-${tag}.txt" 2>&1
            pid=$(adb shell pidof "$PACKAGE"|tr -d '\r')
            focus=$(grep -m1 'mCurrentFocus=' "$OUT/window-${tag}.txt"||true)
            printf 'tag=%s\npid=%s\nfocus=%s\n' "$tag" "$pid" "$focus" > "$OUT/state-${tag}.txt"
            test -n "$pid"; echo "$focus"|grep -q "$PACKAGE"
            ! grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" "$OUT/logcat-${tag}.txt" > "$OUT/fatal-${tag}.txt"
            python3 vision.py "$OUT/${tag}.png" > "$OUT/vision-${tag}.txt" || true
          }
          dismiss_text(){
            wanted="$1"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1||return 0
            adb pull /sdcard/window.xml "$OUT/window-ui.xml" >/dev/null 2>&1||return 0
            coords=$(python3 - "$wanted" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          try:r=ET.parse('level2-vision-probe/window-ui.xml').getroot()
          except:raise SystemExit
          for n in r.iter('node'):
            if n.attrib.get('text')==sys.argv[1]:
              m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
              if m:
                a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
          PY
            ); [ -z "$coords" ]||{ adb shell input tap $coords >/dev/null 2>&1||true; sleep 1; }
          }
          jump_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .20; }
          liselot_double_right(){ adb shell input keyevent --longpress KEYCODE_DPAD_RIGHT >/dev/null 2>&1 & p=$!; sleep .05; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; sleep .16; adb shell input keyevent KEYCODE_C >/dev/null 2>&1||true; wait "$p"||true; sleep .35; }
          short_right(){ adb shell input touchscreen swipe 920 1280 920 1280 180 >/dev/null 2>&1||true; sleep .35; }
          launch(){ adb logcat -c; adb shell am force-stop "$PACKAGE" >/dev/null 2>&1||true; adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > "$OUT/launch-command.txt" 2>&1; sleep 4; for _ in 1 2 3 4; do dismiss_text 'Got it'; dismiss_text 'Wait'; sleep 1; done; sleep 8; }
          to_level_select(){ adb shell input keyevent KEYCODE_X; sleep 2; adb shell input keyevent KEYCODE_X; sleep 8; adb shell input keyevent KEYCODE_X; sleep 4; }
          parsev(){ awk -v k="$2" '$1==k{print $2}' "$1" | tail -1; }

          adb install -r "$APK" > "$OUT/install.txt" 2>&1
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1||true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1||true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1||true
          adb shell settings put global hide_error_dialogs 1 >/dev/null 2>&1||true
          adb shell wm user-rotation lock 1 >/dev/null 2>&1||true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1||true
          adb shell wm dismiss-keyguard >/dev/null 2>&1||true

          launch; to_level_select
          adb shell input keyevent KEYCODE_DPAD_RIGHT; sleep 1; adb shell input keyevent KEYCODE_X; sleep 12; adb shell input keyevent KEYCODE_X; sleep 12
          capture 01-level2-start
          for i in $(seq 1 7); do jump_right; done
          capture 02-andre-high-wall
          adb shell input keyevent KEYCODE_V; sleep 2
          capture 03-liselot-start
          for i in $(seq 1 3); do liselot_double_right; done
          capture 04-high-platform
          short_right
          capture 05-pre-hazard

          # A genuine double jump is required here: prior single-jump evidence died on the spike bed.
          liselot_double_right
          capture 06-after-hazard-jump

          # Rendered-state guarded horizontal rendezvous. Every decision comes only from screencap pixels.
          for i in $(seq 1 14); do
            capture "07-adapt-${i}"
            vf="$OUT/vision-07-adapt-${i}.txt"
            lx=$(parsev "$vf" L); ly=$(awk '$1=="L"{print $3}' "$vf"|tail -1)
            ax=$(parsev "$vf" A); ay=$(awk '$1=="A"{print $3}' "$vf"|tail -1)
            if [[ "$lx" =~ ^[0-9]+$ && "$ax" =~ ^[0-9]+$ && "$ly" =~ ^[0-9]+$ && "$ay" =~ ^[0-9]+$ ]]; then
              dx=$((ax-lx)); adx=${dx#-}; dy=$((ay-ly)); ady=${dy#-}
              printf 'step=%s lx=%s ly=%s ax=%s ay=%s dx=%s dy=%s\n' "$i" "$lx" "$ly" "$ax" "$ay" "$dx" "$dy" >> "$OUT/adaptive.txt"
              if [ "$adx" -le 230 ] && [ "$ady" -le 190 ]; then
                echo "rendered_rendezvous_step=$i" >> "$OUT/adaptive.txt"
                break
              fi
              if [ "$dx" -gt 230 ]; then
                if [ "$dy" -gt 220 ]; then liselot_double_right; else short_right; fi
              else
                adb shell input touchscreen swipe 500 1280 500 1280 140 >/dev/null 2>&1||true; sleep .35
              fi
            else
              echo "step=$i detector_unresolved" >> "$OUT/adaptive.txt"
              break
            fi
          done

          capture 08-rendezvous-guard
          vf="$OUT/vision-08-rendezvous-guard.txt"
          lx=$(parsev "$vf" L); ly=$(awk '$1=="L"{print $3}' "$vf"|tail -1)
          ax=$(parsev "$vf" A); ay=$(awk '$1=="A"{print $3}' "$vf"|tail -1)
          rendezvous=false
          if [[ "$lx" =~ ^[0-9]+$ && "$ax" =~ ^[0-9]+$ && "$ly" =~ ^[0-9]+$ && "$ay" =~ ^[0-9]+$ ]]; then
            dx=$((ax-lx)); adx=${dx#-}; dy=$((ay-ly)); ady=${dy#-}
            if [ "$adx" -le 230 ] && [ "$ady" -le 190 ]; then rendezvous=true; fi
          fi
          echo "rendezvous_guard=$rendezvous" >> "$OUT/adaptive.txt"

          # PIGGY is sent only after rendered co-location is established.
          if [ "$rendezvous" = true ]; then
            adb shell input keyevent KEYCODE_B; sleep 2
            capture 09-after-guarded-piggy
            adb shell input keyevent KEYCODE_V; sleep 1
            short_right
            capture 10-carried-motion-check
          else
            echo 'piggy_input_sent=false' >> "$OUT/adaptive.txt"
          fi

          printf '%s\n' \
            'ordinary_shipping_inputs_only=true' \
            'adaptive_state_signal=screenshot_pixels_only' \
            'save_or_game_state_read=false' \
            'save_or_game_state_edit=false' \
            'teleport=false' \
            'forced_completion=false' \
            'unknown_terminal_states_are_not_confirmed=true' > "$OUT/method.txt"
          EOF
          chmod +x probe.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and run rendered-state rendezvous probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash probe.sh

      - name: Upload full rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate2a-q5-level2-vision-rendezvous
          path: level2-vision-probe
          if-no-files-found: error

      - name: Retain adjudication frames on QA-only branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d level2-vision-probe || exit 0
          rm -rf qa-proof/level2-vision-rendezvous-current
          mkdir -p qa-proof/level2-vision-rendezvous-current
          cp level2-vision-probe/*.png qa-proof/level2-vision-rendezvous-current/ 2>/dev/null || true
          cp level2-vision-probe/method.txt level2-vision-probe/adaptive.txt qa-proof/level2-vision-rendezvous-current/ 2>/dev/null || true
          cp level2-vision-probe/vision-*.txt qa-proof/level2-vision-rendezvous-current/ 2>/dev/null || true
          git config user.name 'Gate 2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-proof/level2-vision-rendezvous-current
          git diff --cached --quiet && exit 0
          git commit -m 'qa-proof: retain Level 2 vision rendezvous frames'
          git push origin HEAD:gate2a-android-modernization

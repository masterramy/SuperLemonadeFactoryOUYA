name: Gate 2A Android Build and Smoke

on:
  push:
    branches:
      - gate2a-android-modernization
  workflow_dispatch:
    inputs:
      accept_air_sdk_license:
        description: "I accept the HARMAN Adobe AIR SDK License Agreement"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  baseline-compile:
    if: ${{ github.event_name == 'push' || inputs.accept_air_sdk_license }}
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checkout/source identity mismatch. Expected $expected, got $actual."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @(
            "github_sha=$expected"
            "checkout_head=$actual"
            "source_tree=$sourceTree"
          ) | Set-Content -Path dist/source-provenance.txt -Encoding utf8

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1 # signed v2 target
        with:
          air-version: "51.3.4.3"
          accept-license: true


      - name: Record exact build environment and SDK byte receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          @(
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "github_sha=$env:GITHUB_SHA"
            "checkout_head=$((& git rev-parse HEAD).Trim())"
            "source_tree=$((& git rev-parse 'HEAD^{tree}').Trim())"
            "action_checkout=11d5960a326750d5838078e36cf38b85af677262"
            "action_setup_java=cf277c60eb25467037889841efdb72551f06f6c3"
            "action_setup_air=1613ab5edc56ebfbdcf8ff388e2da9aa887b71f1"
            "action_upload_artifact=ea165f8d65b6e75b540449e92b4886f43607fa02"
            "action_download_artifact=d3f86a106a0bac45b974a628896c90dbdf5c8093"
          ) | Set-Content -Path dist/build-environment.txt -Encoding utf8

          "java_version_begin" | Add-Content dist/build-environment.txt
          (& java -version 2>&1 | Out-String).Trim() | Add-Content dist/build-environment.txt
          "java_version_end" | Add-Content dist/build-environment.txt

          if ([string]::IsNullOrWhiteSpace($env:AIR_HOME) -or -not (Test-Path $env:AIR_HOME)) {
            throw "AIR_HOME is unavailable after AIR SDK setup."
          }
          $airRoot = (Resolve-Path $env:AIR_HOME).Path
          $airEntries = Get-ChildItem -Path $airRoot -Recurse -File |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($airRoot, $_.FullName).Replace('\','/')
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              [PSCustomObject]@{ Path = $relative; Sha256 = $hash; Bytes = $_.Length }
            } | Sort-Object Path
          if (@($airEntries).Count -eq 0) { throw "Resolved AIR SDK tree contains no files." }
          $airEntries | ForEach-Object { "$($_.Sha256)  $($_.Bytes)  $($_.Path)" } |
            Set-Content -Path dist/air-sdk-sha256-manifest.txt -Encoding utf8
          $airManifestSha = (Get-FileHash -Algorithm SHA256 dist/air-sdk-sha256-manifest.txt).Hash.ToLowerInvariant()
          $airFileCount = @($airEntries).Count
          $airByteCount = ($airEntries | Measure-Object -Property Bytes -Sum).Sum
          "air_sdk_requested=51.3.4.3" | Add-Content dist/build-environment.txt
          "air_sdk_root=$airRoot" | Add-Content dist/build-environment.txt
          "air_sdk_file_count=$airFileCount" | Add-Content dist/build-environment.txt
          "air_sdk_tree_bytes=$airByteCount" | Add-Content dist/build-environment.txt
          "air_sdk_manifest_sha256=$airManifestSha" | Add-Content dist/build-environment.txt
          (amxmlc -version 2>&1 | Out-String).Trim() | Add-Content dist/build-environment.txt
          (adt -version 2>&1 | Out-String).Trim() | Add-Content dist/build-environment.txt

          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) {
            throw "No usable Android SDK path was found for provenance."
          }
          $androidSdk = (Resolve-Path $androidSdk).Path
          "android_sdk_root=$androidSdk" | Add-Content dist/build-environment.txt

          $androidJar = Join-Path $androidSdk 'platforms/android-36/android.jar'
          if (-not (Test-Path -LiteralPath $androidJar -PathType Leaf)) {
            throw "Android 36 android.jar is missing."
          }
          $androidJarSha = (Get-FileHash -Algorithm SHA256 $androidJar).Hash.ToLowerInvariant()
          "android_36_android_jar_sha256=$androidJarSha" | Add-Content dist/build-environment.txt

          $sdkManager = Get-Command sdkmanager -ErrorAction SilentlyContinue
          if ($sdkManager) {
            (& sdkmanager --list_installed 2>&1 | Out-String).Trim() |
              Set-Content -Path dist/android-sdk-installed-packages.txt -Encoding utf8
          } else {
            @(
              (Get-ChildItem -Directory (Join-Path $androidSdk 'platforms') -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              (Get-ChildItem -Directory (Join-Path $androidSdk 'build-tools') -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              $(if (Test-Path (Join-Path $androidSdk 'platform-tools')) { 'platform-tools' })
            ) | Set-Content -Path dist/android-sdk-installed-packages.txt -Encoding utf8
          }

          function Write-TreeReceipt([string]$Root, [string]$Label) {
            if (-not (Test-Path -LiteralPath $Root -PathType Container)) {
              throw "Required Android SDK subtree missing: $Root"
            }
            $resolved = (Resolve-Path $Root).Path
            $entries = Get-ChildItem -Path $resolved -Recurse -File |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($resolved, $_.FullName).Replace('\','/')
                $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
                [PSCustomObject]@{ Path=$relative; Sha256=$hash; Bytes=$_.Length }
              } | Sort-Object Path
            if (@($entries).Count -eq 0) { throw "Android SDK subtree is empty: $Root" }
            $manifest = "dist/android-sdk-$Label-sha256-manifest.txt"
            $entries | ForEach-Object { "$($_.Sha256)  $($_.Bytes)  $($_.Path)" } |
              Set-Content -Path $manifest -Encoding utf8
            $manifestSha = (Get-FileHash -Algorithm SHA256 $manifest).Hash.ToLowerInvariant()
            $fileCount = @($entries).Count
            $byteCount = ($entries | Measure-Object -Property Bytes -Sum).Sum
            "android_sdk_${Label}_file_count=$fileCount" | Add-Content dist/build-environment.txt
            "android_sdk_${Label}_tree_bytes=$byteCount" | Add-Content dist/build-environment.txt
            "android_sdk_${Label}_manifest_sha256=$manifestSha" | Add-Content dist/build-environment.txt
          }

          Write-TreeReceipt (Join-Path $androidSdk 'platforms/android-36') 'platform-android-36'
          $buildToolRoots = Get-ChildItem -Directory (Join-Path $androidSdk 'build-tools') -ErrorAction Stop | Sort-Object Name
          if (@($buildToolRoots).Count -eq 0) { throw "No Android build-tools revisions are installed." }
          foreach ($bt in $buildToolRoots) {
            $label = ('build-tools-' + ($bt.Name -replace '[^A-Za-z0-9._-]','_'))
            Write-TreeReceipt $bt.FullName $label
          }
          Write-TreeReceipt (Join-Path $androidSdk 'platform-tools') 'platform-tools'

          foreach ($tool in @('adb','aapt2','apksigner','zipalign')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              "${tool}_path=$($cmd.Source)" | Add-Content dist/build-environment.txt
              try { (& $tool --version 2>&1 | Out-String).Trim() | Add-Content dist/build-environment.txt } catch {}
            }
          }

      - name: Record tool versions
        shell: pwsh
        run: |
          Write-Host "AIR_HOME=$env:AIR_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Get-Command amxmlc | Format-List *
          Get-Command adt | Format-List *
          java -version


      - name: Verify release notice source identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredNotices = @(
            'LICENSE',
            'THIRD_PARTY_NOTICES.md',
            'third_party/licenses/flixel-2.55-MIT.txt',
            'third_party/licenses/flixel-power-tools-Simplified-BSD.txt',
            'third_party/licenses/as3-controller-input-MIT.txt'
          )
          foreach ($notice in $requiredNotices) {
            if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) {
              throw "Required release notice file missing: $notice"
            }
          }
          $expectedNoticeBlobs = @{
            'third_party/licenses/flixel-2.55-MIT.txt' = '5fcbbbdf0d8c043114dbf485b1f0fd7f776dd086'
            'third_party/licenses/flixel-power-tools-Simplified-BSD.txt' = 'eb85c14d618e818c2bec2bba6ec4a82e5dea7b84'
            'third_party/licenses/as3-controller-input-MIT.txt' = '21e3babda57413417549e308c61b9597bd0aa6e1'
          }
          foreach ($notice in $expectedNoticeBlobs.Keys) {
            $actualBlob = ((git hash-object -- $notice) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $expectedNoticeBlobs[$notice]) {
              throw "Third-party notice blob mismatch for $notice. Expected $($expectedNoticeBlobs[$notice]), got $actualBlob"
            }
          }
          @(
            "flixel-2.55-MIT.txt 5fcbbbdf0d8c043114dbf485b1f0fd7f776dd086"
            "flixel-power-tools-Simplified-BSD.txt eb85c14d618e818c2bec2bba6ec4a82e5dea7b84"
            "as3-controller-input-MIT.txt 21e3babda57413417549e308c61b9597bd0aa6e1"
          ) | Set-Content -Path dist/notice-source-identities.txt -Encoding utf8

      - name: Compile runtime-safe game source
        shell: cmd
        run: |
          if not exist bin mkdir bin
          if exist bin\SLFforOuya.swf del /f /q bin\SLFforOuya.swf
          amxmlc -load-config+=obj\SLF_for_OuyaConfig.xml -output=bin\SLFforOuya.swf

      - name: Create ephemeral benchmark signing certificate
        shell: cmd
        run: |
          if exist gate2a-benchmark.p12 del /f /q gate2a-benchmark.p12
          adt -certificate -validityPeriod 1 -cn "Gate2A Benchmark" 2048-RSA gate2a-benchmark.p12 gate2a

      - name: Android device APK package - runtime-safe without obsolete OUYA native payload
        id: android_package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SLF-runtime-safe.apk

          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdk) -or -not (Test-Path $androidSdk)) {
            throw "No usable Android SDK path was found on the GitHub runner."
          }
          Write-Host "Using external Android SDK: $androidSdk"

          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $output = & adt -package -target apk -storetype pkcs12 -keystore gate2a-benchmark.p12 -storepass gate2a dist/SLF-runtime-safe.apk application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md -C third_party/licenses flixel-2.55-MIT.txt flixel-power-tools-Simplified-BSD.txt as3-controller-input-MIT.txt -platformsdk $androidSdk 2>&1
          $exitCode = $LASTEXITCODE

          $output | ForEach-Object { Write-Host $_ }
          if ($null -eq $output -or @($output).Count -eq 0) {
            "ADT exited $exitCode with no console output." | Set-Content -Path adt-package.log -Encoding utf8
          } else {
            $output | Set-Content -Path adt-package.log -Encoding utf8
          }

          $summaryLines = @($output | ForEach-Object { $_.ToString().Trim() } | Where-Object { $_ } | Select-Object -First 3)
          $summary = ($summaryLines -join ' -- ') -replace '[^A-Za-z0-9 ._()-]', '_'
          if ([string]::IsNullOrWhiteSpace($summary)) { $summary = 'no-output' }
          if ($summary.Length -gt 160) { $summary = $summary.Substring(0, 160) }

          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "error_summary=$summary" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Upload ADT device-package diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adt-package-${{ steps.android_package.outputs.exit_code }}-${{ steps.android_package.outputs.error_summary }}
          path: adt-package.log
          if-no-files-found: error

      - name: Fail if Android device package failed
        if: steps.android_package.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1


      - name: Verify device APK notice/resource package boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apkPath = 'dist/SLF-runtime-safe.apk'
          if (-not (Test-Path $apkPath)) { throw "Device APK is missing." }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $apkPath).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            $required = @(
              'assets/LICENSE',
              'assets/THIRD_PARTY_NOTICES.md',
              'assets/third_party/licenses/flixel-2.55-MIT.txt',
              'assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt',
              'assets/third_party/licenses/as3-controller-input-MIT.txt'
            )
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) { throw "Required notice missing from device APK: $entry" }
            }
            if ($entries | Where-Object { $_ -match '(?i)ouya_icon|ouya_.*\.(png|psd)$' }) {
              throw "Retired OUYA publication resource found in device APK."
            }
            $required | Set-Content -Path dist/device-apk-notice-evidence.txt -Encoding utf8
          } finally { $zip.Dispose() }

      - name: Package x64 Android emulator APK
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SLF-emulator-x64.apk
          $androidSdk = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdk)) { $androidSdk = $env:ANDROID_HOME }
          & adt -package -target apk-emulator -arch x64 -storetype pkcs12 -keystore gate2a-benchmark.p12 -storepass gate2a dist/SLF-emulator-x64.apk application.xml -C bin SLFforOuya.swf -C icons/android icons/icon_48.png icons/icon_57.png icons/icon_72.png icons/icon_96.png icons/icon_114.png icons/icon_144.png icons/icon_192.png -C . LICENSE THIRD_PARTY_NOTICES.md -C third_party/licenses flixel-2.55-MIT.txt flixel-power-tools-Simplified-BSD.txt as3-controller-input-MIT.txt -platformsdk $androidSdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $emuZip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/SLF-emulator-x64.apk').Path)
          try {
            $emuEntries = @($emuZip.Entries | ForEach-Object FullName)
            $requiredEmuNotices = @(
              'assets/LICENSE',
              'assets/THIRD_PARTY_NOTICES.md',
              'assets/third_party/licenses/flixel-2.55-MIT.txt',
              'assets/third_party/licenses/flixel-power-tools-Simplified-BSD.txt',
              'assets/third_party/licenses/as3-controller-input-MIT.txt'
            )
            foreach ($entry in $requiredEmuNotices) {
              if ($emuEntries -notcontains $entry) { throw "Required notice missing from emulator APK: $entry" }
            }
            if ($emuEntries | Where-Object { $_ -match '(?i)ouya_icon|ouya_.*\.(png|psd)$' }) {
              throw "Retired OUYA publication resource found in emulator APK."
            }
            $requiredEmuNotices | Set-Content -Path dist/emulator-apk-notice-evidence.txt -Encoding utf8
          } finally { $emuZip.Dispose() }

      - name: Upload fresh SWF if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-runtime-safe-swf
          path: bin/SLFforOuya.swf
          if-no-files-found: ignore

      - name: Upload runtime-safe device APK if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-runtime-safe-apk
          path: dist/SLF-runtime-safe.apk
          if-no-files-found: ignore

      - name: Upload x64 emulator APK if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-emulator-x64-apk
          path: dist/SLF-emulator-x64.apk
          if-no-files-found: ignore

      - name: Upload exact build-environment provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-build-provenance
          path: |
            dist/source-provenance.txt
            dist/build-environment.txt
            dist/air-sdk-sha256-manifest.txt
            dist/android-sdk-installed-packages.txt
            dist/android-sdk-*-sha256-manifest.txt
            dist/notice-source-identities.txt
            dist/device-apk-notice-evidence.txt
            dist/emulator-apk-notice-evidence.txt
          if-no-files-found: error


  android-runtime-smoke:
    needs: baseline-compile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download emulator APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gate2a-emulator-x64-apk
          path: runtime-apk

      - name: Record runtime-smoke platform-tools provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-provenance
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/platform-tools" ]; then
            echo "Android platform-tools unavailable on runtime-smoke runner" >&2
            exit 1
          fi
          find "$SDK_ROOT/platform-tools" -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            rel="${f#"$SDK_ROOT/platform-tools/"}"
            bytes=$(wc -c < "$f" | tr -d ' ')
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s  %s\n' "$sha" "$bytes" "$rel"
          done > smoke-provenance/platform-tools-sha256-manifest.txt
          sha256sum smoke-provenance/platform-tools-sha256-manifest.txt > smoke-provenance/platform-tools-manifest.sha256
          adb version > smoke-provenance/adb-version.txt 2>&1
          sha256sum "$(command -v adb)" > smoke-provenance/adb-binary.sha256

      - name: Write runtime smoke script
        shell: bash
        run: |
          cat > smoke-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          mkdir -p smoke
          APK="runtime-apk/SLF-emulator-x64.apk"
          PACKAGE="com.ramybaheeg.slfport"

          echo "apk=$APK" > smoke/harness.txt
          ls -l runtime-apk >> smoke/harness.txt 2>&1

          adb install -r "$APK" > smoke/install.txt 2>&1
          INSTALL_EXIT=$?
          adb shell pm path "$PACKAGE" > smoke/package-path.txt 2>&1
          if [ "$INSTALL_EXIT" -ne 0 ]; then
            echo "APK install failed with exit $INSTALL_EXIT" | tee smoke/result.txt
            exit 10
          fi
          if ! grep -q '^package:' smoke/package-path.txt; then
            echo "Expected package $PACKAGE was not installed by the exact APK" | tee smoke/result.txt
            exit 14
          fi

          # Make CI deterministic: do not let Android's first-run immersive tutorial or
          # system UI noise stand between the screenshot and the game. Pixel Launcher
          # has repeatedly ANR'd in this headless API-35 image, so suppress its dialogs
          # and stop it before directly launching AIR.
          adb shell settings put secure immersive_mode_confirmations confirmed >/dev/null 2>&1 || true
          adb shell settings put system accelerometer_rotation 0 >/dev/null 2>&1 || true
          adb shell settings put system user_rotation 1 >/dev/null 2>&1 || true
          adb shell settings put global hide_error_dialogs 1 > smoke/system-dialog-policy.txt 2>&1 || true
          adb shell settings get global hide_error_dialogs >> smoke/system-dialog-policy.txt 2>&1 || true
          adb shell am force-stop com.google.android.apps.nexuslauncher > smoke/launcher-force-stop.txt 2>&1 || true
          adb shell wm user-rotation lock 1 > smoke/rotation-command.txt 2>&1 || true
          adb shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          adb shell wm dismiss-keyguard >/dev/null 2>&1 || true
          sleep 5

          dismiss_text() {
            local wanted="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0
            adb pull /sdcard/window.xml smoke/window-ui.xml >/dev/null 2>&1 || return 0
            local coords
            coords=$(python3 - "$wanted" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          wanted = sys.argv[1]
          try:
              root = ET.parse('smoke/window-ui.xml').getroot()
          except Exception:
              sys.exit(0)
          for node in root.iter('node'):
              if node.attrib.get('text') != wanted:
                  continue
              m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
              if m:
                  x1,y1,x2,y2 = map(int,m.groups())
                  print(f'{(x1+x2)//2} {(y1+y2)//2}')
                  break
          PY
            )
            if [ -n "$coords" ]; then
              adb shell input tap $coords >/dev/null 2>&1 || true
              echo "dismissed=$wanted at $coords" >> smoke/dismissed-overlays.txt
              sleep 1
            fi
          }

          adb logcat -c
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -W -n "$PACKAGE/.AIRAppEntry" > smoke/launch-command.txt 2>&1
          LAUNCH_EXIT=$?
          echo "launch_exit=$LAUNCH_EXIT" >> smoke/harness.txt
          sleep 4

          # Dismiss only known emulator/system affordances, never game UI.
          for _ in 1 2 3 4; do
            dismiss_text "Got it"
            dismiss_text "Wait"
            sleep 1
          done
          sleep 8

          PID_LAUNCH=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_LAUNCH" > smoke/pid-after-launch.txt
          adb shell dumpsys window > smoke/window-after-launch.txt 2>&1
          adb exec-out screencap -p > smoke/01-after-launch.png
          adb logcat -d > smoke/logcat-after-launch.txt 2>&1

          if [ -z "$PID_LAUNCH" ]; then
            echo "App process was not alive after deterministic launch" | tee smoke/result.txt
            exit 11
          fi

          CURRENT_FOCUS=$(grep -m1 'mCurrentFocus=' smoke/window-after-launch.txt || true)
          echo "$CURRENT_FOCUS" > smoke/current-focus-after-launch.txt
          if ! echo "$CURRENT_FOCUS" | grep -q "$PACKAGE"; then
            echo "App was alive but not the focused visible window: $CURRENT_FOCUS" | tee smoke/result.txt
            exit 12
          fi

          read SHOT_W SHOT_H < <(python3 - <<'PY'
          import struct
          with open('smoke/01-after-launch.png','rb') as f:
              data=f.read(24)
          if len(data) >= 24 and data[:8] == b'\x89PNG\r\n\x1a\n':
              print(*struct.unpack('>II', data[16:24]))
          else:
              print('0 0')
          PY
          )
          echo "launch_screenshot=${SHOT_W}x${SHOT_H}" > smoke/screenshot-dimensions.txt
          if [ "$SHOT_W" -le "$SHOT_H" ]; then
            echo "Visible app did not present in landscape: ${SHOT_W}x${SHOT_H}" | tee smoke/result.txt
            exit 13
          fi

          X=$((SHOT_W / 2))
          Y=$((SHOT_H / 2))
          echo "tap-center=$X,$Y screenshot=${SHOT_W}x${SHOT_H}" > smoke/tap-coordinates.txt

          # Run 25 proved AIR's synthesized touch-to-mouse path is nondeterministic
          # in this emulator. KEYCODE_X reliably reaches Registry.p1Action instead.
          adb shell input keyevent KEYCODE_X
          sleep 2
          adb shell input keyevent KEYCODE_X
          sleep 8

          PID_MENU=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_MENU" > smoke/pid-after-two-taps.txt
          adb shell dumpsys window > smoke/window-after-two-taps.txt 2>&1
          adb exec-out screencap -p > smoke/02-after-two-taps.png
          adb logcat -d > smoke/logcat-after-two-taps.txt 2>&1

          if [ -z "$PID_MENU" ]; then
            echo "App process died after the two intro presses" | tee smoke/result.txt
            exit 21
          fi

          CURRENT_FOCUS_MENU=$(grep -m1 'mCurrentFocus=' smoke/window-after-two-taps.txt || true)
          echo "$CURRENT_FOCUS_MENU" > smoke/current-focus-after-two-taps.txt
          if ! echo "$CURRENT_FOCUS_MENU" | grep -q "$PACKAGE"; then
            echo "App lost visible focus after intro presses: $CURRENT_FOCUS_MENU" | tee smoke/result.txt
            exit 22
          fi

          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" smoke/logcat-after-two-taps.txt > smoke/fatal-scan.txt; then
            echo "Fatal runtime signature found after intro presses" | tee smoke/result.txt
            exit 23
          fi

          read MENU_W MENU_H < <(python3 - <<'PY'
          import struct
          with open('smoke/02-after-two-taps.png','rb') as f:
              data=f.read(24)
          if len(data) >= 24 and data[:8] == b'\x89PNG\r\n\x1a\n':
              print(*struct.unpack('>II', data[16:24]))
          else:
              print('0 0')
          PY
          )
          echo "menu_candidate_screenshot=${MENU_W}x${MENU_H}" >> smoke/screenshot-dimensions.txt
          if [ "$MENU_W" -le "$MENU_H" ]; then
            echo "Post-intro app did not remain landscape: ${MENU_W}x${MENU_H}" | tee smoke/result.txt
            exit 24
          fi

          # Main-menu and level-select navigation deliberately use the game's own
          # legacy keyboard path. The menu hides FlxG.mouse, so coordinate taps would
          # not exercise the real selection logic. X activates the highlighted item.
          adb shell input keyevent KEYCODE_X
          sleep 4

          PID_LEVEL_SELECT=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_LEVEL_SELECT" > smoke/pid-after-factory-floor.txt
          adb shell dumpsys window > smoke/window-after-factory-floor.txt 2>&1
          adb exec-out screencap -p > smoke/03-level-select.png
          adb logcat -d > smoke/logcat-after-factory-floor.txt 2>&1

          if [ -z "$PID_LEVEL_SELECT" ]; then
            echo "App process died entering level select" | tee smoke/result.txt
            exit 31
          fi
          CURRENT_FOCUS_LEVEL=$(grep -m1 'mCurrentFocus=' smoke/window-after-factory-floor.txt || true)
          echo "$CURRENT_FOCUS_LEVEL" > smoke/current-focus-after-factory-floor.txt
          if ! echo "$CURRENT_FOCUS_LEVEL" | grep -q "$PACKAGE"; then
            echo "App lost visible focus entering level select: $CURRENT_FOCUS_LEVEL" | tee smoke/result.txt
            exit 32
          fi
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" smoke/logcat-after-factory-floor.txt > smoke/fatal-scan-level-select.txt; then
            echo "Fatal runtime signature found entering level select" | tee smoke/result.txt
            exit 33
          fi

          # Fresh saves unlock Levels 1 and 2. Level Select restores Level 1 as the
          # highlighted button, so RIGHT then X deterministically chooses Level 2.
          # Level 2 bypasses the Level-1 cinematic and enters PCPlayState directly.
          adb shell input keyevent KEYCODE_DPAD_RIGHT
          sleep 1
          adb shell input keyevent KEYCODE_X
          sleep 12

          PID_GAMEPLAY=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_GAMEPLAY" > smoke/pid-after-level2.txt
          adb shell dumpsys window > smoke/window-after-level2.txt 2>&1
          adb exec-out screencap -p > smoke/04-level2-gameplay.png
          adb logcat -d > smoke/logcat-after-level2.txt 2>&1

          if [ -z "$PID_GAMEPLAY" ]; then
            echo "App process died entering Level 2 gameplay" | tee smoke/result.txt
            exit 41
          fi
          CURRENT_FOCUS_GAME=$(grep -m1 'mCurrentFocus=' smoke/window-after-level2.txt || true)
          echo "$CURRENT_FOCUS_GAME" > smoke/current-focus-after-level2.txt
          if ! echo "$CURRENT_FOCUS_GAME" | grep -q "$PACKAGE"; then
            echo "App lost visible focus entering Level 2 gameplay: $CURRENT_FOCUS_GAME" | tee smoke/result.txt
            exit 42
          fi
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" smoke/logcat-after-level2.txt > smoke/fatal-scan-level2.txt; then
            echo "Fatal runtime signature found entering Level 2 gameplay" | tee smoke/result.txt
            exit 43
          fi

          read GAME_W GAME_H < <(python3 - <<'PY'
          import struct
          with open('smoke/04-level2-gameplay.png','rb') as f:
              data=f.read(24)
          if len(data) >= 24 and data[:8] == b'\x89PNG\r\n\x1a\n':
              print(*struct.unpack('>II', data[16:24]))
          else:
              print('0 0')
          PY
          )
          echo "level2_candidate_screenshot=${GAME_W}x${GAME_H}" >> smoke/screenshot-dimensions.txt
          if [ "$GAME_W" -le "$GAME_H" ]; then
            echo "Level 2 gameplay candidate did not remain landscape: ${GAME_W}x${GAME_H}" | tee smoke/result.txt
            exit 44
          fi

          # Run 27 visually proved RIGHT landed but the first activation X could be
          # missed by AIR. Send exactly one bounded fallback X, then capture a distinct
          # final proof frame. If gameplay was already entered, X is harmless in-game.
          adb shell input keyevent KEYCODE_X
          sleep 12

          PID_FINAL=$(adb shell pidof "$PACKAGE" | tr -d '\r')
          echo "$PID_FINAL" > smoke/pid-after-fallback-x.txt
          adb shell dumpsys window > smoke/window-after-fallback-x.txt 2>&1
          adb exec-out screencap -p > smoke/05-final-gameplay-proof.png
          adb logcat -d > smoke/logcat-after-fallback-x.txt 2>&1

          if [ -z "$PID_FINAL" ]; then
            echo "App process died after fallback Level 2 activation" | tee smoke/result.txt
            exit 51
          fi
          CURRENT_FOCUS_FINAL=$(grep -m1 'mCurrentFocus=' smoke/window-after-fallback-x.txt || true)
          echo "$CURRENT_FOCUS_FINAL" > smoke/current-focus-after-fallback-x.txt
          if ! echo "$CURRENT_FOCUS_FINAL" | grep -q "$PACKAGE"; then
            echo "App lost visible focus after fallback Level 2 activation: $CURRENT_FOCUS_FINAL" | tee smoke/result.txt
            exit 52
          fi
          if grep -E "FATAL EXCEPTION|Process: $PACKAGE|Fatal signal" smoke/logcat-after-fallback-x.txt > smoke/fatal-scan-fallback-x.txt; then
            echo "Fatal runtime signature found after fallback Level 2 activation" | tee smoke/result.txt
            exit 53
          fi

          echo "PASS-CANDIDATE: app installed, intro and menu path stayed focused in landscape, Level Select remained healthy, Level 2 received RIGHT+X plus one bounded fallback X, and the process remained healthy through the final proof frame. Visual review of 05-final-gameplay-proof.png is required before gameplay proof." | tee smoke/result.txt
          EOF
          chmod +x smoke-runtime.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and exercise intro-to-gameplay path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash smoke-runtime.sh

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-android-runtime-smoke
          path: smoke
          if-no-files-found: warn

      - name: Upload runtime-smoke platform-tools provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate2a-runtime-smoke-tool-provenance
          path: smoke-provenance
          if-no-files-found: error
